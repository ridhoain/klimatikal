      const now = performance.now();
      if (!this.clLast || now - this.clLast > 300) {
        this.clLast = now;
        this.updateContourLabels(); this.updateHazard();
      }
      return;
    }
    clearTimeout(this.clTimer);
    this.clTimer = setTimeout(() => { this.updateContourLabels(); this.updateHazard(); this.updateFronts(); this.updateLows(); }, 150);
  }

  // The layer's values as a Float32Array on the PNG's own grid. Cached, newest
  // few only: a grid is 4 MB.
  async valueGrid(layer, index) {
    const step = this.steps[Math.max(0, Math.min(this.steps.length - 1, index))];
    const key = `${layer}/${step}`;
    this.gridCache = this.gridCache || new Map();
    if (this.gridCache.has(key)) return this.gridCache.get(key);
    const spec = this.manifest.layers[layer];
    const img = new Image();
    img.crossOrigin = "anonymous";
    await new Promise((resolve, reject) => {
      img.onload = resolve; img.onerror = () => reject(new Error(`failed to load ${key}`));
      img.src = `${this.runPrefix}/${layer}/f${String(step).padStart(3, "0")}.png`;
    });
    const cv = document.createElement("canvas");
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    const cx = cv.getContext("2d", { willReadFrequently: true });
    cx.drawImage(img, 0, 0);
    const px = cx.getImageData(0, 0, cv.width, cv.height).data;
    const out = new Float32Array(cv.width * cv.height);
    const g = spec.gamma || 1, span = spec.max - spec.min, wide = spec.encoding === "scalar16";
    for (let n = 0; n < out.length; n++) {
      const unit = wide ? (px[n * 4] * 256 + px[n * 4 + 1]) / 65535 : px[n * 4] / 255;
      out[n] = Math.pow(unit, g) * span + spec.min;
    }
    let grid = out;
    if (wide) {                                   // same smoothing as the contour shader: the cell and four around it, ISO_BLUR away
      const w = cv.width, h = cv.height, R = ISO_BLUR;
      grid = new Float32Array(out.length);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        grid[y * w + x] = 0.2 * (out[y * w + x]
          + out[y * w + Math.max(0, x - R)] + out[y * w + Math.min(w - 1, x + R)]
          + out[Math.max(0, y - R) * w + x] + out[Math.min(h - 1, y + R) * w + x]);
      }
    }
    this.gridCache.set(key, grid);
    while (this.gridCache.size > 6) this.gridCache.delete(this.gridCache.keys().next().value);
    return grid;
  }

  async updateContourLabels() {
    const map = this.map, src = map && map.getSource("contour-labels");
    if (!src) return;
    const item = this.contourLabelItem();
    const empty = { type: "FeatureCollection", features: [] };
    if (!item) {
      if (this.clKey) { this.clKey = null; src.setData(empty); const ex = map.getSource("contour-extrema"); if (ex) ex.setData(empty); }
      return;
    }

    const g = this.manifest.grid, res = 360 / g.width;
    const step = Math.max(this.contourInterval(item), item.labelEvery);
    const b = map.getBounds(), pad = 6;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const x0 = clamp(Math.floor((b.getWest() - pad + 180) / res), 0, g.width - 2);
    const x1 = clamp(Math.ceil((b.getEast() + pad + 180) / res), x0 + 1, g.width - 1);
    const y0 = clamp(Math.floor((90 - (b.getNorth() + pad)) / res), 0, g.height - 2);
    const y1 = clamp(Math.ceil((90 - (b.getSouth() - pad)) / res), y0 + 1, g.height - 1);
    const key = [item.layer, step, Math.round(this.stepIndex * 4), x0, x1, y0, y1].join();
    if (key === this.clKey) return;
    const token = this.clToken = (this.clToken || 0) + 1;

    const i = Math.floor(this.stepIndex), blend = this.stepIndex - i;
    let A, B;
    try { [A, B] = await Promise.all([this.valueGrid(item.layer, i), this.valueGrid(item.layer, i + 1)]); }
    catch (err) { console.warn("contour labels unavailable", err); return; }
    if (token !== this.clToken) return;                // a newer request superseded this one

    const ww = x1 - x0 + 1, wh = y1 - y0 + 1, vals = new Float32Array(ww * wh);
    for (let y = 0; y < wh; y++) for (let x = 0; x < ww; x++) {
      const n = (y0 + y) * g.width + x0 + x;
      vals[y * ww + x] = A[n] + (B[n] - A[n]) * blend;
    }
    const features = [];
    for (const [level, lines] of traceContours(vals, ww, wh, step)) {
      for (const line of lines) {
        if (line.length < 8) continue;                 // a speck: no room for a number
        features.push({ type: "Feature", properties: { t: String(level), v: level }, geometry: { type: "LineString",
          coordinates: smoothLine(line).map(([x, y]) => [-180 + (x0 + x) * res, 90 - (y0 + y) * res]) } });
      }
    }
    const points = [];
    if (item.extrema) {
      for (const e of findExtrema(vals, ww, wh, item.extrema.radius, item.extrema.depth)) {
        points.push({ type: "Feature", properties: { k: e.kind, v: String(Math.round(e.v)), d: e.depth },
          geometry: { type: "Point", coordinates: [-180 + (x0 + e.x) * res, 90 - (y0 + e.y) * res] } });
      }
    }
    this.clKey = key;
    src.setData({ type: "FeatureCollection", features });
    const ex = map.getSource("contour-extrema");
    if (ex) ex.setData({ type: "FeatureCollection", features: points });
  }

  // The label layer sits under the place names, so a town always wins a collision.
  addContourLabels() {
    const map = this.map;
    const ci = Object.values(PRESETS).flatMap((p) => p.stack).find((i) => i.kind === "contour" && i.labelEvery);
    const ramp = RAMPS[ci.ramp];
    map.addSource("contour-labels", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addLayer({
      id: "contour-labels", type: "symbol", source: "contour-labels",
      layout: {
        "symbol-placement": "line", "symbol-spacing": 260, "text-field": ["get", "t"],
        "text-font": ["Open Sans Semibold"], "text-max-angle": 45, "text-padding": 3,
        // Town names are 11.5 px (13 for capitals) at every zoom. These are a
        // step smaller and grow a little with zoom, topping out at 83% of a town.
        "text-size": ["interpolate", ["linear"], ["zoom"], 2, 8, 6, 9.5],
      },
      paint: { "text-color": ["interpolate", ["linear"], ["get", "v"],
                 ...ramp.stops.flatMap(([v, c]) => [v, `rgb(${c[0]},${c[1]},${c[2]})`])],
               "text-halo-color": "rgba(8,12,24,0.9)",
               "text-halo-width": 1.3, "text-halo-blur": 0.3 },
    });
    // H and L at the centres of high and low, in the ends of the contour colour
    // ramp (red high, blue low), with the height under the letter. Deeper
    // centres win a collision.
    const end = (i) => { const c = ramp.stops[i][1]; return `rgb(${c[0]},${c[1]},${c[2]})`; };
    map.addSource("contour-extrema", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addLayer({
      id: "contour-extrema", type: "symbol", source: "contour-extrema",
      layout: {
        "text-field": ["format", ["get", "k"], { "font-scale": 1 }, "\n", {}, ["get", "v"], { "font-scale": 0.5 }],
        "text-font": ["Open Sans Semibold"], "text-size": ["interpolate", ["linear"], ["zoom"], 2, 10.5, 6, 15],
        "text-line-height": 1, "text-padding": 5, "symbol-sort-key": ["-", 0, ["get", "d"]],
      },
      paint: { "text-color": ["case", ["==", ["get", "k"], "H"], end(ramp.stops.length - 1), end(0)],
               "text-halo-color": "rgba(8,12,24,0.92)", "text-halo-width": 1.6, "text-halo-blur": 0.3 },
    });
  }

  hazardSpec() {
    const p = this.preset && PRESETS[this.preset];
    return p && p.hazard;
  }

  // Warning symbols over the areas at or above the hazard level. The visible
  // cells are binned into blocks of about blockPx screen pixels (a block is hot
  // if any cell in it reaches the level), hot blocks within one block of each
  // other are joined, and each joined area gets one symbol at the hot block
  // nearest its centre of mass, labelled with its peak. The block size follows
  // the zoom, which is what makes the grouping dynamic.
  async updateHazard() {
    const map = this.map, src = map && map.getSource("hazard");
    if (!src) return;
    const h = this.hazardSpec();
    const empty = { type: "FeatureCollection", features: [] };
    if (!h || !this.manifest.layers[h.layer]) { if (this.hzKey) { this.hzKey = null; src.setData(empty); } return; }
    const marks = RAMPS[PRESETS[this.preset].main].marks || [];
    const level = (marks.find(([, name]) => name === h.level) || [Infinity])[0];
    const extreme = (marks[marks.length - 1] || [Infinity])[0];

    const g = this.manifest.grid, res = 360 / g.width;
    const pxPerCell = 512 * Math.pow(2, map.getZoom()) / 360 * res;
    const k = Math.max(1, Math.round(h.blockPx / pxPerCell));
    const b = map.getBounds(), pad = 2;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const x0 = clamp(Math.floor((b.getWest() - pad + 180) / res), 0, g.width - 1);
    const x1 = clamp(Math.ceil((b.getEast() + pad + 180) / res), x0, g.width - 1);
    const y0 = clamp(Math.floor((90 - (b.getNorth() + pad)) / res), 0, g.height - 1);
    const y1 = clamp(Math.ceil((90 - (b.getSouth() - pad)) / res), y0, g.height - 1);
    const key = [this.fieldSource(h.layer), level, k, Math.round(this.stepIndex * 4), x0, x1, y0, y1].join();
    if (key === this.hzKey) return;
    const token = this.hzToken = (this.hzToken || 0) + 1;

    const i = Math.floor(this.stepIndex), blend = this.stepIndex - i;
    let A, B;
    const hsrc = this.fieldSource(h.layer);
    try { [A, B] = await Promise.all([this.valueGrid(hsrc, i), this.valueGrid(hsrc, i + 1)]); }
    catch (err) { console.warn("hazard symbols unavailable", err); return; }
    if (token !== this.hzToken) return;

    const bw = Math.ceil((x1 - x0 + 1) / k), bh = Math.ceil((y1 - y0 + 1) / k);
    const peak = new Float32Array(bw * bh).fill(-Infinity), px = new Float32Array(bw * bh), py = new Float32Array(bw * bh);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const n = y * g.width + x, v = A[n] + (B[n] - A[n]) * blend;
      if (v < level) continue;
      const bi = Math.floor((y - y0) / k) * bw + Math.floor((x - x0) / k);
      if (v > peak[bi]) { peak[bi] = v; px[bi] = x; py[bi] = y; }
    }
    const seen = new Uint8Array(bw * bh), features = [];
    for (let s0 = 0; s0 < peak.length; s0++) {
      if (seen[s0] || peak[s0] < level) continue;
      let top = -Infinity, sx = 0, sy = 0, sw = 0, members = [];
      const stack = [s0]; seen[s0] = 1;
      while (stack.length) {
        const c = stack.pop(); members.push(c);
        const w = peak[c] - level + 0.1;
        sx += px[c] * w; sy += py[c] * w; sw += w; top = Math.max(top, peak[c]);
        const cx = c % bw, cy = (c - cx) / bw;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {   // within one empty block of each other
          const nx = cx + dx, ny = cy + dy;
          if (nx < 0 || ny < 0 || nx >= bw || ny >= bh) continue;
          const m = ny * bw + nx;
          if (!seen[m] && peak[m] >= level) { seen[m] = 1; stack.push(m); }
        }
      }
      // the member block closest to the centre of mass
      sx /= sw; sy /= sw;
      let best = members[0], bd = Infinity;
      for (const m of members) { const d = (px[m] - sx) ** 2 + (py[m] - sy) ** 2; if (d < bd) { bd = d; best = m; } }
      features.push({ type: "Feature", properties: { peak: Math.round(top), x: top >= extreme ? 1 : 0, n: members.length },
        geometry: { type: "Point", coordinates: [-180 + (px[best] + 0.5) * res, 90 - (py[best] + 0.5) * res] } });
    }
    this.hzKey = key;
    src.setData({ type: "FeatureCollection", features });
  }

  // ---- Fronts ------------------------------------------------------------------
  // Detected in the pipeline (fronts.py) from the model's 850 hPa wet-bulb
  // temperature, one GeoJSON per forecast step. Every line is oriented with the
  // side the front moves towards on its left, so a symbol that stands "up" from the
  // line (icon anchored at its base, rotated with the line) points the right way:
  // cold = triangles, warm = semicircles, occluded = both, alternating.
  async updateFronts() {
    const map = this.map, src = map && map.getSource("fronts");
    if (!src) return;
    const want = this.frontsOn && this.preset && PRESETS[this.preset].fronts && this.manifest.fronts;
    const i = Math.max(0, Math.min(this.steps.length - 1, Math.round(this.stepIndex)));
    const key = want ? this.steps[i] : null;
    if (key === this.frontKey) return;
    this.frontKey = key;
    const empty = { type: "FeatureCollection", features: [] };
    if (key === null) { src.setData(empty); return; }
    this.frontCache = this.frontCache || new Map();
    const load = (k) => {
      if (!this.frontCache.has(k)) {
        this.frontCache.set(k, fetch(`${this.runPrefix}/fronts/f${String(k).padStart(3, "0")}.json`)
          .then((r) => (r.ok ? r.json() : empty)).catch(() => empty));
        if (this.frontCache.size > 16) this.frontCache.delete(this.frontCache.keys().next().value);
      }
      return this.frontCache.get(k);
    };
    // Fetch the next few steps ahead so playing does not wait on the network.
    for (let a = 1; a <= 3 && i + a < this.steps.length; a++) load(this.steps[i + a]);
    const data = await load(key);
    if (this.frontKey === key) src.setData(data);
  }

  // --- low-pressure tracks -------------------------------------------------
  // pipeline/lows.py finds the lows in the forecast sea-level pressure and joins
  // them step to step into tracks (lows.json, one file per run). Each track is
  // drawn only while it exists: a dot with the central pressure at the current
  // step, the path so far solid, the forecast path dashed. These are the model's
  // lows, not named storms.
  async updateLows(force) {
    const map = this.map, src = map && map.getSource("lows");
    if (!src) return;
    const want = this.lowsOn && this.preset && PRESETS[this.preset].lows && this.manifest.lows;
    const i = Math.max(0, Math.min(this.steps.length - 1, Math.round(this.stepIndex)));
    const key = want ? this.steps[i] : null;
    const stamp = `${key}|${this.runPrefix}`;
    if (!force && stamp === this.lowKey) return;
    this.lowKey = stamp;
    const empty = { type: "FeatureCollection", features: [] };
    if (key === null) { src.setData(empty); return; }
    if (!this.lows || this.lows.prefix !== this.runPrefix) {
      const prefix = this.runPrefix;
      const data = await fetch(`${prefix}/lows.json`).then((r) => (r.ok ? r.json() : null)).catch(() => null);
      this.lows = { prefix, data };
      if (data) this.lows.names = await this.matchStormNames(data);
    }
    if (this.lowKey !== stamp || !this.lows.data) return;
    const features = [];
    for (const t of this.lows.data.tracks) {
      // Longitudes made continuous, so a track crossing the dateline is one line.
      let prev = null;
      const pts = t.pts.map(([step, lon, lat, hpa]) => {
        if (prev !== null) { while (lon - prev > 180) lon -= 360; while (lon - prev < -180) lon += 360; }
        prev = lon;
        return { step, lon, lat, hpa };
      });
      const now = pts.filter((p) => p.step <= key).pop();
      if (!now || key - now.step > 3 || pts[pts.length - 1].step < key) continue;
      const past = pts.filter((p) => p.step <= now.step).map((p) => [p.lon, p.lat]);
      const fut = [[now.lon, now.lat], ...pts.filter((p) => p.step > now.step).map((p) => [p.lon, p.lat])];
      if (past.length > 1) features.push({ type: "Feature", properties: { k: "past" }, geometry: { type: "LineString", coordinates: past } });
      if (fut.length > 1) features.push({ type: "Feature", properties: { k: "fut" }, geometry: { type: "LineString", coordinates: fut } });
      const nm = (this.lows.names || {})[t.id];
      features.push({ type: "Feature", properties: { k: "pt", id: t.id, hpa: Math.round(now.hpa), min: t.min_hpa, minStep: t.min_step,
        ...(nm ? { n: nm.name, by: nm.by } : {}) },
        geometry: { type: "Point", coordinates: [now.lon, now.lat] } });
    }
    src.setData({ type: "FeatureCollection", features });
  }

  // Names come from named-storms.json, kept by hand: each entry says where a named
  // storm's centre was at some time. A track takes the name of the entry it passes
  // closest to, in units of how far a low could have travelled since then.
  async matchStormNames(data) {
    const file = await fetch("named-storms.json", { cache: "no-cache" }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    const names = {};
    if (!file || !Array.isArray(file.storms) || !(this.runStart instanceof Date)) return names;
    const km = (lo1, la1, lo2, la2) => {
      const r = Math.PI / 180, a = Math.sin((la2 - la1) * r / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin((lo2 - lo1) * r / 2) ** 2;
      return 12742 * Math.asin(Math.min(1, Math.sqrt(a)));
    };
    const taken = new Set();
    for (const e of file.storms) {
      const t = Date.parse(e.time);
      if (!e.name || isNaN(t) || typeof e.lon !== "number" || typeof e.lat !== "number") continue;
      let best = null;
      for (const tr of data.tracks) {
        if (taken.has(tr.id)) continue;
        for (const [step, lon, lat] of tr.pts) {
          const dh = Math.abs(this.runStart.getTime() + step * 3600e3 - t) / 3600e3;
          if (dh > 72) continue;
          const ratio = km(e.lon, e.lat, lon, lat) / (110 * dh + 300);
          if (ratio <= 1 && (!best || ratio < best.ratio)) best = { ratio, id: tr.id };
        }
      }
      if (best) { taken.add(best.id); names[best.id] = { name: e.name, by: e.by || "" }; }
    }
    return names;
  }

  addLowLayers() {
    const map = this.map;
    map.addSource("lows", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    const line = (id, k, paint) => map.addLayer({ id, type: "line", source: "lows", filter: ["==", ["get", "k"], k],
      layout: { "line-cap": "round", "line-join": "round" }, paint });
    line("lows-past-casing", "past", { "line-color": "#fff", "line-width": 3.4, "line-opacity": 0.8 });
    line("lows-fut-casing", "fut", { "line-color": "#fff", "line-width": 3.4, "line-opacity": 0.8 });
    line("lows-past", "past", { "line-color": "#1d1d24", "line-width": 1.6 });
    line("lows-fut", "fut", { "line-color": "#1d1d24", "line-width": 1.6, "line-dasharray": [2, 1.6] });
    const depth = ["interpolate", ["linear"], ["get", "hpa"], 950, "#6d0a2a", 975, "#c0392b", 1000, "#e8892b"];
    map.addLayer({ id: "lows-pt", type: "circle", source: "lows", filter: ["==", ["get", "k"], "pt"],
      paint: { "circle-radius": ["interpolate", ["linear"], ["zoom"], 1, 4, 6, 7], "circle-color": depth,
        "circle-stroke-color": "#fff", "circle-stroke-width": 1.4 } });
    map.addLayer({ id: "lows-lbl", type: "symbol", source: "lows", filter: ["==", ["get", "k"], "pt"],
      layout: { "text-field": ["case", ["has", "n"], ["concat", "Storm ", ["get", "n"], "\n", ["to-string", ["get", "hpa"]]], ["to-string", ["get", "hpa"]]],
        "text-font": ["Open Sans Semibold"], "text-size": 11,
        "text-anchor": "top", "text-offset": [0, 0.9], "text-allow-overlap": true },
      paint: { "text-color": "#1d1d24", "text-halo-color": "#fff", "text-halo-width": 1.6 } });
    const tip = () => this.lowTip || (this.lowTip = new maplibregl.Popup({ closeButton: false, closeOnClick: true, offset: 12,
      maxWidth: "none", className: "front-tip" }));
    map.on("click", "lows-pt", (e) => {
      const p = e.features[0].properties;
      const run = this.runStart;
      const when = run instanceof Date && !isNaN(run) ? new Date(run.getTime() + p.minStep * 3600e3).toUTCString().replace(/:\d\d GMT/, " UTC").replace(/^\w+, /, "") : `+${p.minStep} h`;
      tip().setLngLat(e.lngLat).setHTML(`<div style="font:11px/1.4 ui-sans-serif,system-ui,sans-serif;color:#e9edf7;width:200px;white-space:normal">` +
        `<b>${p.n ? `Storm ${escapeHTML(p.n)}` : "Low"} · ${p.hpa} hPa now</b><br>Deepest ${p.min} hPa, ${when}.<br>` +
        `<span style="color:#a9b5d0">${p.n ? `Named by ${escapeHTML(p.by || "the weather services")}; the track is the model's own low.` : "The model's own low, followed through the forecast. Not a named storm."}</span></div>`).addTo(map);
    });
    map.on("mouseenter", "lows-pt", () => { map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", "lows-pt", () => { map.getCanvas().style.cursor = ""; });
  }

  addFrontLayers() {
    const map = this.map;
    const COLD = "#1b4fd8", WARM = "#d8231b", OCC = "#7a2fb5";
    // Symbols are drawn pointing up from a flat base on the line, with a little
    // clear space either side so they do not touch.
    const draw = (w, parts, fill) => {
      const H = 16, cv = document.createElement("canvas"); cv.width = w; cv.height = H;
      const c = cv.getContext("2d");
      c.fillStyle = fill;
      let x = 0;
      for (const kind of parts) {
        c.beginPath();
        if (kind === "tri") { c.moveTo(x + 3, H); c.lineTo(x + 19, H); c.lineTo(x + 11, 2); }
        else c.arc(x + 11, H, 8, Math.PI, 0);
        c.closePath(); c.fill();
        x += 22;
      }
      return c.getImageData(0, 0, w, H);
    };
    map.addImage("front-cold", draw(22, ["tri"], COLD), { pixelRatio: 2 });
    map.addImage("front-warm", draw(22, ["semi"], WARM), { pixelRatio: 2 });
    map.addImage("front-occ", draw(44, ["semi", "tri"], OCC), { pixelRatio: 2 });
    map.addSource("fronts", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    const colour = ["match", ["get", "t"], "c", COLD, "w", WARM, OCC];
    // Troughs: plain black lines, no symbols. Both dashed: long dashes, fainter, for the monsoon trough; short dashes for a pressure trough.
    map.addLayer({ id: "trough-m", type: "line", source: "fronts", filter: ["==", ["get", "t"], "m"],
      layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": "#111", "line-width": ["interpolate", ["linear"], ["zoom"], 1, 1.4, 6, 2.2], "line-dasharray": [6, 3], "line-opacity": 0.5 } });
    map.addLayer({ id: "trough-p", type: "line", source: "fronts", filter: ["==", ["get", "t"], "p"],
      layout: { "line-join": "round" },
      paint: { "line-color": "#111", "line-width": ["interpolate", ["linear"], ["zoom"], 1, 1.1, 6, 1.7], "line-dasharray": [3, 2], "line-opacity": 0.9 } });
    map.addLayer({ id: "fronts-line", type: "line", source: "fronts", filter: ["in", ["get", "t"], ["literal", ["c", "w", "o"]]],
      layout: { "line-cap": "round", "line-join": "round" },
      paint: { "line-color": colour, "line-width": ["interpolate", ["linear"], ["zoom"], 1, 0.9, 6, 1.3], "line-opacity": 0.95 } });
    // A wide, almost invisible copy of the line to hover over; the tip explains the front.
    map.addLayer({ id: "fronts-hit", type: "line", source: "fronts", paint: { "line-color": "#000", "line-width": 14, "line-opacity": 0.01 } });
    const TIPS = {
      c: ["Cold front", "Colder air pushes in under warmer air. Expect a band of showers or storms and gusts, then a drop in temperature and clearer air behind."],
      w: ["Warm front", "Warmer air rises over colder air. Cloud thickens and lowers with steady rain ahead of it, then milder, more humid air behind."],
      m: ["Monsoon trough", "The line where westerly winds on the equator side meet easterlies. Cloud and heavy showers gather along it, and tropical cyclones often form on it."],
      p: ["Pressure trough", "An elongated band of low pressure. Winds turn and converge along it, so expect cloud, showers and a change in wind direction as it passes."],
      o: ["Occluded front", "A cold front has caught up with a warm front and lifted the warm air off the ground. Cloud and rain, often near a deep low, and cooler after."],
    };
    const tip = () => this.frontTip || (this.frontTip = new maplibregl.Popup({ closeButton: false, closeOnClick: false, anchor: "left",
      offset: 14, maxWidth: "none", className: "front-tip" }));
    const show = (e) => {
      const [name, text] = TIPS[e.features[0].properties.t] || TIPS.c;
      map.getCanvas().style.cursor = "pointer";
      tip().setLngLat(e.lngLat).setHTML(`<div style="font:11px/1.4 ui-sans-serif,system-ui,sans-serif;color:#e9edf7;width:210px;white-space:normal">` +
        `<b>${name}</b><br>${text}<br><span style="color:#a9b5d0">Detected from the model's own fields, so approximate.</span></div>`).addTo(map);
    };
    map.on("mouseenter", "fronts-hit", show);
    map.on("mousemove", "fronts-hit", show);
    map.on("click", "fronts-hit", show);          // touch screens have no hover
    map.on("mouseleave", "fronts-hit", () => { map.getCanvas().style.cursor = ""; if (this.frontTip) this.frontTip.remove(); });
    for (const [id, t, icon, spacing] of [["fronts-cold", "c", "front-cold", 22], ["fronts-warm", "w", "front-warm", 22], ["fronts-occ", "o", "front-occ", 22]]) {
      map.addLayer({ id, type: "symbol", source: "fronts", filter: ["==", ["get", "t"], t],
        layout: { "symbol-placement": "line", "symbol-spacing": spacing, "icon-image": icon, "icon-anchor": "bottom",
                  "icon-rotation-alignment": "map", "icon-keep-upright": false,
                  "icon-allow-overlap": true, "icon-ignore-placement": true,
                  "icon-size": 1 } });
    }
  }

  addHazardLayer() {
    const map = this.map;
    // Warning triangle, drawn once: rounded, white edge, "!" cut in white.
    const tri = (fill) => {
      const S = 64, cv = document.createElement("canvas"); cv.width = cv.height = S;
      const c = cv.getContext("2d");
      c.lineJoin = "round"; c.lineWidth = 6;
      c.beginPath(); c.moveTo(S / 2, 7); c.lineTo(S - 7, S - 10); c.lineTo(7, S - 10); c.closePath();
      c.fillStyle = fill; c.strokeStyle = "#fff"; c.fill(); c.stroke();
      c.fillStyle = "#fff"; c.fillRect(S / 2 - 3.5, 24, 7, 17);
      c.beginPath(); c.arc(S / 2, 48, 4.2, 0, Math.PI * 2); c.fill();
      return c.getImageData(0, 0, S, S);
    };
    map.addImage("hazard-danger", tri("#e0312b"), { pixelRatio: 2 });
    map.addImage("hazard-extreme", tri("#7a1fa2"), { pixelRatio: 2 });
    map.addSource("hazard", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addLayer({
      id: "hazard", type: "symbol", source: "hazard",
      layout: {
        "icon-image": ["case", ["==", ["get", "x"], 1], "hazard-extreme", "hazard-danger"],
        "icon-size": ["interpolate", ["linear"], ["zoom"], 2, 0.55, 7, 0.8],
        "icon-allow-overlap": false, "icon-padding": 4,
        "text-field": ["concat", ["to-string", ["get", "peak"]], "°"],
        "text-font": ["Open Sans Semibold"], "text-size": 10, "text-anchor": "top", "text-offset": [0, 0.75],
        "text-optional": true, "symbol-sort-key": ["-", 0, ["get", "peak"]],
      },
      paint: { "text-color": "#fff", "text-halo-color": "rgba(60,8,8,0.95)", "text-halo-width": 1.5 },
    });
    // The triangles pulse (about 1.4 s a beat) so they catch the eye. Updated at
    // ~12 fps and only while there are triangles to draw; people who ask their
    // system for reduced motion get steady ones.
    const still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!still) this.hazardPulse = setInterval(() => {
      const on = map.getSource("hazard") && this.hzKey && !document.hidden;
      if (!on) return;
      const o = 0.65 + 0.35 * Math.cos((performance.now() / 1400) * 2 * Math.PI);   // 0.3 .. 1
      map.setPaintProperty("hazard", "icon-opacity", o);
      map.setPaintProperty("hazard", "text-opacity", Math.max(o, 0.6));
    }, 80);
    // The first pass can run before the map has its final size; redo it once settled.
    map.once("idle", () => { this.hzKey = null; this.scheduleContourLabels(); });

    // Hover (or tap) a triangle: the readings at its hottest cell and why they matter.
    const tip = () => this.hazardTip || (this.hazardTip = new maplibregl.Popup({ closeButton: false, closeOnClick: false,
      offset: 18, maxWidth: "none", className: "front-tip" }));
    const show = async (e) => {
      if (this.preset !== "heat" || !e.features.length) return;
      map.getCanvas().style.cursor = "pointer";
      const f = e.features[0], [lon, lat] = f.geometry.coordinates, token = this.hazardToken = (this.hazardToken || 0) + 1;
      const html = await this.hazardExplain(lon, lat);
      if (token !== this.hazardToken || !html) return;
      tip().setLngLat([lon, lat]).setHTML(html).addTo(map);
    };
    map.on("mouseenter", "hazard", show);
    map.on("click", "hazard", show);              // touch screens have no hover
    map.on("mouseleave", "hazard", () => {
      map.getCanvas().style.cursor = ""; this.hazardToken = (this.hazardToken || 0) + 1;
      if (this.hazardTip) this.hazardTip.remove();
    });
  }

  // The popup over a heat warning triangle: UTCI (sun and shade), wet-bulb and UV
  // at the triangle's cell, each with its level, and a plain reason it is dangerous.
  async hazardExplain(lon, lat) {
    const g = this.manifest.grid, res = 360 / g.width;
    const n = Math.floor((90 - lat) / res) * g.width + Math.floor((lon + 180) / res);
    const i = Math.floor(this.stepIndex), blend = this.stepIndex - i;
    const at = async (layer) => {
      if (!this.manifest.layers[layer]) return null;
      try {
        const [A, B] = await Promise.all([this.valueGrid(layer, i), this.valueGrid(layer, i + 1)]);
        return A[n] + (B[n] - A[n]) * blend;
      } catch (err) { return null; }
    };
    const [sun, shade, wb, uv] = await Promise.all([at("utci_sun"), at("utci_shade"), at("wetbulb"), at("uvi")]);
    if (sun === null && shade === null) return "";
    const lvl = (v, tiers) => tiers.find(([lo]) => v >= lo) || tiers[tiers.length - 1];
    const UTCI = [[46, "Extreme heat stress", "#a02aa8", "Heatstroke is a real risk within minutes to an hour of outdoor activity. The body cannot shed heat fast enough."],
                  [38, "Very strong heat stress", "#e0312b", "Heat exhaustion and heatstroke are likely with any exertion or long exposure. Limit time outdoors to short spells."],
                  [32, "Strong heat stress", "#f6a234", "Heat exhaustion is possible with exertion. Drink often and rest in the shade."],
                  [26, "Moderate heat stress", "#c9b400", "Tiring in the open, mainly with activity."],
                  [-99, "No heat stress", "#8a93a8", ""]];
    const WB = [[35, "At the limit of human tolerance", "#a02aa8", "Hours at this level can kill even fit people resting in the shade."],
                [31, "Dangerous", "#be1e50", "Sweat barely cools the body (hatched on the map). Hours outdoors can overheat people even at rest; older people, children and people with heart or lung disease are most at risk."],
                [28, "Oppressive", "#e0603a", "Sweat evaporates poorly; hard work outdoors becomes risky."],
                [24, "Humid", "#9a8a2a", "Sweat still cools you, but more slowly."],
                [-99, "Comfortable air", "#8a93a8", ""]];
    const UVL = [[11, "Extreme", "#a03cbe", "Unprotected skin burns in minutes; stay out of the midday sun."],
                 [8, "Very high", "#e2322e", "Unprotected skin burns in a few minutes. Cover up and use sunscreen."],
                 [6, "High", "#f68c28", "Skin burns in about 15 to 20 minutes unprotected."],
                 [3, "Moderate", "#c9a800", "Burns are possible in under an hour; protect if outside long."],
                 [-99, "Low", "#8a93a8", ""]];
    const row = (name, v, unit, tiers, extra) => {
      if (v === null) return "";
      const [, label, col, why] = lvl(v, tiers);
      return `<div style="margin-top:6px"><div style="color:#a9b5d0">${name}</div>` +
        `<div><b style="font-size:13px">${v.toFixed(v < 10 ? 1 : 0)}${unit}</b> <span style="color:${col};font-weight:600;filter:brightness(1.35)">${label}</span>${extra || ""}</div>` +
        (why ? `<div style="color:#cfd6e8">${why}</div>` : "") + `</div>`;
    };
    const main = this.shadeOn ? shade : sun;
    const extraSh = (this.shadeOn ? sun : shade) === null ? "" :
      `<span style="color:#a9b5d0"> · ${this.shadeOn ? "in sun" : "in shade"} ${(this.shadeOn ? sun : shade).toFixed(0)}°</span>`;
    const compound = (wb !== null && wb >= 31 && main !== null && main >= 38)
      ? `<div style="margin-top:7px;padding-top:6px;border-top:1px solid rgba(255,255,255,.18);color:#ffb3a8">Heat and humidity together: the body loses its main way of cooling, so the risk is higher than either number suggests.</div>` : "";
    return `<div style="font:11px/1.4 ui-sans-serif,system-ui,sans-serif;color:#e9edf7;width:250px;white-space:normal">` +
      `<b style="font-size:12px">Heat warning · ${Math.abs(lat).toFixed(1)}°${lat < 0 ? "S" : "N"} ${Math.abs(lon).toFixed(1)}°${lon < 0 ? "W" : "E"}</b>` +
      row(`Feels like (UTCI, ${this.shadeOn ? "shade" : "direct sun"})`, main, "°C", UTCI, extraSh) +
      row("Wet-bulb temperature", wb, "°C", WB) + row("UV index", uv, "", UVL) + compound +
      `<div style="margin-top:6px;color:#a9b5d0">Model values for one 0.25° cell at the hottest point; street level can differ.</div></div>`;
  }

  // ---- Day and night ---------------------------------------------------------
  // The sun's position from the date alone (low-precision almanac formulas,
  // good to a fraction of a degree): its declination, and the longitude where
  // it is overhead. Elevation anywhere follows from those two numbers.
  sunAt(date) {
    const rad = Math.PI / 180;
    const n = date.getTime() / 86400000 - 10957.5;               // days since J2000.0
    const L = 280.460 + 0.9856474 * n, gm = (357.528 + 0.9856003 * n) * rad;
    const lam = (L + 1.915 * Math.sin(gm) + 0.020 * Math.sin(2 * gm)) * rad;
    const eps = (23.439 - 0.0000004 * n) * rad;
    const dec = Math.asin(Math.sin(eps) * Math.sin(lam));
    const ra = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam)) / rad;
    const gmst = (18.697374558 + 24.06570982441908 * n) * 15;      // degrees
    let lng = (ra - gmst) % 360;
    if (lng > 180) lng -= 360; if (lng < -180) lng += 360;
    return { dec, lng };
  }

  sunElevation(sun, lat, lng) {
    const rad = Math.PI / 180;
    return Math.asin(Math.sin(lat * rad) * Math.sin(sun.dec)
      + Math.cos(lat * rad) * Math.cos(sun.dec) * Math.cos((lng - sun.lng) * rad)) / rad;
  }

  // The line where the sun is at `elev` degrees, as two polylines (the evening
  // side east of the sun and the morning side west of it), found latitude by
  // latitude from cos(H) = (sin h - sin lat sin dec) / (cos lat cos dec).
  // Longitudes are left unwrapped and drawn three times (-360, 0, +360), which
  // covers the world copies. `ticks` adds short marks pointing into the dark.
  sunLine(sun, elev, latStep, tickDeg) {
    const rad = Math.PI / 180, sinH = Math.sin(elev * rad), sd = Math.sin(sun.dec), cd = Math.cos(sun.dec);
    const east = [], west = [], ticks = [];
    for (let lat = -85; lat <= 85.001; lat += latStep) {
      const c = (sinH - Math.sin(lat * rad) * sd) / (Math.cos(lat * rad) * cd);
      if (Math.abs(c) > 1) { east.push(null); west.push(null); continue; }    // sun never reaches this height here
      const H = Math.acos(c) / rad;
      east.push([sun.lng + H, lat]); west.push([sun.lng - H, lat]);
      if (tickDeg) { ticks.push([[sun.lng + H, lat], [sun.lng + H + tickDeg, lat]]); ticks.push([[sun.lng - H, lat], [sun.lng - H - tickDeg, lat]]); }
    }
    const runs = [];
    for (const side of [east, west]) {
      let cur = [];
      for (const pt of side) { if (pt) cur.push(pt); else { if (cur.length > 1) runs.push(cur); cur = []; } }
      if (cur.length > 1) runs.push(cur);
    }
    return { runs, ticks };
  }

  // The region where the sun is higher than `elev`, as one polygon ring with unwrapped longitudes (drawn
  // three times, like the lines). Per latitude that is the band of longitudes within H of the sun's, where
  // cos(H) = (sin h - sin lat sin dec) / (cos lat cos dec): H is 180 where the sun is always above h (polar
  // day) and 0 where it never is, so the ring stays one simple shape.
  sunPolygon(sun, elev, step) {
    const rad = Math.PI / 180, sinH = Math.sin(elev * rad), sd = Math.sin(sun.dec), cd = Math.cos(sun.dec);
    const west = [], east = [];
    for (let lat = -85; lat <= 85.001; lat += step) {
      const c = (sinH - Math.sin(lat * rad) * sd) / (Math.cos(lat * rad) * cd);
      const H = Math.acos(Math.max(-1, Math.min(1, c))) / rad;
      west.push([sun.lng - H, lat]); east.push([sun.lng + H, lat]);
    }
    return [...west, ...east.reverse(), west[0]];
  }

  dayNightText(lat, lng) {
    const astro = this.astroActive();
    if (!this.nightOn && !astro) return "";
    const t = this.axis[Math.round(this.pos)].t;
    const el = this.sunElevation(this.sunAt(t), lat, lng);
    if (!astro) return (el >= 0 ? "Day" : el >= -18 ? "Twilight" : "Night") + ` · sun ${el.toFixed(0)}°`;
    // Stargazing: the four stages, then the Moon, then what the overlays say here.
    const stage = el >= 0 ? "Day" : el >= -6 ? "Civil twilight" : el >= -12 ? "Nautical twilight" : el >= -18 ? "Astronomical twilight" : "Astronomical night";
    const mo = this.moonAt(t), mel = this.sunElevation(mo, lat, lng);
    return `${stage} · sun ${el.toFixed(0)}° · Moon ${mel >= 0 ? mel.toFixed(0) + "° up" : "down"}, ${Math.round(mo.illum * 100)}% lit` + this.astroValuesText(lat, lng);
  }

  // ---- Stargazing (the "astro" preset) --------------------------------------
  astroActive() { const p = this.preset && PRESETS[this.preset]; return !!(p && p.astro); }
  nightShown() { return this.nightOn || this.astroActive(); }

  // The Moon from the date alone (Meeus' abbreviated series, good to about half a degree, plenty for
  // a rise and set line and a phase): {dec, lng} like sunAt, so sunElevation and sunLine work on it,
  // plus `elong` (degrees east of the sun, 0 new, 180 full) and `illum` (lit fraction, 0..1).
  moonAt(date) {
    const rad = Math.PI / 180;
    const n = date.getTime() / 86400000 - 10957.5;
    const L = 218.316 + 13.176396 * n, M = (134.963 + 13.064993 * n) * rad, F = (93.272 + 13.229350 * n) * rad;
    const lon = (L + 6.289 * Math.sin(M)) * rad, lat = 5.128 * Math.sin(F) * rad;
    const eps = (23.439 - 0.0000004 * n) * rad;
    const dec = Math.asin(Math.sin(lat) * Math.cos(eps) + Math.cos(lat) * Math.sin(eps) * Math.sin(lon));
    const ra = Math.atan2(Math.sin(lon) * Math.cos(eps) - Math.tan(lat) * Math.sin(eps), Math.cos(lon)) / rad;
    const gmst = (18.697374558 + 24.06570982441908 * n) * 15;
    let lng = (ra - gmst) % 360;
    if (lng > 180) lng -= 360; if (lng < -180) lng += 360;
    const sl = ((280.460 + 0.9856474 * n) + 1.915 * Math.sin((357.528 + 0.9856003 * n) * rad)) % 360;   // sun's ecliptic longitude
    const elong = (((lon / rad - sl) % 360) + 360) % 360;
    return { dec, lng, elong, illum: (1 - Math.cos(elong * rad)) / 2 };
  }

  // 16 Moon phases as small icons (0 new, 4 first quarter, 8 full, 12 last quarter).
  moonImages() {
    const out = [], S = 44, r = 14;
    for (let i = 0; i < 16; i++) {
      const cv = document.createElement("canvas"); cv.width = cv.height = S;
      const c = cv.getContext("2d"); c.translate(S / 2, S / 2);
      const e = (i / 16) * 2 * Math.PI, waning = e > Math.PI, ee = waning ? 2 * Math.PI - e : e;
      if (waning) c.scale(-1, 1);
      c.beginPath(); c.arc(0, 0, r, 0, 2 * Math.PI); c.fillStyle = "#46537a"; c.fill();
      // The lit part: the right half-disc, then back up the terminator ellipse (x radius r cos e).
      const a = r * Math.cos(ee);
      c.beginPath();
      for (let t = 0; t <= Math.PI + 1e-6; t += Math.PI / 24) c.lineTo(r * Math.sin(t), -r * Math.cos(t));
      for (let t = Math.PI; t >= -1e-6; t -= Math.PI / 24) c.lineTo(a * Math.sin(t), -r * Math.cos(t));
      c.closePath(); c.fillStyle = "#f4efd8"; c.fill();
      c.beginPath(); c.arc(0, 0, r, 0, 2 * Math.PI); c.lineWidth = 2; c.strokeStyle = "rgba(225,232,250,0.85)"; c.stroke();
      out.push(c.getImageData(0, 0, S, S));
    }
    return out;
  }

  updateNight() {
    const map = this.map, src = map && map.getSource("night-lines");
    this.updateAstro();
    if (!src || !this.axis) return;
    const astro = this.astroActive();
    const show = this.nightShown() ? "visible" : "none";
    for (const id of ["night-casing", "night-line", "night-twilight-casing", "night-twilight", "night-ticks", "night-sun"])
      if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", show);
    for (const id of ["night-moon-casing", "night-moon-line", "night-moon"])
      if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", astro ? "visible" : "none");
    for (const id of ["night-mask-twi", "night-mask-day"])
      if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", astro && this.dayMaskOn ? "visible" : "none");
    if (!this.nightShown()) { this.nightKey = null; return; }
    const t = this.axis[Math.round(this.pos)].t;
    const pxPerDeg = 512 * Math.pow(2, map.getZoom()) / 360;
    const key = `${Math.floor(t.getTime() / 60000)}|${Math.round(map.getZoom() * 2)}|${astro ? "a" : ""}${this.dayMaskOn ? "m" : ""}`;   // once a minute of map time, per half zoom level
    if (key === this.nightKey) return;
    this.nightKey = key;
    const sun = this.sunAt(t);
    const shifts = [-360, 0, 360];
    const line = (runs, props) => runs.flatMap((r) => shifts.map((d) => ({ type: "Feature", properties: props,
      geometry: { type: "LineString", coordinates: r.map(([x, y]) => [x + d, y]) } })));
    const latStep = Math.max(0.5, 14 / pxPerDeg);
    const horizon = this.sunLine(sun, 0, Math.max(0.5, 22 / pxPerDeg), 7 / pxPerDeg);     // ticks every ~22 px, 7 px long
    const features = [
      ...line(this.sunLine(sun, 0, latStep).runs, { k: "horizon" }),
      ...line(this.sunLine(sun, -6, latStep).runs, { k: "civil" }),
      ...line(this.sunLine(sun, -12, latStep).runs, { k: "nautical" }),
      ...(astro ? line(this.sunLine(sun, -18, latStep).runs, { k: "astro" }) : []),
      ...horizon.ticks.flatMap((seg) => shifts.map((d) => ({ type: "Feature", properties: { k: "tick" },
        geometry: { type: "LineString", coordinates: seg.map(([x, y]) => [x + d, y]) } }))),
    ];
    const maskSrc = map.getSource("night-mask");
    if (maskSrc) maskSrc.setData({ type: "FeatureCollection", features: astro && this.dayMaskOn ? [-18, 0].flatMap((elev) =>
      shifts.map((d) => ({ type: "Feature", properties: { k: elev === 0 ? "day" : "twi" },
        geometry: { type: "Polygon", coordinates: [this.sunPolygon(sun, elev, 1).map(([x, y]) => [x + d, y])] } }))) : [] });
    const moon = this.moonAt(t), moonSrc = map.getSource("night-moon-lines"), moonPt = map.getSource("night-moon");
    if (moonSrc) {       // the Moon's rise and set line (geocentric 0.1 degrees is about the topocentric rim on the horizon), ticks on the side where it is down
      const ml = this.sunLine(moon, 0.1, Math.max(0.5, 22 / pxPerDeg), 7 / pxPerDeg);
      moonSrc.setData({ type: "FeatureCollection", features: astro ? [
        ...line(this.sunLine(moon, 0.1, latStep).runs, { k: "moon" }),
        ...ml.ticks.flatMap((seg) => shifts.map((d) => ({ type: "Feature", properties: { k: "mtick" },
          geometry: { type: "LineString", coordinates: seg.map(([x, y]) => [x + d, y]) } }))),
      ] : [] });
    }
    if (moonPt) moonPt.setData({ type: "FeatureCollection", features: astro ? shifts.map((d) => ({ type: "Feature",
      properties: { ph: Math.round(moon.elong / 360 * 16) % 16 }, geometry: { type: "Point", coordinates: [moon.lng + d, moon.dec * 180 / Math.PI] } })) : [] });
    src.setData({ type: "FeatureCollection", features });
    const sunPt = map.getSource("night-sun");
    if (sunPt) sunPt.setData({ type: "FeatureCollection", features: shifts.map((d) => ({ type: "Feature", properties: {},
      geometry: { type: "Point", coordinates: [sun.lng + d, sun.dec * 180 / Math.PI] } })) });
  }

  addNightLayers() {
    const map = this.map;
    const before = map.getLayer("coast-casing") ? "coast-casing" : undefined;
    const sunImg = () => {
      const S = 48, cv = document.createElement("canvas"); cv.width = cv.height = S;
      const c = cv.getContext("2d"); c.translate(S / 2, S / 2);
      c.strokeStyle = "#ffd24a"; c.lineWidth = 3; c.lineCap = "round";
      for (let i = 0; i < 8; i++) { c.rotate(Math.PI / 4); c.beginPath(); c.moveTo(0, 11); c.lineTo(0, 18); c.stroke(); }
      c.beginPath(); c.arc(0, 0, 8, 0, Math.PI * 2); c.fillStyle = "#ffd24a"; c.fill();
      c.lineWidth = 2; c.strokeStyle = "rgba(60,40,0,0.8)"; c.stroke();
      return c.getImageData(0, 0, S, S);
    };
    map.addImage("sun", sunImg(), { pixelRatio: 2 });
    const empty = { type: "FeatureCollection", features: [] };
    map.addSource("night-lines", { type: "geojson", data: empty });
    map.addSource("night-sun", { type: "geojson", data: empty });
    const vis = { visibility: this.nightShown() ? "visible" : "none" };
    const on = (k) => ["==", ["get", "k"], k];
    this.moonImages().forEach((img, i) => map.addImage(`moon${i}`, img, { pixelRatio: 2 }));
    // Stargazing's daylight mask: twilight (sun above -18 degrees) a light white veil, daylight (above 0) on top of
    // it as bright white, so the dark map that is left is the sky you can actually use. Added first so the night
    // lines and the coast draw over it, above the weather and overlays.
    map.addSource("night-mask", { type: "geojson", data: empty });
    const maskVis = { visibility: this.astroActive() && this.dayMaskOn ? "visible" : "none" };
    map.addLayer({ id: "night-mask-twi", type: "fill", source: "night-mask", filter: ["==", ["get", "k"], "twi"], layout: maskVis,
      paint: { "fill-color": "#ffffff", "fill-opacity": 0.3, "fill-antialias": false } }, before);
    map.addLayer({ id: "night-mask-day", type: "fill", source: "night-mask", filter: ["==", ["get", "k"], "day"], layout: maskVis,
      paint: { "fill-color": "#ffffff", "fill-opacity": 0.72, "fill-antialias": false } }, before);
    map.addSource("night-moon-lines", { type: "geojson", data: empty });
    map.addSource("night-moon", { type: "geojson", data: empty });
    // Dark casing under the light lines so they read on pale and dark fields alike.
    map.addLayer({ id: "night-casing", type: "line", source: "night-lines", filter: ["any", on("horizon"), on("tick")],
      layout: { ...vis, "line-cap": "round" }, paint: { "line-color": "rgba(8,12,24,0.5)", "line-width": 3.4 } }, before);
    // The twilight lines get their own dark casing too: the white daylight mask would swallow a bare white line.
    map.addLayer({ id: "night-twilight-casing", type: "line", source: "night-lines", filter: ["any", on("civil"), on("nautical"), on("astro")],
      layout: vis, paint: { "line-color": "rgba(8,12,24,0.45)", "line-width": 2.6 } }, before);
    map.addLayer({ id: "night-twilight", type: "line", source: "night-lines", filter: ["any", on("civil"), on("nautical"), on("astro")],
      layout: vis, paint: { "line-color": ["case", on("astro"), "rgba(176,150,255,0.95)", "rgba(255,255,255,0.75)"],
        "line-width": ["case", on("astro"), 1.4, 1], "line-dasharray": [2, 3],
        "line-opacity": ["case", on("nautical"), 0.55, 1] } }, before);
    // The Moon's rise and set line: pale blue, ticks on the side where the Moon is down. Shown only in Stargazing.
    const mvis = { visibility: this.astroActive() ? "visible" : "none" };
    map.addLayer({ id: "night-moon-casing", type: "line", source: "night-moon-lines",
      layout: { ...mvis, "line-cap": "round" }, paint: { "line-color": "rgba(8,12,24,0.5)", "line-width": 3.4 } }, before);
    map.addLayer({ id: "night-moon-line", type: "line", source: "night-moon-lines",
      layout: { ...mvis, "line-cap": "round" }, paint: { "line-color": "rgba(150,205,255,0.95)", "line-width": 1.4 } }, before);
    map.addLayer({ id: "night-line", type: "line", source: "night-lines", filter: ["any", on("horizon"), on("tick")],
      layout: { ...vis, "line-cap": "round" }, paint: { "line-color": "rgba(255,255,255,0.95)", "line-width": 1.5 } }, before);
    map.addLayer({ id: "night-sun", type: "symbol", source: "night-sun",
      layout: { ...vis, "icon-image": "sun", "icon-size": 0.6, "icon-allow-overlap": true } });
    map.addLayer({ id: "night-moon", type: "symbol", source: "night-moon",
      layout: { ...mvis, "icon-image": ["concat", "moon", ["to-string", ["get", "ph"]]], "icon-size": 0.85, "icon-allow-overlap": true } });
    this.updateNight();
  }

  // ---- Stargazing overlays: aurora and light glow ---------------------------
  // Each is a small grid image published next to the forecast (aurora/, darksky/). The page decodes the
  // value from the red channel (like the forecast PNGs), colours it, projects it to Web Mercator on a
  // canvas and hands MapLibre the canvas, under the weather layer so that cloud veils it. Both are
  // optional: a file that is not published leaves its button hidden.
  async astroFetch(path) {
    const meta = await fetch(`${DATA}/${path}`, { cache: "no-cache" }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    if (!meta || !meta.image) return null;
    const img = new Image();
    img.crossOrigin = "anonymous";            // required: the data is on another origin
    try {
      await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = `${DATA}/${meta.image}?v=${encodeURIComponent(meta.updated || meta.year || "")}`; });
    } catch (err) { console.warn("stargazing overlay image unavailable", path, err); return null; }
    const cv = document.createElement("canvas");
    cv.width = img.width; cv.height = img.height;
    const cx = cv.getContext("2d", { willReadFrequently: true });
    cx.drawImage(img, 0, 0);
    const px = cx.getImageData(0, 0, img.width, img.height).data;
    const v = new Uint8Array(img.width * img.height);
    for (let i = 0; i < v.length; i++) v[i] = px[i * 4];
    return { meta, w: img.width, h: img.height, v };
  }

  // A 256-entry colour table from [value, r, g, b, a] stops (value 0..vmax in table steps of vmax/255).
  astroLut(stops, vmax) {
    const lut = new Uint8ClampedArray(256 * 4);
    for (let i = 0; i < 256; i++) {
      const x = i / 255 * vmax;
      let a = stops[0], b = stops[stops.length - 1];
      for (let k = 0; k < stops.length - 1; k++) if (x >= stops[k][0] && x <= stops[k + 1][0]) { a = stops[k]; b = stops[k + 1]; break; }
      const f = x <= a[0] ? 0 : x >= b[0] ? 1 : (x - a[0]) / (b[0] - a[0]);
      for (let c = 0; c < 4; c++) lut[i * 4 + c] = a[c + 1] + (b[c + 1] - a[c + 1]) * f;
    }
    return lut;
  }

  // Colour a grid (equirectangular, north first, 180 W first) into a square Web Mercator canvas.
  // `cells` is true when a value stands for a cell (the 0.1 degree light image) and false when it stands
  // for a point (the 1 degree aurora grid, row 0 at exactly 90 N). Bilinear, wrapping in longitude.
  astroCanvas(g, name) {
    const S = name === "lights" ? 2048 : 1024, cells = name === "lights";
    let lut;
    if (name === "lights") {
      // The stored code is log radiance, so the table is built over codes: code -> radiance -> stops.
      const dn = g.meta.units === "dn", lo = g.meta.lo_nw, hi = g.meta.hi_nw, st = (dn ? ASTRO.lightsDN : ASTRO.lights).stops;
      lut = new Uint8ClampedArray(256 * 4);
      for (let i = 0; i < 256; i++) {
        const rad = dn ? i / 255 * g.meta.dn_max : i === 0 ? 0 : lo * Math.pow(hi / lo, i / 255);
        let a = st[0], b = st[st.length - 1];
        for (let k = 0; k < st.length - 1; k++) if (rad >= st[k][0] && rad <= st[k + 1][0]) { a = st[k]; b = st[k + 1]; break; }
        const f = rad <= a[0] ? 0 : rad >= b[0] ? 1 : dn ? (rad - a[0]) / (b[0] - a[0]) : Math.log(rad / a[0]) / Math.log(b[0] / a[0]);
        for (let c = 0; c < 4; c++) lut[i * 4 + c] = (rad <= st[0][0] ? st[0][c + 1] : a[c + 1] + (b[c + 1] - a[c + 1]) * f);
      }
    } else lut = this.astroLut(ASTRO.aurora.stops, 255);     // aurora values are 0..100; the table is over 0..255 so index = value
    const cv = document.createElement("canvas");
    cv.width = cv.height = S;
    const cx = cv.getContext("2d");
    const out = cx.createImageData(S, S), o = out.data;
    const fx = new Float32Array(S);
    for (let x = 0; x < S; x++) fx[x] = (x + 0.5) / S * g.w - (cells ? 0.5 : 0);     // point grids sit on whole degrees, cell grids half a cell in
    for (let y = 0; y < S; y++) {
      const lat = Math.atan(Math.sinh(Math.PI * (1 - 2 * (y + 0.5) / S))) * 180 / Math.PI;
      let fy = cells ? (90 - lat) / 180 * g.h - 0.5 : (90 - lat) / 180 * (g.h - 1);
      fy = Math.max(0, Math.min(g.h - 1, fy));
      const y0 = Math.floor(fy), y1 = Math.min(g.h - 1, y0 + 1), ty = fy - y0;
      for (let x = 0; x < S; x++) {
        const px = fx[x], x0f = Math.floor(px), tx = px - x0f;
        const x0 = ((x0f % g.w) + g.w) % g.w, x1 = (x0 + 1) % g.w;
        const v = (g.v[y0 * g.w + x0] * (1 - tx) + g.v[y0 * g.w + x1] * tx) * (1 - ty)
                + (g.v[y1 * g.w + x0] * (1 - tx) + g.v[y1 * g.w + x1] * tx) * ty;
        const i4 = Math.max(0, Math.min(255, Math.round(v))) * 4, k = (y * S + x) * 4;
        o[k] = lut[i4]; o[k + 1] = lut[i4 + 1]; o[k + 2] = lut[i4 + 2]; o[k + 3] = lut[i4 + 3];
      }
    }
    cx.putImageData(out, 0, 0);
    return cv;
  }

  async astroLoad(name) {
    const g = await this.astroFetch(name === "lights" ? "darksky/darksky.json" : "aurora/aurora.json");
    const map = this.map;
    this.astro = this.astro || {};
    if (!g) { this.astro[name] = this.astro[name] || null; this.paintAstroButtons && this.paintAstroButtons(); return; }
    const old = this.astro[name];
    if (old && old.meta.updated === g.meta.updated && old.meta.year === g.meta.year) return;   // nothing new
    this.astro[name] = g;
    const id = `astro-${name}`;
    if (map.getLayer(id)) map.removeLayer(id);
    if (map.getSource(id)) map.removeSource(id);
    const top = 85.0511287798, cv = this.astroCanvas(g, name);
    // An image source from a PNG blob URL, not a canvas source (which lost the transparency). MapLibre
    // fetches it, so connect-src in _headers must allow blob:. The previous URL (an aurora refresh) is freed.
    const blob = await new Promise((ok) => cv.toBlob(ok, "image/png"));
    this.astroUrls = this.astroUrls || {};
    if (this.astroUrls[name]) URL.revokeObjectURL(this.astroUrls[name]);
    this.astroUrls[name] = URL.createObjectURL(blob);
    map.addSource(id, { type: "image", url: this.astroUrls[name], coordinates: [[-180, top], [180, top], [180, -top], [-180, -top]] });
    // Light glow under the aurora, both under the weather layer.
    const before = name === "lights" && map.getLayer("astro-aurora") ? "astro-aurora" : "weather";
    map.addLayer({ id, type: "raster", source: id, layout: { visibility: "none" },
      paint: { "raster-opacity": 1, "raster-fade-duration": 0, "raster-resampling": "linear" } }, before);
    this.paintAstroButtons && this.paintAstroButtons();
    this.updateAstro();
    this.paintLegend(); this.paintCredit();
    map.triggerRepaint();
  }

  // The OVATION nowcast says nothing about the hours the slider can reach beyond its time.
  auroraValid() {
    const a = this.astro && this.astro.aurora;
    if (!a || !this.axis) return false;
    const t = this.axis[Math.round(this.pos)].t.getTime(), ref = Date.parse(a.meta.forecast_time);
    return Math.abs(t - ref) <= ASTRO.auroraWindowH * 3600e3;
  }

  updateAstro() {
    const map = this.map;
    if (!map || !map.getLayer("weather")) return;
    const on = this.astroActive();
    if (on && !this.astro) {
      this.astro = {};
      this.astroLoad("lights"); this.astroLoad("aurora");
      this.astroTimer = setInterval(() => this.astroActive() && this.astroLoad("aurora"), 10 * 60e3);
    }
    if (!this.astro) return;
    const show = (name, want) => { const id = `astro-${name}`; if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", want ? "visible" : "none"); };
    show("lights", on && this.lightsOn);
    show("aurora", on && this.auroraOn && this.auroraValid());
    this.paintAstroButtons && this.paintAstroButtons();
  }

  astroSample(g, lat, lng, cells) {
    const x = cells ? Math.floor((lng + 180) / 360 * g.w) : Math.round((lng + 180) / 360 * g.w);
    const y = cells ? Math.min(g.h - 1, Math.floor((90 - lat) / 180 * g.h)) : Math.round((90 - lat) / 180 * (g.h - 1));
    return g.v[Math.max(0, Math.min(g.h - 1, y)) * g.w + (((x % g.w) + g.w) % g.w)];
  }

  // What the two overlays say at a point, for the hover box (leading " · " included, or "").
  astroValuesText(lat, lng) {
    const bits = [];
    const A = this.astro;
    if (A && A.aurora && this.auroraOn && this.auroraValid()) {
      const p = this.astroSample(A.aurora, lat, lng, false);
      if (p >= 2) bits.push(`aurora ${p} %`);
    }
    if (A && A.lights && this.lightsOn) {
      const m = A.lights.meta, code = this.astroSample(A.lights, lat, lng, true);
      const dn = m.units === "dn";
      const rad = dn ? code / 255 * m.dn_max : code === 0 ? 0 : m.lo_nw * Math.pow(m.hi_nw / m.lo_nw, code / 255);
      const cls = [...(dn ? ASTRO.lightsDN : ASTRO.lights).classes].reverse().find(([th]) => rad >= th)[1];
      // The index has no physical unit, so only the radiance version quotes a number.
      bits.push(`light glow: ${cls.toLowerCase()}${!dn && code ? ` (${rad < 10 ? rad.toFixed(1) : Math.round(rad)} nW)` : ""}`);
    }
    return bits.length ? " · " + bits.join(" · ") : "";
  }

  // A pop-up beside the cursor while it is over visible aurora: the chance, what it means, Kp, where to look.
  auroraPop(e) {
    let el = document.getElementById("aurora-pop");
    const A = this.astro && this.astro.aurora;
    const p = e && A && this.astroActive() && this.auroraOn && this.auroraValid() ? this.astroSample(A, e.lngLat.lat, e.lngLat.lng, false) : 0;
    if (p < ASTRO.aurora.classes[ASTRO.aurora.classes.length - 1][0]) { if (el) el.hidden = true; return; }
    if (!el) { el = document.createElement("div"); el.id = "aurora-pop"; document.body.appendChild(el); }
    const cls = ASTRO.aurora.classes.find(([th]) => p >= th)[1];
    const m = A.meta, lat = e.lngLat.lat;
    const when = tzParts(new Date(m.forecast_time), this.useUTC);
    const kp = this.kpText();
    el.innerHTML = `<b>Aurora · ${p} %</b>${cls} chance of visible aurora here` +
      `<small>Look toward the ${lat >= 0 ? "north" : "south"} horizon, from a dark place under clear sky.</small>` +
      `<small>NOAA OVATION nowcast for ${when.hm} ${when.label}${kp ? " · " + escapeHTML(kp) : ""}</small>`;
    el.hidden = false;
    const oe = e.originalEvent, w = el.offsetWidth, h = el.offsetHeight;
    el.style.left = `${Math.max(8, Math.min(innerWidth - w - 8, oe.clientX + 16))}px`;
    el.style.top = `${Math.max(8, Math.min(innerHeight - h - 8, oe.clientY + 16))}px`;
  }

  // A short explanation while the cursor is on a day/night, twilight or Moon line. Returns true when it shows one.
  linePop(e) {
    let el = document.getElementById("line-pop");
    const hide = () => { if (el) el.hidden = true; return false; };
    if (!e || !this.nightShown()) return hide();
    const layers = ["night-line", "night-twilight", "night-moon-line"].filter((id) => this.map.getLayer(id));
    const r = 5, { x, y } = e.point;
    const f = this.map.queryRenderedFeatures([[x - r, y - r], [x + r, y + r]], { layers })[0];
    const k = f && f.properties.k;
    const T = {
      horizon: ["Sunrise and sunset line", "The Sun is on the horizon. Day is on one side; the ticks point into the dark."],
      tick: ["Sunrise and sunset line", "The Sun is on the horizon. Day is on one side; the ticks point into the dark."],
      civil: ["Civil twilight · Sun 6° below", "The sky is still bright; only the brightest planets and stars show."],
      nautical: ["Nautical twilight · Sun 12° below", "The horizon is fading; most stars are out."],
      astro: ["Astronomical night starts · Sun 18° below", "The sky is fully dark. Beyond this line is the best time to observe."],
      moon: ["Moonrise and moonset line", "The Moon is on the horizon. The ticks are on the side where it is down."],
    }[k];
    if (!T) return hide();
    if (!el) { el = document.createElement("div"); el.id = "line-pop"; document.body.appendChild(el); }
    el.innerHTML = `<b>${T[0]}</b>${T[1]}`;
    el.hidden = false;
    const oe = e.originalEvent, w = el.offsetWidth, h = el.offsetHeight;
    el.style.left = `${Math.max(8, Math.min(innerWidth - w - 8, oe.clientX + 16))}px`;
    el.style.top = `${Math.max(8, Math.min(innerHeight - h - 8, oe.clientY + 16))}px`;
    return true;
  }

  kpText() {
    const m = this.astro && this.astro.aurora && this.astro.aurora.meta;
    if (!m || m.kp_now == null) return "";
    return `Kp now ${m.kp_now.toFixed(1)}` + (m.kp_max_24h != null ? `, up to ${m.kp_max_24h.toFixed(1)} in the next 24 hours.` : ".");
  }

  contourIntervalText() {
    const c = this.renderStack().find((i) => i.kind === "contour");
    return c ? String(this.contourInterval(c)) : "";
  }

  // A preset is offered only when the run has every layer it needs, and
  // isobars only from a 16-bit field (older runs have 8-bit pressure, which
  // draws as thick wandering bands).
  presetAvailable(id) {
    return PRESETS[id].stack.every((i) => {
      const spec = this.manifest.layers[i.kind === "particles" ? i.layer : dataOf(i)];
      return spec && (i.kind !== "contour" || i.allow8bit || spec.encoding === "scalar16");
    });
  }

  setPreset(id) {
    this.preset = id;
    if (id) this.layer = PRESETS[id].main;
    this.paintLayerButtons();
    this.paintShadeButton && this.paintShadeButton();
    this.paintUvButton && this.paintUvButton();
    this.paintHeatGroup && this.paintHeatGroup();
    this.nightKey = null; this.updateNight();           // the Stargazing preset brings its own night lines and overlays
    this.writeURL(); this.paintReadoutLabel(); this.paintLegend(); this.paintBoundaryStyle();
    this.scheduleContourLabels();
    this.map && this.map.triggerRepaint();
  }

  paintLayerButtons() {
    document.querySelectorAll("#layers button[data-layer]").forEach((c) =>
      c.setAttribute("aria-pressed", String(!this.preset && c.dataset.layer === this.layer)));
    document.querySelectorAll("#presets button[data-preset]").forEach((c) =>
      c.setAttribute("aria-pressed", String(c.dataset.preset === this.preset)));
  }

  // The layer whose PNG colours the map and feeds the hover value. Wind is
  // drawn from the 16-bit speed layer when the run has one (the u/v pair is
  // only 8-bit and bands in light wind); the particles still use u/v. Runs
  // published before that layer existed fall back to u/v.
  fieldSource(name) {
    if (name === "utci_sun") return this.shadeOn && this.manifest.layers.utci_shade ? "utci_shade" : "utci_sun";
    const src = FIELD_SOURCE[name];
    return src && this.manifest.layers[src] ? src : name;
  }

  // The frame to draw: two steps and how far between them we are.
  currentFrame(layerName) {
    const name = layerName || this.layer;
    const spec = this.manifest.layers[name];
    if (!spec) return null;
    const i = Math.floor(this.stepIndex);
    const now = this.textureFor(name, i);
    if (!now) return null;
    const next = this.textureFor(name, i + 1) || now;
    return { name, spec, now, next, blend: this.stepIndex - i };
  }

  buildChrome() {
    const box = document.getElementById("layers");
    const presetBox = document.getElementById("presets");
    const available = Object.keys(PRESETS).filter((id) => this.presetAvailable(id) && !(PRESETS[id].legacy && this.presetAvailable("heat"))).sort((a, b) => PRESETS[a].order - PRESETS[b].order);
    for (const id of available) {
      const b = document.createElement("button");
      b.className = "preset";
      b.innerHTML = `<img class="pthumb" src="brand/preset-${id === "heatlegacy" ? "heat" : id}.jpg" alt="" onerror="this.remove()"><span></span>`;
      b.lastChild.textContent = PRESETS[id].label;
      b.dataset.tip = PRESET_BRIEF[id] || PRESETS[id].goal;
      b.dataset.preset = id;
      b.onclick = () => this.setPreset(this.preset === id ? null : id);
      if (id === "heat" || id === "synoptic" || id === "astro") {
        // A preset button and its own switches form one group: Heat stress with Sun / Shade and UV,
        // Synoptic overview with Fronts. The group is outlined while that preset is selected.
        const grp = document.createElement("span");
        grp.className = "grp";
        grp.dataset.preset = id;
        grp.appendChild(b);
        presetBox.appendChild(grp);
        (this.presetGroups = this.presetGroups || {})[id] = grp;
      } else presetBox.appendChild(b);
    }
    presetBox.hidden = !available.length;
    for (const name of Object.keys(this.manifest.layers)) {
      if (this.manifest.layers[name].hidden) continue;   // data-only layers, e.g. windspeed
      const b = document.createElement("button");
      const full = this.manifest.layers[name].label || name;
      const label = full.charAt(0).toUpperCase() + full.slice(1);
      if (LAYER_ICON[name]) { b.innerHTML = LAYER_ICON[name]; b.classList.add("ico"); }
      else b.textContent = label;
      b.setAttribute("aria-label", label);
      b.dataset.tip = label;
      b.dataset.layer = name;
      b.onclick = () => {
        this.layer = name;
        this.preset = null;
        this.paintLayerButtons();
        this.paintAstroButtons && this.paintAstroButtons();
        this.nightKey = null; this.updateNight();      // leaving Stargazing takes its lines and overlays with it
        this.writeURL();
        this.scheduleContourLabels(); this.paintReadoutLabel(); this.paintLegend(); this.paintBoundaryStyle();
        this.map && this.map.triggerRepaint();
      };
      box.appendChild(b);
    }

    this.paintLayerButtons();
    // The reading of the map: a pop-up while the pointer is over the (i) (or it has focus);
    // a click pins it open, which is how a touch screen gets it.
    const legendEl = document.getElementById("legend");
    legendEl.addEventListener("mouseover", (e) => { if (e.target.closest(".info")) this.showExplain(); });

  paintCredit() {
    const sat = this.satOn && this.satManifest ? ` · ${escapeHTML(this.satManifest.attribution)}` : "";
    // Radar credit comes from the radar manifest, so it appears only while the
    // layer is on and the manifest names a source. The demo manifest has none.
    const rm = this.radarManifest;
    const radar = this.radarOn && rm && !rm.demo && rm.attribution ? ` · ${escapeHTML(rm.attribution)}` : "";
    const osm = this.osmReady ? " · Coast and lakes: © OpenStreetMap contributors via OpenFreeMap" : "";
    const terr = this.terrainOn ? " · Terrain: AWS Open Data Terrain Tiles (NASA SRTM, USGS, ETOPO1 and others)" : "";
    const storms = this.tropicalOn && this.tropical && this.tropical.attribution ? ` · ${escapeHTML(this.tropical.attribution)}` : "";
    const ap = this.astroActive() && this.astro;
    const astro = ap ? [this.lightsOn && ap.lights && ap.lights.meta.attribution, this.auroraOn && ap.aurora && ap.aurora.meta.attribution]
      .filter(Boolean).map((t) => ` · ${escapeHTML(t)}`).join("") : "";
    const el = document.getElementById("credit");
    // The data credits are one click away rather than always on screen.
    if (!el.dataset.wired) {
      el.dataset.wired = "1";
      el.addEventListener("click", (e) => {
        if (!e.target.closest("#credit-btn")) return;
        this.creditOpen = !this.creditOpen;
        this.paintCredit();
      });
    }
    const open = !!this.creditOpen;
    el.innerHTML =
      `<button type="button" id="credit-btn" aria-expanded="${open}" aria-controls="credit-more" title="${open ? "Hide" : "Show"} data credits">© 2026 Klimatikal</button>` +
      `<span id="credit-more"${open ? "" : " hidden"}> · ${escapeHTML(this.manifest.attribution)} · run ${escapeHTML(this.manifest.run)}${sat}${radar}${storms}${astro}${terr}${osm} · <a href="/privacy/">Privacy</a></span>`;
  }

  // Colour key for the active layer, built from the same RAMPS table the
  // shader's colour texture is built from.
  paintLegend() {
    const preset = this.preset && PRESETS[this.preset];
    // The key follows what is drawn: a preset whose main layer is shown as lines
    // names the ramp those lines use.
    const keyLayer = (preset && preset.keyRamp) || this.layer;
    const r = RAMPS[keyLayer];
    const spec = this.manifest.layers[keyLayer === "utci_sun" ? this.fieldSource(keyLayer) : keyLayer];
    if (!r) return;
    const [lo, hi] = r.display;
    const n = r.stops.length;
    const at = (i) => (r.evenLegend ? i / (n - 1) : (r.stops[i][0] - lo) / (hi - lo));
    // The key shows the minimum end as solid white, matching the map where
    // there is no precipitation (or no value).
    const gradient = r.stops.map(([, c], i) =>
      (i === 0 && r.legendMinWhite)
        ? `rgb(255,255,255) ${(at(i) * 100).toFixed(1)}%`
        : `rgba(${c[0]},${c[1]},${c[2]},${(c[3] / 255 * r.opacity).toFixed(3)}) ${(at(i) * 100).toFixed(1)}%`
    ).join(", ");
    const ticks = r.evenLegend
      ? r.stops.map(([v], i) => ({ v: Number((v * (r.showScale || 1)).toFixed(2)), p: at(i) }))
      : r.ticks.map((v) => ({ v, p: (v - lo) / (hi - lo) }));
    // A ramp with `marks` names its thresholds (heat danger levels): each gets a
    // line across the bar and its name beside it.
    const named = r.marks && r.marks.map(([v, name]) => ({ v, text: `${name} ${v}`, p: (v - lo) / (hi - lo) }));
    let html = r.discrete
      ? this.legendClasses(spec ? spec.label : keyLayer, r.unitLabel, r)
      : this.legendColumn(r.label || (spec ? spec.label : keyLayer), r.unitLabel, gradient, named || ticks, "", !!named);
    html += this.astroLegendHTML();
    if (this.radarOn) html += this.radarLegendHTML();
    if (this.satOn && this.satManifest) html += this.satLegendHTML();
    // "i" shows the plain-language reading of the map; hidden until asked for.
    if (preset && preset.explain) {
      html = `<button type="button" class="info" aria-pressed="${this.legendInfo}" aria-label="What does this map show?" ` +
        `title="What does this map show?">i</button>` + html;
    }
    document.getElementById("legend").innerHTML = html;
    // The reading of the map (and the overlay key) is a pop-up beside the (i), not part of the box.
    const keys = document.getElementById("legend2");
    keys.hidden = true; keys.innerHTML = "";
    if (!preset || !preset.explain) this.hideExplain();
    else if (this.legendInfo) this.showExplain();
    else if (this.explainShown) this.showExplain();      // refresh the text in place while it is up
  }

  // Keys for the Stargazing overlays, one band per class like the heat classes: only the ones that are
  // loaded and switched on. The colours are what the layer shows over the dark map.
  astroLegendHTML() {
    if (!this.astroActive() || !this.astro) return "";
    const over = (c) => { const a = c[3] / 255, bg = [11, 16, 32];
      return `rgb(${[0, 1, 2].map((i) => Math.round(c[i] * a + bg[i] * (1 - a))).join(",")})`; };
    // The colour a layer shows at value v, interpolated between its stops like the map does.
    const at = (stops, v) => {
      if (v <= stops[0][0]) return stops[0].slice(1);
      for (let k = 0; k < stops.length - 1; k++) if (v <= stops[k + 1][0]) {
        const f = (v - stops[k][0]) / (stops[k + 1][0] - stops[k][0]);
        return [1, 2, 3, 4].map((c) => stops[k][c] + (stops[k + 1][c] - stops[k][c]) * f);
      }
      return stops[stops.length - 1].slice(1);
    };
    let html = "";
    if (this.lightsOn && this.astro.lights) {
      const dn = this.astro.lights.meta.units === "dn", L = dn ? ASTRO.lightsDN : ASTRO.lights;
      // Each band is drawn in the colour at the middle of its range (the top one at 1.6 times its lower edge).
      const rows = L.classes.map(([th, name], i, all) => ({ name,
        colour: th === 0 ? "rgb(11,16,32)" : over(at(L.stops, i + 1 < all.length ? Math.sqrt(th * all[i + 1][0]) : th * 1.6)) })).reverse();
      html += this.legendBands("Light glow", "", rows, "Where it is dark, there is no glow");
    }
    if (this.auroraOn && this.astro.aurora && this.auroraValid()) {
      const rows = ASTRO.aurora.classes.map(([th, name]) => ({ name, range: `${th}%+`, colour: over(at(ASTRO.aurora.stops, th * 1.4)) }));
      html += this.legendBands("Aurora", "chance", rows);
    }
    return html;
  }

  // A key of flat bands, top to bottom, each with its name (and range) beside it.
  legendBands(title, unit, rows, note = "") {
    const n = rows.length, band = 100 / n;
    const bar = [...rows].reverse().map((x, i) => `${x.colour} ${(i * band).toFixed(2)}% ${((i + 1) * band).toFixed(2)}%`).join(", ");
    return `<div class="col"><div class="title"><span>${escapeHTML(title)}</span><span>${escapeHTML(unit)}</span></div>` +
      `<div class="body cls sm"><div class="cls-names">` + rows.map((x) =>
        `<div class="cls-name">${escapeHTML(x.name)}${x.range ? `<small>${escapeHTML(x.range)}</small>` : ""}</div>`).join("") + `</div>` +
      `<div class="bar" style="background-image:linear-gradient(to top, ${bar})"></div></div>` +
      (note ? `<div class="note">${escapeHTML(note)}</div>` : "") + `</div>`;
  }

  explainHTML() {
    const preset = this.preset && PRESETS[this.preset];
    if (!preset || !preset.explain) return "";
    let html = preset.explain.map((n) =>
      `<p>${escapeHTML(n.replace("{interval}", this.contourIntervalText()).replace("{auroraH}", ASTRO.auroraWindowH).replace("{kp}", this.kpText()))}</p>`).join("");
    if (preset.keys) html += preset.keys.map((k) =>
      `<div class="ekey"><div class="etitle">${escapeHTML(k.title)}</div>` +
      k.rows.filter((r2) => !r2.toggle || this.toggleOn(r2.toggle)).map((r2) =>
        `<div class="row"><i class="sw${r2.pattern ? " " + r2.pattern : ""}"${r2.swatch ? ` style="background:rgb(${r2.swatch.join(",")})"` : ""}></i>${escapeHTML(r2.text)}</div>`).join("") +
      `</div>`).join("");
    return html;
  }

  showExplain() {
    const btn = document.querySelector("#legend .info");
    let pop = document.getElementById("explain-pop");
    if (!btn) return;
    if (!pop) { pop = document.createElement("div"); pop.id = "explain-pop"; pop.setAttribute("role", "tooltip"); document.body.appendChild(pop); }
    pop.innerHTML = this.explainHTML();
    pop.hidden = false;
    this.explainShown = true;
    const r = btn.getBoundingClientRect();
    pop.style.right = `${Math.max(8, innerWidth - r.left + 8)}px`;
    pop.style.top = `${Math.max(8, Math.min(r.top, innerHeight - pop.offsetHeight - 8))}px`;
  }

  hideExplain() {
    const pop = document.getElementById("explain-pop");
    if (pop) pop.hidden = true;
    this.explainShown = false;
  }

  // A key made of one block per class (UTCI heat-stress classes): the hottest at
  // the top, the colour the map shows for that class, the class name and its range.
  legendClasses(title, unit, r) {
    const over = (c) => {                       // the map colour over a white map
      const a = c[3] / 255 * r.opacity;
      return `rgb(${c.slice(0, 3).map((v) => Math.round(255 + (v - 255) * a)).join(",")})`;
    };
    const colourAt = (v) => { let c = r.stops[0][1]; for (const [sv, sc] of r.stops) if (v >= sv) c = sc; return c; };
    const edges = r.marks;            // [[26,"Moderate"],...] lower edges, rising
    const rows = edges.map(([lo, name], i) => ({
      name, range: i === edges.length - 1 ? `${lo}+` : `${lo}–${edges[i + 1][0]}`, colour: over(colourAt(lo + 0.5)),
    })).reverse();
    rows.push({ name: r.marksBelow, range: `<${edges[0][0]}`, colour: "rgb(255,255,255)" });
    // One thin bar of flat bands (hottest on top), equal heights, each band's name and
    // range beside it, centred on the band.
    const n = rows.length, band = 100 / n;
    const bar = [...rows].reverse().map((x, i) => `${x.colour} ${(i * band).toFixed(2)}% ${((i + 1) * band).toFixed(2)}%`).join(", ");
    return `<div class="col"><div class="title"><span>${escapeHTML(title)}</span><span>${escapeHTML(unit)}</span></div>` +
      `<div class="body cls"><div class="cls-names">` + rows.map((x) =>
        `<div class="cls-name">${escapeHTML(x.name)}<small>${escapeHTML(x.range)}</small></div>`).join("") + `</div>` +
      `<div class="bar" style="background-image:linear-gradient(to top, ${bar})"></div></div></div>`;
  }

  // One vertical key: low values at the bottom, high at the top. `ticks` are
  // {v, p} with p in 0..1 along the bar.
  legendColumn(title, unit, gradient, ticks, note = "", named = false) {
    const last = ticks.length - 1;
    return `<div class="col">` +
      `<div class="title"><span>${escapeHTML(title)}</span><span>${escapeHTML(unit)}</span></div>` +
      `<div class="body"><div class="ticks${named ? " named" : ""}">` + ticks.map((t, i) =>
        `<span class="${named ? "" : i === 0 ? "first" : i === last ? "last" : ""}" ` +
        `style="bottom:${(t.p * 100).toFixed(1)}%">${escapeHTML(String(t.text || t.v))}</span>`).join("") + `</div>` +
      `<div class="bar" style="background-image:linear-gradient(to top, ${gradient})">` +
      (named ? ticks.map((t) => `<i class="mk" style="bottom:${(t.p * 100).toFixed(1)}%"></i>`).join("") : "") + `</div></div>` +
      (note ? `<div class="note">${escapeHTML(note)}</div>` : "") + `</div>`;
  }

  // Satellite key, drawn from the colour table the pipeline coloured the image
  // with (it travels in sat/manifest.json), so key and image cannot disagree.
  satLegendHTML() {
    const m = this.satManifest;
    const lo = m.colormap[0][0], hi = m.colormap[m.colormap.length - 1][0];
    const at = (v) => (v - lo) / (hi - lo);
    const gradient = m.colormap.map(([v, c]) => `rgb(${c[0]},${c[1]},${c[2]}) ${(at(v) * 100).toFixed(1)}%`).join(", ");
    const t = this.satFrame ? new Date(this.satFrame.t) : null;
    const fmt = (u) => { const p = tzParts(t, u); return `${p.hm} ${p.label}`; };
    const note = !t ? "No satellite image for this time"
      : `Observed ${fmt(this.useUTC)} (${fmt(!this.useUTC)})`;
    return this.legendColumn(m.label, m.unit, gradient,
      m.legend_ticks.map((v) => ({ v, p: at(v) })), note);
  }

  // A second key beside the main one while the radar overlay is on. Separate
  // block, not a sixth RAMPS entry: radar is a toggle over whatever parameter
  // is selected, not one of the five fields.
  radarLegendHTML() {
    const rr = RADAR_RAMP;
    const lo = rr.ticks[0], hi = rr.ticks[rr.ticks.length - 1];
    const at = (v) => (v - lo) / (hi - lo);
    const gradient = rr.stops.map(([v, c]) =>
      `rgba(${c[0]},${c[1]},${c[2]},${(c[3] / 255).toFixed(3)}) ${(at(v) * 100).toFixed(1)}%`
    ).join(", ");
    return this.legendColumn("Radar", rr.unitLabel, gradient,
      rr.ticks.map((v) => ({ v, p: at(v) })), "Synthetic placeholder for a few cities, not from BMKG.");
  }

  // Latitude/longitude grid on a canvas laid over the map. Spacing is chosen
  // from the zoom so lines stay about 90px apart, and it is redrawn on every
  // move, so it stays "dynamic" as you pan and zoom.
  // Latitude and longitude lines for the globe, as map layers. Spacing follows
  // the zoom like the flat grid; the data is rebuilt only when that spacing or
  // the base colour changes, so calling this on every move is cheap.
  syncGlobeGrid() {
    const m = this.map;
    // Wait for the weather layer: layers added before it would sit underneath it.
    if (!m || !m.getStyle() || !m.getLayer("weather")) return;
    const show = this.globeOn && this.gridOn;
    const has = !!m.getLayer("globe-grid");
    if (!show) {
