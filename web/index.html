<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b1020;
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #e9edf7; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; z-index: 2; background: rgba(12,18,34,.86);
    border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
    backdrop-filter: blur(8px); padding: 10px 12px; }
  /* Top-left stack: brand, then the layer toolbar. One container so the two
     never overlap however the toolbar wraps. */
  #chrome { position: absolute; top: 12px; left: 12px; z-index: 2; display: flex;
    flex-direction: column; align-items: flex-start; gap: 8px; max-width: calc(100vw - 62px); }
  #chrome .panel { position: static; }
  #brand { display: flex; align-items: center; gap: 22px; padding: 8px 14px; }
  /* Site pages sit beside the logo, apart from the map controls below. */
  .site-nav { display: flex; gap: 16px; font-size: 13px; }
  .site-nav a { color: #8BBEB2; text-decoration: none; white-space: nowrap; }
  .site-nav a:hover { color: #E6F9AF; }
  .site-nav a:focus-visible { outline: 2px solid #E6F9AF; outline-offset: 3px; border-radius: 3px; }
  /* Sized by height, as the brand guide asks: the SVG has a fixed width. */
  .logo-img { height: 40px; width: auto; display: block; }
  @media (max-width: 600px) {
    .logo-img { height: 32px; }
    #brand { padding: 8px 10px; gap: 14px; }
    .site-nav { gap: 12px; font-size: 12.5px; }
  }
  /* Variable bar: centred just above the time panel (--time-h is kept in step
     from JS). The wrapper stays as wide as its content so it never blocks the
     map either side; collapsing hides the bar and leaves only the pill. */
  #vars { position: absolute; z-index: 2; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--time-h, 100px) + 12px); max-width: calc(100vw - 24px);
    display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #vars .panel { position: static; }
  #vars-toggle { all: unset; cursor: pointer; display: flex; align-items: center; gap: 6px;
    padding: 3px 12px; border-radius: 999px; font-size: 11.5px; color: #cfd8ee;
    background: rgba(12,18,34,.3); border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(12px); text-shadow: 0 0 3px rgba(8,12,24,.9); }
  #vars-toggle:hover { color: #fff; }
  #vars-toggle:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 2px; }
  #vars-toggle svg { transition: transform .15s; }
  #vars-toggle[aria-expanded="false"] svg { transform: rotate(180deg); }
  #vars[data-collapsed="true"] #layers { display: none; }
  /* Always one row: if the screen is too narrow it scrolls sideways instead of wrapping. */
  #layers { display: flex; gap: 4px; flex-wrap: nowrap; justify-content: safe center; max-width: 100%;
    padding: 7px 8px; overflow-x: auto; scrollbar-width: thin; }
  #layers button { flex: none; display: inline-flex; align-items: center; gap: 5px; }
  #layers button svg { width: 14px; height: 14px; flex: none; }
  #layers button { all: unset; cursor: pointer; padding: 6px 8px; border-radius: 7px;
    font-size: 12.5px; color: #cfd8ee; border: 1px solid transparent; white-space: nowrap; }
  #layers button[aria-pressed="true"] { background: #2d6cf6; color: #fff; }
  #layers button:focus-visible { border-color: #8ab4ff; }
  #time { bottom: 12px; left: 12px; right: 12px; display: flex; align-items: center; gap: 12px; }
  #time { padding-bottom: 6px; flex-wrap: wrap; row-gap: 4px; }
  #track { flex: 1; min-width: 80px; position: relative; }
  #track input { width: 100%; display: block; margin: 0; accent-color: #2d6cf6; }
  /* Ticks line up with the range thumb's travel: it is inset by half its width. */
  #ticks { position: relative; height: 24px; margin: 0 8px; }
  #ticks i { position: absolute; top: 0; width: 1px; height: 4px; margin-left: -.5px;
    background: rgba(255,255,255,.28); }
  #ticks i.half { height: 6px; background: rgba(255,255,255,.45); }
  #ticks i.sat { height: 6px; background: #5ad1ff; }
  #ticks i.day { height: 9px; background: rgba(255,255,255,.8); }
  #ticks button { all: unset; cursor: pointer; position: absolute; top: 10px; transform: translateX(-50%);
    font-size: 10.5px; line-height: 1; color: #9fb0d4; white-space: nowrap; padding: 2px 3px;
    border-radius: 4px; font-variant-numeric: tabular-nums; }
  #ticks button[hidden] { display: none; }  /* `all: unset` above would otherwise show it */
  #ticks button.sat { color: #5ad1ff; }
  #ticks button:hover, #ticks button:focus-visible { color: #fff; background: #243156; }
  #stamp small.obs { color: #5ad1ff; }
  #stamp small { display: block; font-size: 11px; color: #8e9ab8; text-align: right; }
  #stamp { font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 13px; }
  #play { all: unset; cursor: pointer; padding: 4px 10px; border-radius: 7px; background: #243156; }
  #play[data-wait] { animation: playwait 0.9s ease-in-out infinite; }  /* playing, but waiting for data */
  @keyframes playwait { 50% { opacity: 0.45; } }
  #layers input.op { width: 70px; accent-color: #2d6cf6; align-self: center; }
  #layers input.op[hidden] { display: none; }
  #layers .sep { width: 1px; background: rgba(255,255,255,.18); margin: 2px 4px; }
  #layers button.preset[aria-pressed="true"] { background: #14907e; color: #fff; }
  #layers button.preset { border-color: rgba(20,144,126,.55); }
  #layers button.toggle[aria-pressed="true"] { background: #243156; color: #fff;
    border-color: rgba(255,255,255,.25); }
  /* Coordinate grid: a canvas over the map, redrawn on every move so the
     spacing follows the zoom. It must never swallow a click or a hover. */
  .maplibregl-popup { z-index: 3; }   /* above the top-left brand panel, which is z-index 2 */
  .maplibregl-popup-content { padding: 8px 10px; border-radius: 8px; }
  #grid { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%;
    pointer-events: none; }
  /* Vertical colour key on the right edge, sitting just above the time panel
     (--time-h is kept in step with that panel's height from JS). */
  /* Legend and cursor readout: 70% transparent (alpha .3), the colour bar itself
     stays opaque. Text gets a faint shadow so it holds up over saturated fields. */
  .panel.glass { background: rgba(12,18,34,.3); backdrop-filter: blur(12px);
    text-shadow: 0 0 3px rgba(8,12,24,.9), 0 1px 2px rgba(8,12,24,.9); }
  /* Grid and label toggles: icon buttons under the zoom control, top right. */
  /* Same look as MapLibre's zoom buttons: white, 29px, grouped with dividers. */
  #maptools { top: 78px; right: 10px; padding: 0; gap: 0; display: flex; flex-direction: column;
    background: #fff; border: 0; border-radius: 4px; box-shadow: 0 0 0 2px rgba(0,0,0,.1);
    backdrop-filter: none; overflow: hidden; }
  #maptools button { all: unset; cursor: pointer; box-sizing: border-box; width: 29px; height: 29px;
    display: grid; place-items: center; color: #333; }
  #maptools button + button { border-top: 1px solid #ddd; }
  #maptools button:hover { background: #f2f2f2; }
  #maptools button[aria-pressed="true"] { background: #dbe7ff; color: #1f55d6; }
  #maptools button:focus-visible { outline: 2px solid #2d6cf6; outline-offset: -2px; }
  #maptools svg { width: 15px; height: 15px; }
  #maptools .aa { font: 700 12px/1 ui-sans-serif, system-ui, sans-serif; }
  #timeopts { display: flex; gap: 6px; align-items: center; }
  #tz, #dn { display: flex; border: 1px solid rgba(255,255,255,.18); border-radius: 7px; overflow: hidden; }
  #tz button, #dn button { all: unset; cursor: pointer; padding: 3px 8px; font-size: 11px; color: #9fb0d4; }
  #tz button[aria-pressed="true"], #dn button[aria-pressed="true"] { background: #243156; color: #fff; }
  #tz button:focus-visible, #dn button:focus-visible { outline: 2px solid #8ab4ff; outline-offset: -2px; }
  /* Two boxes stacked at the bottom right: the cloud-level key on top, when a
     preset has one, and the colour key (one column) under it. */
  #legends { position: absolute; z-index: 2; bottom: calc(var(--time-h, 100px) + 24px); right: 12px;
    display: flex; flex-direction: column; gap: 8px; align-items: flex-end; max-width: calc(100vw - 24px); }
  #legends .panel { position: static; }
  #legends .panel[hidden] { display: none; }
  #legend, #legend2 { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; padding: 8px 10px; }
  #legend .col, #legend2 .col { display: flex; flex-direction: column; align-items: flex-end; }
  #legend .info { all: unset; cursor: pointer; box-sizing: border-box; width: 18px; height: 18px;
    border-radius: 50%; display: grid; place-items: center; font: italic 700 11px/1 Georgia, serif;
    color: #cfd8ee; border: 1px solid rgba(255,255,255,.4); }
  #legend .info:hover { color: #fff; border-color: #fff; }
  #legend .info[aria-pressed="true"] { background: #243156; color: #fff; }
  #legend .info:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 2px; }
  #legend .explain { max-width: 190px; font-size: 9.5px; line-height: 1.4; color: #cfd8ee; text-align: left; }
  #legend .explain p { margin: 0 0 4px; }
  #legend2 .title { text-align: left; font-size: 10.5px; color: #cfd8ee; }
  #legend2 .rows { display: flex; flex-direction: column; gap: 3px; margin-top: 3px; }
  #legend2 .row { font-size: 10px; color: #cfd8ee; display: flex; align-items: center; gap: 5px; }
  #legend2 .sw { width: 11px; height: 11px; border-radius: 2px; border: 1px solid rgba(255,255,255,.35); }
  #legend .title { text-align: right; font-size: 10.5px; color: #cfd8ee; margin-bottom: 4px;
    max-width: 76px; line-height: 1.25; }
  #legend .title span { display: block; }
  #legend .title span:last-child { color: #a9b5d0; font-size: 9.5px; }
  #legend .body { display: flex; gap: 6px; height: clamp(90px, 22vh, 170px); }
  #legend .ticks { position: relative; width: 26px; font-size: 9.5px; color: #cfd8ee;
    font-variant-numeric: tabular-nums; }
  #legend .ticks span { position: absolute; right: 0; transform: translateY(50%); white-space: nowrap; }
  #legend .ticks span.first { transform: none; }
  #legend .ticks span.last { transform: translateY(100%); }
  #legend .ticks.named { width: 96px; }
  #legend .ticks.named span { padding-right: 9px; }
  #legend .ticks.named span::after { content: ""; position: absolute; right: 0; top: 50%; width: 6px; height: 1px;
    background: rgba(255,255,255,.9); }
  #legend .bar i.mk { position: absolute; left: -2px; right: -2px; height: 1px; background: rgba(255,255,255,.9);
    transform: translateY(50%); }
  #legend .bar { position: relative; width: 9px; border-radius: 3px; background-color: #0b1020;
    border: 1px solid rgba(255,255,255,.25); }
  #legend .note { margin-top: 4px; max-width: 76px; text-align: right; font-size: 9px; color: #b4c0dc; }
  #readout { padding: 6px 8px; top: 12px; right: 56px; min-width: 100px; line-height: 1.25; font-variant-numeric: tabular-nums; }
  #readout b { font-weight: 600; font-size: 13px; }
  /* The attribution is a licence condition, so it stays on screen and legible:
     small, but full-contrast text on the panel, on its own line under the slider. */
  #credit { flex: 1 0 100%; order: 5; font-size: 8.5px; line-height: 1.3; color: #cfd8ee;
    margin-top: 2px; }
  #credit a { color: #bcc9e8; }
  #boot { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center;
    background: #0b1020; text-align: center; padding: 24px; }
  .err { color: #ff9b9b; max-width: 60ch; }
  /* Last in the sheet on purpose: these must win over the base rules above. */
  @media (max-width: 1000px) {
    /* The centred variable bar can reach the legend: lift the legend above it. */
    #legends { bottom: calc(var(--time-h, 100px) + var(--vars-h, 0px) + 24px); }
  }
  @media (max-width: 720px) {
    #legend { gap: 10px; padding: 6px 8px; }
    /* Narrow screens: play + time on one row, the full-width bar under them. */
    #stamp { margin-left: auto; }
    #track { order: 3; flex: 1 0 100%; }
  }
</style>

<!-- Pinned to a version that still ships a UMD bundle. MapLibre 6 is ESM-only,
     so moving to it means a bundler or an import map, not a src swap. -->
<script src="https://unpkg.com/maplibre-gl@5.8.0/dist/maplibre-gl.js"></script>
<script>
// ---------------------------------------------------------------------------
// Where the data lives. Same-origin "/data" during Stage C so you can serve the
// pipeline's ./out directory next to this file; swap to the R2 custom domain in
// Stage D and nothing else changes.
// ---------------------------------------------------------------------------
// ?data=<url> overrides. Otherwise: local folder when served from localhost,
// the public R2 bucket in production.
const LOCAL_HOSTS = ["localhost", "127.0.0.1", "[::1]"];
const DATA =
  new URLSearchParams(location.search).get("data") ||
  (LOCAL_HOSTS.includes(location.hostname) ? "./data" : "https://data.klimatikal.com");

// Display ranges and colour ramps. These are presentation, not encoding: the
// encoding range in the manifest is deliberately wider so nothing clips, and
// these narrower ranges are what make the map readable.
// Each parameter has its own colour map, chosen for what it measures:
//   wind      speed, sequential, white when calm, then blue -> green -> red -> purple
//   temp      diverging around freezing: purple/blue cold, green mild, red hot
//   precip    white when dry or missing, then pale green -> green -> yellow -> red -> purple
//   cloud     white with rising opacity, so clear sky stays clear
//   msl       diverging around the standard 1013 hPa: purple low, orange high
// stops are [value, [r, g, b, alpha 0..255]]; `opacity` multiplies the alpha
// when drawn. The legend is built from this same table, so the key cannot
// drift from the colours on the map. `evenLegend` spaces the legend by stop
// instead of by value, for fields (precipitation) where most of the interest
// is crowded near zero.
const RAMPS = {
  wind: { display: [0, 32], unitLabel: "m/s", opacity: 0.7, legendMinWhite: true, ticks: [0, 5, 10, 15, 20, 25, 30],
    stops: [
      [0,  [255, 255, 255, 220]], [2,  [43, 95, 168, 150]], [5,  [43, 163, 181, 215]],
      [10, [111, 208, 106, 235]], [15, [242, 224, 74, 245]], [20, [245, 154, 58, 250]],
      [25, [229, 71, 63, 255]], [32, [184, 35, 154, 255]]] },
  temp: { display: [-40, 45], unitLabel: "°C", opacity: 0.72, ticks: [-40, -30, -20, -10, 0, 10, 20, 30, 40],
    stops: [
      [-40, [42, 10, 94, 255]],  [-25, [63, 75, 184, 255]], [-10, [61, 143, 224, 255]],
      [0,   [159, 216, 238, 255]], [8, [127, 207, 138, 255]], [16, [230, 227, 115, 255]],
      [24,  [245, 166, 64, 255]], [32, [226, 85, 58, 255]], [40, [168, 20, 46, 255]],
      [45,  [110, 10, 36, 255]]] },
  precip: { display: [0, 20], unitLabel: "mm/3h", opacity: 0.9, evenLegend: true, legendMinWhite: true,
    stops: [
      [0,   [255, 255, 255, 235]], [0.1, [214, 240, 220, 235]], [0.5, [155, 231, 164, 215]],
      [1,   [31, 158, 79, 210]], [2.5, [243, 227, 71, 235]], [5,   [245, 154, 43, 245]],
      [10,  [226, 54, 46, 250]], [20,  [176, 18, 154, 255]]] },
  cloud: { display: [0, 100], unitLabel: "%", opacity: 0.9, ticks: [0, 25, 50, 75, 100],
    stops: [
      [0,   [255, 255, 255, 0]],   [20, [235, 240, 250, 40]], [50, [235, 240, 250, 120]],
      [80,  [150, 215, 165, 190]], [100, [255, 255, 255, 235]]] },
  msl: { display: [960, 1045], unitLabel: "hPa", opacity: 0.72, ticks: [960, 980, 1000, 1013, 1030, 1045],
    stops: [
      [960,  [91, 58, 156, 255]],  [985,  [63, 127, 212, 255]], [1000, [143, 208, 232, 255]],
      [1013, [242, 242, 242, 255]], [1025, [245, 199, 106, 255]], [1040, [224, 112, 58, 255]],
      [1045, [212, 72, 47, 255]]] },
};

// Colours for the presets' own fields. heatindex follows the NWS risk bands
// (27 caution, 32 extreme caution, 41 danger, 54 extreme danger, all degC) with
// a soft ramp between them; below 27 it fades to white, because the index says
// nothing useful for cool air. cloudveil is cloud as a translucent white haze,
// light enough to sit under other fields; `source` names the data layer.
Object.assign(RAMPS, {
  heatindex: { display: [24, 56], unitLabel: "°C", opacity: 0.78, legendMinWhite: true, ticks: [27, 32, 41, 54],
    // NWS danger levels, marked on the key at the value where each begins.
    marks: [[27, "Caution"], [32, "Extreme caution"], [41, "Danger"], [54, "Extreme danger"]],
    marksBelow: "Below caution",
    stops: [
      [24, [255, 255, 255, 235]], [27, [250, 232, 96, 190]],
      [32, [246, 162, 52, 230]], [41, [224, 62, 50, 245]], [54, [150, 26, 150, 255]],
      [56, [110, 14, 120, 255]]] },
  // Cloud by level, all black on the white map: each level is a black veil whose
  // strength follows its cover, and the veils stack, so where low, middle and
  // high cloud overlap the map is darkest. Thin cloud already starts at a mid
  // grey (not near-white), and clear sky, below 10 to 20% cover, stays white.
  lowcloud:  { source: "lcc", display: [0, 100], unitLabel: "%", opacity: 0.32,
    stops: [[0, [8, 10, 16, 0]], [10, [8, 10, 16, 0]], [20, [8, 10, 16, 190]], [100, [8, 10, 16, 255]]] },
  midcloud:  { source: "mcc", display: [0, 100], unitLabel: "%", opacity: 0.32,
    stops: [[0, [8, 10, 16, 0]], [10, [8, 10, 16, 0]], [20, [8, 10, 16, 190]], [100, [8, 10, 16, 255]]] },
  highcloud: { source: "hcc", display: [0, 100], unitLabel: "%", opacity: 0.32,
    stops: [[0, [8, 10, 16, 0]], [10, [8, 10, 16, 0]], [20, [8, 10, 16, 190]], [100, [8, 10, 16, 255]]] },
  // Colours of the sea-level pressure isobars (lines only, never filled):
  // blue low, red high. 995 to 1030 hPa spans deep lows to strong highs; values
  // outside keep the end colours.
  mslline: { display: [995, 1030], unitLabel: "hPa", opacity: 1, ticks: [1000, 1010, 1020, 1030],
    // Saturated and dark enough to read on the white map (pale cyan and yellow vanish there).
    stops: [[995, [24, 62, 220, 255]], [1004, [0, 138, 186, 255]], [1012, [186, 126, 0, 255]],

    if (!f.tiles) f.tiles = [{ image: f.image, bounds: f.bounds || m.bounds }];
    f.image = f.tiles.map((t) => t.image).join("|");

// Layers whose colours come from a different (higher-precision) PNG than their own.

// ---------------------------------------------------------------------------
// Shared GLSL: decode a value from the PNG, and convert mercator to latitude.
// The decode here must match pipeline/encoding.py exactly. If you change one,
// change the other and rerun test_encoding.py.
// ---------------------------------------------------------------------------
const GLSL_DECODE = `
  uniform int   u_encoding;
  uniform float u_min, u_max, u_gamma;

  float applyRange(float unit) {
    float g = pow(clamp(unit, 0.0, 1.0), u_gamma);
    return g * (u_max - u_min) + u_min;
  }
  // Returns the layer's scalar value: magnitude for a vector layer.
  float decodeValue(vec4 px) {
    if (u_encoding == 1) return applyRange((px.r * 255.0 * 256.0 + px.g * 255.0) / 65535.0);
    if (u_encoding == 2) {
      float u = applyRange(px.r);
      float v = applyRange(px.g);
      return length(vec2(u, v));
    }
    return applyRange(px.r);
  }
  vec2 decodeVector(vec4 px) { return vec2(applyRange(px.r), applyRange(px.g)); }

  const float PI = 3.1415926535897932;
  // mercator y in 0..1 (0 = north edge) -> latitude in degrees
  float mercToLat(float y) { return degrees(2.0 * atan(exp((1.0 - 2.0 * y) * PI)) - PI * 0.5); }
  float latToMerc(float lat) {
    float s = sin(radians(clamp(lat, -85.051129, 85.051129)));
    return 0.5 - log((1.0 + s) / (1.0 - s)) / (4.0 * PI);
  }
  // Data row 0 is 90N and column 0 is 180W, so this is the sampling coordinate.
  vec2 dataUV(float mercX, float mercY) {
    return vec2(fract(mercX), (90.0 - mercToLat(mercY)) / 180.0);
  }`;

function compile(gl, type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(sh) + "\n---\n" + src);
  }

}

  gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  // Look up by naming convention, not by trial: an unused uniform (u_encoding
  // is optimised out of the update shader, which only needs the vector path)
  // has no location, and falling back to getAttribLocation would hand back -1
  // and make gl.uniform1i throw. null is a legal no-op for uniform calls.
  const cache = new Map();
  const loc = new Proxy({}, { get: (_, name) => {
    if (!cache.has(name)) {
      cache.set(name, String(name).startsWith("a_")
        ? gl.getAttribLocation(p, name)
        : gl.getUniformLocation(p, name));
    }
    return cache.get(name);
  }});

}
function texture(gl, source, wrapS) {

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  // Never let the browser premultiply: the pixels are numbers, not colour.
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  // REPEAT on a 1440x721 texture is only legal in WebGL2. Under WebGL1 a
  // non-power-of-two texture with REPEAT renders black, so fall back and
  // accept a one-texel seam at the antimeridian.
  if (wrapS === gl.REPEAT && !(typeof WebGL2RenderingContext !== "undefined"
        && gl instanceof WebGL2RenderingContext)) {
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  }
  if (source instanceof Uint8Array) {
    // square data texture for particle state
    const side = Math.sqrt(source.length / 4);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, side, side, 0, gl.RGBA, gl.UNSIGNED_BYTE, source);
  } else {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
  }

}
function rampTexture(gl, stops, display) {
  const N = 256, data = new Uint8Array(N * 4);
  const [lo, hi] = display;
  for (let i = 0; i < N; i++) {
    const v = lo + (hi - lo) * (i / (N - 1));
    let a = stops[0], b = stops[stops.length - 1];
    for (let s = 0; s < stops.length - 1; s++) {
      if (v >= stops[s][0] && v <= stops[s + 1][0]) { a = stops[s]; b = stops[s + 1]; break; }
    }
    const t = b[0] === a[0] ? 0 : (v - a[0]) / (b[0] - a[0]);
    for (let c = 0; c < 4; c++) data[i * 4 + c] = Math.round(a[1][c] + (b[1][c] - a[1][c]) * t);
  }
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, N, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  return tex;
}

// ---------------------------------------------------------------------------
// Layer 1: the colour field. One quad over the whole world; every fragment
// converts its mercator position to a latitude and samples the data there.
// ---------------------------------------------------------------------------
const FIELD_VS = `
  attribute vec2 a_pos;
  uniform mat4 u_matrix;
  uniform float u_worldShift;
  varying vec2 v_merc;
  void main() {
    v_merc = a_pos;   // dataUV() takes fract(), so the shift need not travel
    gl_Position = u_matrix * vec4(a_pos.x + u_worldShift, a_pos.y, 0.0, 1.0);
  }`;

// Cubic B-spline interpolation of the raw texel bytes, done with four
// hardware-bilinear fetches. Plain bilinear shows the 0.25 degree grid as
// facets once you zoom in, and the 8-bit steps as bands; this is C2-smooth.
// Every layer is encoded linearly, so filtering the bytes then decoding is
// the same as filtering the values. Shared by the colour field and the contours.
const GLSL_SMOOTH = `
  uniform vec2 u_texSize;
  vec4 sampleSmooth(sampler2D t, vec2 uv) {
    vec2 coord = uv * u_texSize - 0.5;
    vec2 i = floor(coord);
    vec2 f = coord - i;
    vec2 f2 = f * f, f3 = f2 * f;
    vec2 w0 = (1.0 - 3.0 * f + 3.0 * f2 - f3) / 6.0;
    vec2 w1 = (4.0 - 6.0 * f2 + 3.0 * f3) / 6.0;
    vec2 w2 = (1.0 + 3.0 * f + 3.0 * f2 - 3.0 * f3) / 6.0;
    vec2 w3 = f3 / 6.0;
    vec2 g0 = w0 + w1, g1 = w2 + w3;
    vec2 pA = (i - 1.0 + w1 / g0 + 0.5) / u_texSize;
    vec2 pB = (i + 1.0 + w3 / g1 + 0.5) / u_texSize;
    return g0.y * (g0.x * texture2D(t, vec2(pA.x, pA.y)) + g1.x * texture2D(t, vec2(pB.x, pA.y)))
         + g1.y * (g0.x * texture2D(t, vec2(pA.x, pB.y)) + g1.x * texture2D(t, vec2(pB.x, pB.y)));
  }`;

const FIELD_FS = `
  precision highp float;
  ${GLSL_DECODE}
  ${GLSL_SMOOTH}
  uniform sampler2D u_now, u_next, u_ramp;
  uniform float u_blend, u_dlo, u_dhi, u_opacity;
  varying vec2 v_merc;
  void main() {
    vec2 uv = dataUV(v_merc.x, v_merc.y);
    float a = decodeValue(sampleSmooth(u_now,  uv));
    float b = decodeValue(sampleSmooth(u_next, uv));
    float value = mix(a, b, u_blend);
    float t = clamp((value - u_dlo) / (u_dhi - u_dlo), 0.0, 1.0);
    vec4 c = texture2D(u_ramp, vec2(t, 0.5));
    gl_FragColor = vec4(c.rgb, c.a * u_opacity);
  }`;

// Isolines of a scalar layer. The line width is set in screen pixels: the
// field's change per pixel is measured by sampling one pixel to the right and
// one down (u_px is a pixel in mercator units), not with fwidth(), which needs
// an extension under WebGL1 and is refused in ESSL 1.00 shaders under WebGL2.
// A line is drawn where the value is within half a line width of a multiple of
// u_interval; every u_major-th multiple gets the heavier width and colour.
// How far, in grid cells, the isobar field is blurred (see valueAt in the shader
// and valueGrid, which must agree so labels stay on their lines).
const ISO_BLUR = 3;
const CONTOUR_FS = `
  precision highp float;
  ${GLSL_DECODE}
  ${GLSL_SMOOTH}
  uniform sampler2D u_now, u_next, u_ramp;
  uniform float u_blend, u_interval, u_major, u_width, u_majorWidth, u_px, u_base;
  uniform float u_dlo, u_dhi, u_alpha, u_majorAlpha;
  varying vec2 v_merc;
  // The value minus u_base (a multiple of the heavy-line spacing, so the lines
  // do not move). float32 near 1010 hPa resolves only ~1e-4 hPa, about what
  // the field changes per pixel across the flat tropics, and the lines would
  // smear into bands; measured from the base the numbers stay small and exact.
  float relValue(vec4 px) {
    float unit = u_encoding == 1 ? (px.r * 255.0 * 256.0 + px.g * 255.0) / 65535.0 : px.r;
    return pow(clamp(unit, 0.0, 1.0), u_gamma) * (u_max - u_min) + (u_min - u_base);
  }
  // Bilinear done by hand on exact texel centres. The hardware filter weighs
  // the bytes with only 8 bits, which is ~0.003 hPa of noise: invisible in the
  // colour field, but over a flat pressure field zoomed in it breaks the line
  // into dashes. The wide blur below hides the facets bilinear would show.
  float relBilinear(sampler2D t, vec2 uv) {
    vec2 coord = uv * u_texSize - 0.5;
    vec2 i = floor(coord), f = coord - i;
    vec2 c = (i + 0.5) / u_texSize, o = 1.0 / u_texSize;
    float a = relValue(texture2D(t, c));
    float b = relValue(texture2D(t, c + vec2(o.x, 0.0)));
    float d = relValue(texture2D(t, c + vec2(0.0, o.y)));
    float e = relValue(texture2D(t, c + o));
    return mix(mix(a, b, f.x), mix(d, e, f.x), f.y);
  }
  float valueOne(vec2 uv) {
    return mix(relBilinear(u_now, uv), relBilinear(u_next, uv), u_blend);
  }
  // Averaged with four points ${ISO_BLUR} cells away (the same blur the label
  // tracing applies to its grid), so the lines are smooth curves and not the
  // grid-scale wobbles of the data. Sea-level pressure over high ground is the
  // worst case: the reduction multiplies every bit of terrain roughness.
  float valueAtUV(vec2 uv) {
    vec2 d = ${ISO_BLUR}.0 / u_texSize;
    return 0.2 * (valueOne(uv)
         + valueOne(uv + vec2(d.x, 0.0)) + valueOne(uv - vec2(d.x, 0.0))
         + valueOne(uv + vec2(0.0, d.y)) + valueOne(uv - vec2(0.0, d.y)));
  }

    float d = abs(fract(v / step + 0.5) - 0.5) * step / max(perPx, 1e-5);  // pixels to the nearest line
    return 1.0 - smoothstep(max(width * 0.5 - 0.5, 0.0), width * 0.5 + 0.5, d);   // width px wide, one pixel of anti-aliasing centred on the edge
  }

    vec2 uv = dataUV(v_merc.x, v_merc.y);
    float v  = valueAtUV(uv);

    // cells. Differencing over one pixel instead loses the answer to rounding
    // (hardware filtering of the 16-bit bytes is only good to ~0.003 hPa), and
    // it showed as hairs along the lines when zoomed in on a flat field.
    vec2 cell = 1.0 / u_texSize;
    float gx = valueAtUV(uv + vec2(cell.x, 0.0)) - v;
    float gy = valueAtUV(uv + vec2(0.0, cell.y)) - v;
    vec2 pc = (dataUV(v_merc.x + u_px, v_merc.y + u_px) - uv) * u_texSize;
    float perPx = abs(gx) * abs(pc.x) + abs(gy) * abs(pc.y);
    float minor = lineAt(v, u_interval, u_width, perPx);
    float major = lineAt(v, u_interval * u_major, u_majorWidth, perPx);
    // Colour by the line's own value: back to absolute, through the ramp.
    float t = clamp((v + u_base - u_dlo) / (u_dhi - u_dlo), 0.0, 1.0);
    float a = max(minor * u_alpha, major * u_majorAlpha);
    if (a < 0.01) discard;
    gl_FragColor = vec4(texture2D(u_ramp, vec2(t, 0.5)).rgb, a);
  }`;

// ---------------------------------------------------------------------------
// Layer 2: wind particles. Positions live in an RGBA8 texture, 16 bits per
// axis. Each frame one pass advects them into a second texture and the draw
// pass joins old to new with a line, which is the trail. Ping-pong rather than
// a screen-sized trail buffer, so trails do not smear when the map is panned.
// ---------------------------------------------------------------------------
// v_uv must land on the same texel the fragment writes to, or each update
// mirrors particle identity across the texture, the old/new pairing in the
// draw pass breaks, and the trails become long random lines.
const QUAD_VS = `
  attribute vec2 a_pos;
  varying vec2 v_uv;
  void main() { v_uv = a_pos; gl_Position = vec4(a_pos * 2.0 - 1.0, 0.0, 1.0); }`;

const UPDATE_FS = `
  precision highp float;
  ${GLSL_DECODE}
  uniform sampler2D u_particles, u_now, u_next;
  uniform float u_blend, u_dt, u_rand, u_drop;
  varying vec2 v_uv;

  float rand(vec2 co) { return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453); }

  void main() {
    vec4 px = texture2D(u_particles, v_uv);
    // 16-bit per axis: high byte in r/b, low byte in g/a

                    px.b * 255.0 * 256.0 + px.a * 255.0) / 65535.0;

    vec2 uv = dataUV(pos.x, pos.y);
    vec2 w = mix(decodeVector(texture2D(u_now, uv)), decodeVector(texture2D(u_next, uv)), u_blend);

    float lat = mercToLat(pos.y);
    float lon = pos.x * 360.0 - 180.0;
    // metres per degree; the cos(lat) term is what stops particles sprinting
    // near the poles, and clamping it stops a divide by zero at the pole.
    float mPerDegLon = 111320.0 * max(cos(radians(lat)), 0.01);
    lon += w.x * u_dt / mPerDegLon;
    lat += w.y * u_dt / 110540.0;

    vec2 next = vec2(fract((lon + 180.0) / 360.0), latToMerc(lat));

    // Respawn a slice of the particles each frame, or they all drain into the
    // convergence zones and the map goes bald.
    float speed = length(w);
    float dropChance = u_drop + smoothstep(0.0, 1.5, 1.0 - speed) * 0.02;
    vec2 seed = v_uv * u_rand;
    if (rand(seed) < dropChance || next.y < 0.002 || next.y > 0.998) {
      next = vec2(rand(seed + 1.3), rand(seed + 2.7) * 0.92 + 0.04);
    }

    vec2 hi = floor(q / 256.0), lo = q - hi * 256.0;
    gl_FragColor = vec4(hi.x / 255.0, lo.x / 255.0, hi.y / 255.0, lo.y / 255.0);

    // right across the map, which is what a field of these looks like: a mess
    // of straight lines over the weather. Collapse the segment instead.
    vec2 delta = newP - oldP;
    bool teleported = abs(delta.x) > u_jump || abs(delta.y) > u_jump;

    // The head is where the particle is now; the tail is extrapolated back
    // along its last step. Speed is then free to be slow without the streak
    // shrinking to a dot.
    vec2 tail = teleported ? newP : newP - delta * u_trail;
    vec2 pos = a_end > 0.5 ? newP : tail;
    v_end = teleported ? 0.0 : a_end;
    gl_Position = u_matrix * vec4(pos.x + u_worldShift, pos.y, 0.0, 1.0);
    gl_Position.xy += u_shift * gl_Position.w;
    gl_PointSize = 1.5;
    v_tint = vec3(0.0);
    if (u_tint > 0.5) {
      vec2 duv = vec2(fract(newP.x), (90.0 - mercToLat(newP.y)) / 180.0);
      vec4 px = texture2D(u_press, duv);
      float value = (px.r * 255.0 * 256.0 + px.g * 255.0) / 65535.0 * (u_pmax - u_pmin) + u_pmin;
      v_tint = texture2D(u_pramp, vec2(clamp((value - u_pdlo) / (u_pdhi - u_pdlo), 0.0, 1.0), 0.5)).rgb;
    }
  }`;

const DRAW_FS = `
  precision highp float;
  varying float v_end;
  varying vec3 v_tint;
  uniform float u_opacity, u_tint, u_halo;
  uniform vec3 u_color;
  void main() {
    // Tinted streaks are coloured like the isobars and need more weight than the
    // plain pale or dark ones to stand out from the field underneath.
    float tail = u_tint > 0.5 ? mix(0.2, 1.0, v_end) : mix(0.05, 0.75, v_end);
    if (u_halo > 0.5) { gl_FragColor = vec4(1.0, 1.0, 1.0, 0.4 * u_opacity * tail); return; }   // the light edge round a coloured streak
    gl_FragColor = vec4(u_tint > 0.5 ? v_tint : u_color, u_opacity * tail);
  }`;

class WeatherLayer {
  constructor(app) {
    this.id = "weather";
    this.type = "custom";
    this.renderingMode = "2d";
    this.app = app;
    this.side = 256;              // 65,536 particles
  }

  onAdd(map, gl) {
    this.map = map;
    this.gl = gl;
    // The layer is handed the context officially; the app needs it too, for
    // uploading data textures. Taking it from map.painter.context would be
    // reaching into MapLibre's internals.
    this.app.gl = gl;
    this.field = program(gl, FIELD_VS, FIELD_FS);
    this.contour = program(gl, FIELD_VS, CONTOUR_FS);
    this.update = program(gl, QUAD_VS, UPDATE_FS);
    this.draw = program(gl, DRAW_VS, DRAW_FS);

    this.quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0, 1,0, 0,1, 0,1, 1,0, 1,1]), gl.STATIC_DRAW);

    const n = this.side * this.side;
    const idx = new Float32Array(n * 4);          // two vertices per particle
    for (let i = 0; i < n; i++) {
      idx[i*4+0] = i; idx[i*4+1] = 0;
      idx[i*4+2] = i; idx[i*4+3] = 1;
    }
    this.indexBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.indexBuf);
    gl.bufferData(gl.ARRAY_BUFFER, idx, gl.STATIC_DRAW);
    this.particleCount = n;

    const seed = new Uint8Array(n * 4);
    for (let i = 0; i < seed.length; i++) seed[i] = Math.floor(Math.random() * 256);
    this.posA = texture(gl, seed);
    this.posB = texture(gl, seed);
    this.fbo = gl.createFramebuffer();
    this.ramps = {};
    this.last = performance.now();
  }

  ramp(name) {
    if (!this.ramps[name]) {
      const r = RAMPS[name];
      this.ramps[name] = rampTexture(this.gl, r.stops, r.display);
    }
    return this.ramps[name];
  }

  bindDecode(loc, spec) {
    const gl = this.gl;
    gl.uniform1i(loc.u_encoding, ENCODING_ID[spec.encoding]);
    gl.uniform1f(loc.u_min, spec.min);
    gl.uniform1f(loc.u_max, spec.max);
    gl.uniform1f(loc.u_gamma, spec.gamma || 1.0);
  }

  // MapLibre 4 passes the matrix itself; MapLibre 5 passes an options object.
  // Order matters: defaultProjectionData.mainMatrix is the one that takes
  // spherical mercator 0..1 to clip space. modelViewProjectionMatrix is a
  // different space and silently puts the quad off screen, which looks exactly
  // like "the data failed to load".
  static matrixOf(arg) {
    if (!arg) return null;
    if (ArrayBuffer.isView(arg) || Array.isArray(arg)) return arg;
    return (arg.defaultProjectionData && arg.defaultProjectionData.mainMatrix)
        || arg.modelViewProjectionMatrix
        || null;
  }

  render(gl, arg) {
    const matrix = WeatherLayer.matrixOf(arg);
    if (!matrix) {
      if (!this.warned) { console.error("no projection matrix from MapLibre"); this.warned = true; }
      return;
    }
    const app = this.app;
    // Everything the stack draws must be on the GPU before anything is drawn,
    // or a preset would flash half-built while scrubbing. Particles are the
    // exception: they are decoration and never hold the picture up.
    const stack = app.renderStack();
    const frames = new Map();
    for (const item of stack) {
      if (item.kind === "particles") continue;
      const src = app.fieldSource(dataOf(item));
      if (frames.has(src)) continue;
      const fr = app.currentFrame(src);
      if (!fr) { this.map.triggerRepaint(); return; }
      frames.set(src, fr);
    }
    // First weather frame is ready: now it is safe to start on the boundaries.
    // Deferred, because adding layers from inside a render callback is not.
    if (app.boundariesPending) {
      app.boundariesPending = false;
      setTimeout(() => app.addBoundaries(), 0);
    }
    // ?radar=1 in the URL turns radar on before the map exists to add layers
    // to; this is the first point after load where it is safe to do so.
    if (app.radarOn && !app.radarLoaded && !app.radarLoading) {
      setTimeout(() => app.loadRadarLayers(), 0);
    }
    if (app.satOn && !app.satLoaded && !app.satLoading) {
      setTimeout(() => app.loadSatellite(), 0);
    }
    const shifts = app.worldShifts();
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    for (const item of stack) {
      if (item.kind === "particles") continue;
      const { spec, now, next, blend } = frames.get(app.fieldSource(dataOf(item)));
      const isContour = item.kind === "contour";
      const f = isContour ? this.contour : this.field;
      gl.useProgram(f.p);
      gl.bindBuffer(gl.ARRAY_BUFFER, this.quad);
      gl.enableVertexAttribArray(f.loc.a_pos);
      gl.vertexAttribPointer(f.loc.a_pos, 2, gl.FLOAT, false, 0, 0);
      gl.uniformMatrix4fv(f.loc.u_matrix, false, matrix);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, now);
      gl.uniform1i(f.loc.u_now, 0);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, next);
      gl.uniform1i(f.loc.u_next, 1);
      this.bindDecode(f.loc, spec);
      gl.uniform2f(f.loc.u_texSize, app.manifest.grid.width, app.manifest.grid.height);
      gl.uniform1f(f.loc.u_blend, blend);
      if (isContour) {
        const interval = app.contourInterval(item);
        gl.uniform1f(f.loc.u_interval, interval);
        gl.uniform1f(f.loc.u_major, item.heavy / interval);
        gl.uniform1f(f.loc.u_width, item.width);
        gl.uniform1f(f.loc.u_majorWidth, item.majorWidth);
        gl.uniform1f(f.loc.u_base, Math.round(spec.min / item.heavy) * item.heavy);
        gl.uniform1f(f.loc.u_px, 1 / (512 * Math.pow(2, this.map.getZoom())));
        const ramp = RAMPS[item.ramp];
        gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, this.ramp(item.ramp));
        gl.uniform1i(f.loc.u_ramp, 2);
        gl.uniform1f(f.loc.u_dlo, ramp.display[0]);
        gl.uniform1f(f.loc.u_dhi, ramp.display[1]);
        gl.uniform1f(f.loc.u_alpha, item.alpha);
        gl.uniform1f(f.loc.u_majorAlpha, item.majorAlpha);
      } else {
        const ramp = RAMPS[item.ramp];
        gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, this.ramp(item.ramp));
        gl.uniform1i(f.loc.u_ramp, 2);
        gl.uniform1f(f.loc.u_dlo, ramp.display[0]);
        gl.uniform1f(f.loc.u_dhi, ramp.display[1]);
        gl.uniform1f(f.loc.u_opacity, item.opacity != null ? item.opacity : ramp.opacity);
      }
      for (const shift of shifts) {
        gl.uniform1f(f.loc.u_worldShift, shift);
        gl.drawArrays(gl.TRIANGLES, 0, 6);
      }
    }

    // --- particles, only where there is a vector field ---------------------
    const pItem = stack.find((i) => i.kind === "particles");
    const windFrame = pItem && app.windOn && app.currentFrame(pItem.layer);
    if (!windFrame) { this.finish(gl); return; }

    const nowMs = performance.now();
    const dt = Math.min(0.05, (nowMs - this.last) / 1000);
    this.last = nowMs;

    // advect into posB
    const u = this.update;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.posB, 0);
    gl.viewport(0, 0, this.side, this.side);
    gl.disable(gl.BLEND);
    gl.useProgram(u.p);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.quad);
    gl.enableVertexAttribArray(u.loc.a_pos);
    gl.vertexAttribPointer(u.loc.a_pos, 2, gl.FLOAT, false, 0, 0);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.posA);
    gl.uniform1i(u.loc.u_particles, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, windFrame.now);
    gl.uniform1i(u.loc.u_now, 1);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, windFrame.next);
    gl.uniform1i(u.loc.u_next, 2);
    this.bindDecode(u.loc, windFrame.spec);
    gl.uniform1f(u.loc.u_blend, windFrame.blend);

    // Trail length is a display choice, not a physical one. Pick how many
    // pixels a reference wind should cover in a frame and work backwards, so
    // the trails look the same at every zoom instead of vanishing when you
    // zoom out and streaking when you zoom in.
    const TRAIL_PX = WIND_PX_PER_FRAME * WIND_SPEED, V_REF = 10;  // px moved per frame at 10 m/s
    const pxPerMercator = 512 * Math.pow(2, this.map.getZoom());
    const stepMercator = TRAIL_PX / pxPerMercator;
    const frameFactor = Math.min(3, dt * 60);     // keep real-time speed steady
    // metres per mercator unit at the equator, so m/s becomes mercator/second
    gl.uniform1f(u.loc.u_dt, (stepMercator * 4.0075e7 / V_REF) * frameFactor);
    gl.uniform1f(u.loc.u_rand, Math.random() + 1.0);
    // Respawn rate per frame. Lower than it was because particles now move
    // several times slower: at the old rate they were replaced before they had
    // travelled far enough to trace a streamline.
    gl.uniform1f(u.loc.u_drop, 0.0015);
    gl.drawArrays(gl.TRIANGLES, 0, 6);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const size = [gl.drawingBufferWidth, gl.drawingBufferHeight];
    gl.viewport(0, 0, size[0], size[1]);

    // draw trails, repeated across the copies of the world that are on screen
    const d = this.draw;
    gl.useProgram(d.p);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.indexBuf);
    gl.enableVertexAttribArray(d.loc.a_index);
    gl.vertexAttribPointer(d.loc.a_index, 1, gl.FLOAT, false, 8, 0);
    gl.enableVertexAttribArray(d.loc.a_end);
    gl.vertexAttribPointer(d.loc.a_end, 1, gl.FLOAT, false, 8, 4);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.posA);
    gl.uniform1i(d.loc.u_old, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, this.posB);
    gl.uniform1i(d.loc.u_new, 1);
    gl.uniformMatrix4fv(d.loc.u_matrix, false, matrix);
    gl.uniform1f(d.loc.u_side, this.side);
    gl.uniform1f(d.loc.u_opacity, pItem.opacity != null ? pItem.opacity : 1.0);
    gl.uniform3fv(d.loc.u_color, this.app.lightBase() ? [0.04, 0.05, 0.09] : [1, 1, 1]);   // dark streaks on a white map
    gl.uniform1f(d.loc.u_trail, WIND_TRAIL_STEPS);
    // Colour by pressure when the preset asks for it and the frame is ready.
    const tintFrame = pItem.tint && app.currentFrame(pItem.tint.layer);
    gl.uniform1f(d.loc.u_tint, tintFrame ? 1 : 0);
    if (tintFrame) {
      const ramp = RAMPS[pItem.tint.ramp];
      gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, tintFrame.now);
      gl.uniform1i(d.loc.u_press, 2);
      gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, this.ramp(pItem.tint.ramp));
      gl.uniform1i(d.loc.u_pramp, 3);
      gl.uniform1f(d.loc.u_pmin, tintFrame.spec.min);
      gl.uniform1f(d.loc.u_pmax, tintFrame.spec.max);
      gl.uniform1f(d.loc.u_pdlo, ramp.display[0]);
      gl.uniform1f(d.loc.u_pdhi, ramp.display[1]);
    }
    // Well above the fastest legitimate step (a 50 m/s wind is 5x the
    // reference), far below a respawn or a wrap, which are 0.3 or more.
    gl.uniform1f(d.loc.u_jump, 12 * stepMercator);
    // A GL line is one pixel wide. A coloured streak keeps that width, inside a
    // light edge one pixel either side drawn first (four offset passes), so the
    // colour holds against both dark and light cloud.
    const px = [2 / gl.drawingBufferWidth, 2 / gl.drawingBufferHeight];
    const halo = tintFrame ? [[-1, 0], [1, 0], [0, -1], [0, 1]] : [];
    const body = [[0, 0]];
    for (const shift of shifts) {
      gl.uniform1f(d.loc.u_worldShift, shift);
      for (const [pass, offsets] of [[1, halo], [0, body]]) {
        gl.uniform1f(d.loc.u_halo, pass);
        for (const [ox, oy] of offsets) {
          gl.uniform2f(d.loc.u_shift, ox * px[0], oy * px[1]);
          gl.drawArrays(gl.LINES, 0, this.particleCount * 2);
        }
      }
    }

    const swap = this.posA; this.posA = this.posB; this.posB = swap;
    this.finish(gl);
  }

  // Hand the context back roughly as MapLibre expects to find it. Leaving the
  // active texture unit at 2 will corrupt the next layer's bindings.
  finish(gl) {
    gl.activeTexture(gl.TEXTURE0);
    this.map.triggerRepaint();
  }
}

// Time display. Default is the browser's own time zone; the user can switch to
// UTC and the choice is remembered. Everything time-related goes through here.
const TZ_KEY = "klimatikal.tz";
const tzStore = {
  get() { try { return localStorage.getItem(TZ_KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(TZ_KEY, v); } catch (e) { /* private mode */ } },
};
const INDONESIA_TZ = {
  "Asia/Jakarta": "WIB", "Asia/Pontianak": "WIB",
  "Asia/Makassar": "WITA", "Asia/Ujung_Pandang": "WITA", "Asia/Jayapura": "WIT",
};
function localTzName(d) {
  const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  if (INDONESIA_TZ[zone]) return INDONESIA_TZ[zone];
  const p = new Intl.DateTimeFormat("en-GB", { timeZoneName: "short" }).formatToParts(d)
    .find((x) => x.type === "timeZoneName");
  return p ? p.value : "local";
}
function tzParts(d, utc) {
  const o = utc ? { timeZone: "UTC" } : {};
  const f = (opts) => d.toLocaleDateString("en-GB", { ...opts, ...o });
  const two = (v) => String(v).padStart(2, "0");
  const hr = utc ? d.getUTCHours() : d.getHours();
  const mn = utc ? d.getUTCMinutes() : d.getMinutes();
  return {
    hr, mn, hm: `${two(hr)}:${two(mn)}`,
    day: f({ weekday: "short", day: "numeric", month: "short" }),
    dayShort: f({ weekday: "short", day: "numeric" }),
    dayLong: f({ weekday: "long", day: "numeric", month: "long", year: "numeric" }),
    label: utc ? "UTC" : localTzName(d),
  };
}

const ICON_SAT = `<svg ${SVG_ATTR}><rect x="6.2" y="6.2" width="3.6" height="3.6" rx=".6" transform="rotate(45 8 8)"/><path d="M3.2 4.8l1.6-1.6 2 2-1.6 1.6zM9.2 10.8l1.6-1.6 2 2-1.6 1.6z"/><path d="M12.2 2.8c.9.9 1.4 2 1.5 3.2"/></svg>`;
// Cyclone symbol for the map, as pixels for map.addImage: 28 css px drawn at 2x.
// solid: coloured disc with a white spiral (a warned cyclone); otherwise a
// coloured spiral on a faint disc (a suspect area). `clockwise` is the southern
// hemisphere's sense of rotation.

const RADAR_LABEL =ICON_RADAR + "Radar";

class App {

  // Which copies of the world are visible, so particles repeat when zoomed out.
  worldShifts() {

  textureFor(layer, index) {

          this.map && this.map.triggerRepaint();
        }
        this.pending.delete(key);
      }).catch((err) => { console.warn(err); this.pending.delete(key); });
      img.src = `${this.runPrefix}/${layer}/f${String(step).padStart(3, "0")}.png`;
      this.pending.set(key, p);
    }
    return null;
  }

  // What to draw: the chosen preset's stack, or (no preset) the selected layer
  // with wind particles over it, which is how the page always behaved.
  renderStack() {
    const preset = this.preset && PRESETS[this.preset];
    if (preset) return preset.stack;
    return [{ kind: "fill", ramp: this.layer }, { kind: "particles", layer: "wind" }];
  }

  // Contour spacing for the current zoom: the last [minZoom, interval] row reached.
  contourInterval(item) {
    const z = this.map ? this.map.getZoom() : 0;
    let v = item.intervalByZoom[0][1];
    for (const [minZoom, interval] of item.intervalByZoom) if (z >= minZoom) v = interval;
    return v;
  }

  // --- contour labels -------------------------------------------------------
  // The coloured lines are drawn by the GPU and have no geometry, so the
  // numbers on them come from tracing the same field on the CPU and handing the
  // polylines to a MapLibre symbol layer that writes along them. It follows the
  // preset (off when the preset has no labelled contour), the view, the zoom
  // (line spacing) and the time.
  contourLabelItem() {
    const p = this.preset && PRESETS[this.preset];
    return p && p.stack.find((i) => i.kind === "contour" && i.labelEvery);
  }

  scheduleContourLabels() {
    clearTimeout(this.clTimer);
    this.clTimer = setTimeout(() => { this.updateContourLabels(); this.updateHazard(); }, 150);
  }

  // The layer's values as a Float32Array on the PNG's own grid. Cached, newest
  // few only: a grid is 4 MB.
  async valueGrid(layer, index) {
    const step = this.steps[Math.max(0, Math.min(this.steps.length - 1, index))];
    const key = `${layer}/${step}`;
    this.gridCache = this.gridCache || new Map();
    if (this.gridCache.has(key)) return this.gridCache.get(key);
    const spec = this.manifest.layers[layer];
    const img = new Image();
    img.crossOrigin = "anonymous";
    await new Promise((resolve, reject) => {
      img.onload = resolve; img.onerror = () => reject(new Error(`failed to load ${key}`));
      img.src = `${this.runPrefix}/${layer}/f${String(step).padStart(3, "0")}.png`;
    });
    const cv = document.createElement("canvas");
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    const cx = cv.getContext("2d", { willReadFrequently: true });
    cx.drawImage(img, 0, 0);
    const px = cx.getImageData(0, 0, cv.width, cv.height).data;
    const out = new Float32Array(cv.width * cv.height);
    const g = spec.gamma || 1, span = spec.max - spec.min, wide = spec.encoding === "scalar16";
    for (let n = 0; n < out.length; n++) {
      const unit = wide ? (px[n * 4] * 256 + px[n * 4 + 1]) / 65535 : px[n * 4] / 255;
      out[n] = Math.pow(unit, g) * span + spec.min;
    }
    let grid = out;
    if (wide) {                                   // same smoothing as the contour shader: the cell and four around it, ISO_BLUR away
      const w = cv.width, h = cv.height, R = ISO_BLUR;
      grid = new Float32Array(out.length);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        grid[y * w + x] = 0.2 * (out[y * w + x]
          + out[y * w + Math.max(0, x - R)] + out[y * w + Math.min(w - 1, x + R)]
          + out[Math.max(0, y - R) * w + x] + out[Math.min(h - 1, y + R) * w + x]);
      }
    }
    this.gridCache.set(key, grid);
    while (this.gridCache.size > 6) this.gridCache.delete(this.gridCache.keys().next().value);
    return grid;
  }

  async updateContourLabels() {
    const map = this.map, src = map && map.getSource("contour-labels");
    if (!src) return;
    const item = this.contourLabelItem();
    const empty = { type: "FeatureCollection", features: [] };
    if (!item) {
      if (this.clKey) { this.clKey = null; src.setData(empty); const ex = map.getSource("contour-extrema"); if (ex) ex.setData(empty); }
      return;
    }

    const g = this.manifest.grid, res = 360 / g.width;
    const step = Math.max(this.contourInterval(item), item.labelEvery);
    const b = map.getBounds(), pad = 6;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const x0 = clamp(Math.floor((b.getWest() - pad + 180) / res), 0, g.width - 2);
    const x1 = clamp(Math.ceil((b.getEast() + pad + 180) / res), x0 + 1, g.width - 1);
    const y0 = clamp(Math.floor((90 - (b.getNorth() + pad)) / res), 0, g.height - 2);
    const y1 = clamp(Math.ceil((90 - (b.getSouth() - pad)) / res), y0 + 1, g.height - 1);
    const key = [item.layer, step, Math.round(this.stepIndex * 4), x0, x1, y0, y1].join();
    if (key === this.clKey) return;
    const token = this.clToken = (this.clToken || 0) + 1;

    const i = Math.floor(this.stepIndex), blend = this.stepIndex - i;
    let A, B;
    try { [A, B] = await Promise.all([this.valueGrid(item.layer, i), this.valueGrid(item.layer, i + 1)]); }
    catch (err) { console.warn("contour labels unavailable", err); return; }
    if (token !== this.clToken) return;                // a newer request superseded this one

    const ww = x1 - x0 + 1, wh = y1 - y0 + 1, vals = new Float32Array(ww * wh);
    for (let y = 0; y < wh; y++) for (let x = 0; x < ww; x++) {
      const n = (y0 + y) * g.width + x0 + x;
      vals[y * ww + x] = A[n] + (B[n] - A[n]) * blend;
    }
    const features = [];
    for (const [level, lines] of traceContours(vals, ww, wh, step)) {
      for (const line of lines) {
        if (line.length < 8) continue;                 // a speck: no room for a number
        features.push({ type: "Feature", properties: { t: String(level), v: level }, geometry: { type: "LineString",
          coordinates: smoothLine(line).map(([x, y]) => [-180 + (x0 + x) * res, 90 - (y0 + y) * res]) } });
      }
    }
    const points = [];
    if (item.extrema) {
      for (const e of findExtrema(vals, ww, wh, item.extrema.radius, item.extrema.depth)) {
        points.push({ type: "Feature", properties: { k: e.kind, v: String(Math.round(e.v)), d: e.depth },
          geometry: { type: "Point", coordinates: [-180 + (x0 + e.x) * res, 90 - (y0 + e.y) * res] } });
      }
    }
    this.clKey = key;
    src.setData({ type: "FeatureCollection", features });
    const ex = map.getSource("contour-extrema");
    if (ex) ex.setData({ type: "FeatureCollection", features: points });
  }

  // The label layer sits under the place names, so a town always wins a collision.
  addContourLabels() {
    const map = this.map;
    const ci = Object.values(PRESETS).flatMap((p) => p.stack).find((i) => i.kind === "contour" && i.labelEvery);
    const ramp = RAMPS[ci.ramp];
    map.addSource("contour-labels", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addLayer({
      id: "contour-labels", type: "symbol", source: "contour-labels",
      layout: {
        "symbol-placement": "line", "symbol-spacing": 260, "text-field": ["get", "t"],
        "text-font": ["Open Sans Semibold"], "text-max-angle": 45, "text-padding": 3,
        // Town names are 11.5 px (13 for capitals) at every zoom. These are a
        // step smaller and grow a little with zoom, topping out at 83% of a town.
        "text-size": ["interpolate", ["linear"], ["zoom"], 2, 8, 6, 9.5],
      },
      paint: { "text-color": ["interpolate", ["linear"], ["get", "v"],
                 ...ramp.stops.flatMap(([v, c]) => [v, `rgb(${c[0]},${c[1]},${c[2]})`])],
               "text-halo-color": "rgba(8,12,24,0.9)",
               "text-halo-width": 1.3, "text-halo-blur": 0.3 },
    });
    // H and L at the centres of high and low, in the ends of the contour colour
    // ramp (red high, blue low), with the height under the letter. Deeper
    // centres win a collision.
    const end = (i) => { const c = ramp.stops[i][1]; return `rgb(${c[0]},${c[1]},${c[2]})`; };
    map.addSource("contour-extrema", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addLayer({
      id: "contour-extrema", type: "symbol", source: "contour-extrema",
      layout: {
        "text-field": ["format", ["get", "k"], { "font-scale": 1 }, "\n", {}, ["get", "v"], { "font-scale": 0.5 }],
        "text-font": ["Open Sans Semibold"], "text-size": ["interpolate", ["linear"], ["zoom"], 2, 15, 6, 22],
        "text-line-height": 1, "text-padding": 6, "symbol-sort-key": ["-", 0, ["get", "d"]],
      },
      paint: { "text-color": ["case", ["==", ["get", "k"], "H"], end(ramp.stops.length - 1), end(0)],
               "text-halo-color": "rgba(8,12,24,0.92)", "text-halo-width": 1.6, "text-halo-blur": 0.3 },
    });
  }

  hazardSpec() {
    const p = this.preset && PRESETS[this.preset];
    return p && p.hazard;
  }

  // Warning symbols over the areas at or above the hazard level. The visible
  // cells are binned into blocks of about blockPx screen pixels (a block is hot
  // if any cell in it reaches the level), hot blocks within one block of each
  // other are joined, and each joined area gets one symbol at the hot block
  // nearest its centre of mass, labelled with its peak. The block size follows
  // the zoom, which is what makes the grouping dynamic.
  async updateHazard() {
    const map = this.map, src = map && map.getSource("hazard");
    if (!src) return;
    const h = this.hazardSpec();
    const empty = { type: "FeatureCollection", features: [] };
    if (!h || !this.manifest.layers[h.layer]) { if (this.hzKey) { this.hzKey = null; src.setData(empty); } return; }
    const marks = RAMPS[PRESETS[this.preset].main].marks || [];
    const level = (marks.find(([, name]) => name === h.level) || [Infinity])[0];
    const extreme = (marks[marks.length - 1] || [Infinity])[0];

    const g = this.manifest.grid, res = 360 / g.width;
    const pxPerCell = 512 * Math.pow(2, map.getZoom()) / 360 * res;
    const k = Math.max(1, Math.round(h.blockPx / pxPerCell));
    const b = map.getBounds(), pad = 2;
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const x0 = clamp(Math.floor((b.getWest() - pad + 180) / res), 0, g.width - 1);
    const x1 = clamp(Math.ceil((b.getEast() + pad + 180) / res), x0, g.width - 1);
    const y0 = clamp(Math.floor((90 - (b.getNorth() + pad)) / res), 0, g.height - 1);
    const y1 = clamp(Math.ceil((90 - (b.getSouth() - pad)) / res), y0, g.height - 1);
    const key = [h.layer, level, k, Math.round(this.stepIndex * 4), x0, x1, y0, y1].join();
    if (key === this.hzKey) return;
    const token = this.hzToken = (this.hzToken || 0) + 1;

    const i = Math.floor(this.stepIndex), blend = this.stepIndex - i;
    let A, B;
    try { [A, B] = await Promise.all([this.valueGrid(h.layer, i), this.valueGrid(h.layer, i + 1)]); }
    catch (err) { console.warn("hazard symbols unavailable", err); return; }
    if (token !== this.hzToken) return;

    const bw = Math.ceil((x1 - x0 + 1) / k), bh = Math.ceil((y1 - y0 + 1) / k);
    const peak = new Float32Array(bw * bh).fill(-Infinity), px = new Float32Array(bw * bh), py = new Float32Array(bw * bh);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const n = y * g.width + x, v = A[n] + (B[n] - A[n]) * blend;
      if (v < level) continue;
      const bi = Math.floor((y - y0) / k) * bw + Math.floor((x - x0) / k);
      if (v > peak[bi]) { peak[bi] = v; px[bi] = x; py[bi] = y; }
    }
    const seen = new Uint8Array(bw * bh), features = [];
    for (let s0 = 0; s0 < peak.length; s0++) {
      if (seen[s0] || peak[s0] < level) continue;
      let top = -Infinity, sx = 0, sy = 0, sw = 0, members = [];
      const stack = [s0]; seen[s0] = 1;
      while (stack.length) {
        const c = stack.pop(); members.push(c);
        const w = peak[c] - level + 0.1;
        sx += px[c] * w; sy += py[c] * w; sw += w; top = Math.max(top, peak[c]);
        const cx = c % bw, cy = (c - cx) / bw;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {   // within one empty block of each other
          const nx = cx + dx, ny = cy + dy;
          if (nx < 0 || ny < 0 || nx >= bw || ny >= bh) continue;
          const m = ny * bw + nx;
          if (!seen[m] && peak[m] >= level) { seen[m] = 1; stack.push(m); }
        }
      }
      // the member block closest to the centre of mass
      sx /= sw; sy /= sw;
      let best = members[0], bd = Infinity;
      for (const m of members) { const d = (px[m] - sx) ** 2 + (py[m] - sy) ** 2; if (d < bd) { bd = d; best = m; } }
      features.push({ type: "Feature", properties: { peak: Math.round(top), x: top >= extreme ? 1 : 0, n: members.length },
        geometry: { type: "Point", coordinates: [-180 + (px[best] + 0.5) * res, 90 - (py[best] + 0.5) * res] } });
    }
    this.hzKey = key;
    src.setData({ type: "FeatureCollection", features });
  }

  addHazardLayer() {
    const map = this.map;
    // Warning triangle, drawn once: rounded, white edge, "!" cut in white.
    const tri = (fill) => {
      const S = 64, cv = document.createElement("canvas"); cv.width = cv.height = S;
      const c = cv.getContext("2d");
      c.lineJoin = "round"; c.lineWidth = 6;
      c.beginPath(); c.moveTo(S / 2, 7); c.lineTo(S - 7, S - 10); c.lineTo(7, S - 10); c.closePath();
      c.fillStyle = fill; c.strokeStyle = "#fff"; c.fill(); c.stroke();
      c.fillStyle = "#fff"; c.fillRect(S / 2 - 3.5, 24, 7, 17);
      c.beginPath(); c.arc(S / 2, 48, 4.2, 0, Math.PI * 2); c.fill();
      return c.getImageData(0, 0, S, S);
    };
    map.addImage("hazard-danger", tri("#e0312b"), { pixelRatio: 2 });
    map.addImage("hazard-extreme", tri("#7a1fa2"), { pixelRatio: 2 });
    map.addSource("hazard", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addLayer({
      id: "hazard", type: "symbol", source: "hazard",
      layout: {
        "icon-image": ["case", ["==", ["get", "x"], 1], "hazard-extreme", "hazard-danger"],
        "icon-size": ["interpolate", ["linear"], ["zoom"], 2, 0.55, 7, 0.8],
        "icon-allow-overlap": false, "icon-padding": 4,
        "text-field": ["concat", ["to-string", ["get", "peak"]], "°"],
        "text-font": ["Open Sans Semibold"], "text-size": 10, "text-anchor": "top", "text-offset": [0, 0.75],
        "text-optional": true, "symbol-sort-key": ["-", 0, ["get", "peak"]],
      },
      paint: { "text-color": "#fff", "text-halo-color": "rgba(60,8,8,0.95)", "text-halo-width": 1.5 },
    });
    // The triangles pulse (about 1.4 s a beat) so they catch the eye. Updated at
    // ~12 fps and only while there are triangles to draw; people who ask their
    // system for reduced motion get steady ones.
    const still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!still) this.hazardPulse = setInterval(() => {
      const on = map.getSource("hazard") && this.hzKey && !document.hidden;
      if (!on) return;
      const o = 0.65 + 0.35 * Math.cos((performance.now() / 1400) * 2 * Math.PI);   // 0.3 .. 1
      map.setPaintProperty("hazard", "icon-opacity", o);
      map.setPaintProperty("hazard", "text-opacity", Math.max(o, 0.6));
    }, 80);
    // The first pass can run before the map has its final size; redo it once settled.
    map.once("idle", () => { this.hzKey = null; this.scheduleContourLabels(); });
  }

  // ---- Day and night ---------------------------------------------------------
  // The sun's position from the date alone (low-precision almanac formulas,
  // good to a fraction of a degree): its declination, and the longitude where
  // it is overhead. Elevation anywhere follows from those two numbers.
  sunAt(date) {
    const rad = Math.PI / 180;
    const n = date.getTime() / 86400000 - 10957.5;               // days since J2000.0
    const L = 280.460 + 0.9856474 * n, gm = (357.528 + 0.9856003 * n) * rad;
    const lam = (L + 1.915 * Math.sin(gm) + 0.020 * Math.sin(2 * gm)) * rad;
    const eps = (23.439 - 0.0000004 * n) * rad;
    const dec = Math.asin(Math.sin(eps) * Math.sin(lam));
    const ra = Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam)) / rad;
    const gmst = (18.697374558 + 24.06570982441908 * n) * 15;      // degrees
    let lng = (ra - gmst) % 360;
    if (lng > 180) lng -= 360; if (lng < -180) lng += 360;
    return { dec, lng };
  }

  sunElevation(sun, lat, lng) {
    const rad = Math.PI / 180;
    return Math.asin(Math.sin(lat * rad) * Math.sin(sun.dec)
      + Math.cos(lat * rad) * Math.cos(sun.dec) * Math.cos((lng - sun.lng) * rad)) / rad;
  }

  // The line where the sun is at `elev` degrees, as two polylines (the evening
  // side east of the sun and the morning side west of it), found latitude by
  // latitude from cos(H) = (sin h - sin lat sin dec) / (cos lat cos dec).
  // Longitudes are left unwrapped and drawn three times (-360, 0, +360), which
  // covers the world copies. `ticks` adds short marks pointing into the dark.
  sunLine(sun, elev, latStep, tickDeg) {
    const rad = Math.PI / 180, sinH = Math.sin(elev * rad), sd = Math.sin(sun.dec), cd = Math.cos(sun.dec);
    const east = [], west = [], ticks = [];
    for (let lat = -85; lat <= 85.001; lat += latStep) {
      const c = (sinH - Math.sin(lat * rad) * sd) / (Math.cos(lat * rad) * cd);
      if (Math.abs(c) > 1) { east.push(null); west.push(null); continue; }    // sun never reaches this height here
      const H = Math.acos(c) / rad;
      east.push([sun.lng + H, lat]); west.push([sun.lng - H, lat]);
      if (tickDeg) { ticks.push([[sun.lng + H, lat], [sun.lng + H + tickDeg, lat]]); ticks.push([[sun.lng - H, lat], [sun.lng - H - tickDeg, lat]]); }
    }
    const runs = [];
    for (const side of [east, west]) {
      let cur = [];
      for (const pt of side) { if (pt) cur.push(pt); else { if (cur.length > 1) runs.push(cur); cur = []; } }
      if (cur.length > 1) runs.push(cur);
    }
    return { runs, ticks };
  }

  dayNightText(lat, lng) {
    if (!this.nightOn) return "";
    const el = this.sunElevation(this.sunAt(this.axis[Math.round(this.pos)].t), lat, lng);
    return (el >= 0 ? "Day" : el >= -18 ? "Twilight" : "Night") + ` · sun ${el.toFixed(0)}°`;
  }

  updateNight() {
    const map = this.map, src = map && map.getSource("night-lines");
    if (!src || !this.axis) return;
    const show = this.nightOn ? "visible" : "none";
    for (const id of ["night-casing", "night-line", "night-twilight", "night-ticks", "night-sun"])
      if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", show);
    if (!this.nightOn) { this.nightKey = null; return; }
    const t = this.axis[Math.round(this.pos)].t;
    const pxPerDeg = 512 * Math.pow(2, map.getZoom()) / 360;
    const key = `${Math.floor(t.getTime() / 60000)}|${Math.round(map.getZoom() * 2)}`;   // once a minute of map time, per half zoom level
    if (key === this.nightKey) return;
    this.nightKey = key;
    const sun = this.sunAt(t);
    const shifts = [-360, 0, 360];
    const line = (runs, props) => runs.flatMap((r) => shifts.map((d) => ({ type: "Feature", properties: props,
      geometry: { type: "LineString", coordinates: r.map(([x, y]) => [x + d, y]) } })));
    const latStep = Math.max(0.5, 14 / pxPerDeg);
    const horizon = this.sunLine(sun, 0, Math.max(0.5, 22 / pxPerDeg), 7 / pxPerDeg);     // ticks every ~22 px, 7 px long
    const features = [
      ...line(this.sunLine(sun, 0, latStep).runs, { k: "horizon" }),
      ...line(this.sunLine(sun, -6, latStep).runs, { k: "civil" }),
      ...line(this.sunLine(sun, -12, latStep).runs, { k: "nautical" }),
      ...horizon.ticks.flatMap((seg) => shifts.map((d) => ({ type: "Feature", properties: { k: "tick" },
        geometry: { type: "LineString", coordinates: seg.map(([x, y]) => [x + d, y]) } }))),
    ];
    src.setData({ type: "FeatureCollection", features });
    const sunPt = map.getSource("night-sun");
    if (sunPt) sunPt.setData({ type: "FeatureCollection", features: shifts.map((d) => ({ type: "Feature", properties: {},
      geometry: { type: "Point", coordinates: [sun.lng + d, sun.dec * 180 / Math.PI] } })) });
  }

  addNightLayers() {
    const map = this.map;
    const before = map.getLayer("coast-casing") ? "coast-casing" : undefined;
    const sunImg = () => {
      const S = 48, cv = document.createElement("canvas"); cv.width = cv.height = S;
      const c = cv.getContext("2d"); c.translate(S / 2, S / 2);
      c.strokeStyle = "#ffd24a"; c.lineWidth = 3; c.lineCap = "round";
      for (let i = 0; i < 8; i++) { c.rotate(Math.PI / 4); c.beginPath(); c.moveTo(0, 11); c.lineTo(0, 18); c.stroke(); }
      c.beginPath(); c.arc(0, 0, 8, 0, Math.PI * 2); c.fillStyle = "#ffd24a"; c.fill();
      c.lineWidth = 2; c.strokeStyle = "rgba(60,40,0,0.8)"; c.stroke();
      return c.getImageData(0, 0, S, S);
    };
    map.addImage("sun", sunImg(), { pixelRatio: 2 });
    const empty = { type: "FeatureCollection", features: [] };
    map.addSource("night-lines", { type: "geojson", data: empty });
    map.addSource("night-sun", { type: "geojson", data: empty });
    const vis = { visibility: this.nightOn ? "visible" : "none" };
    const on = (k) => ["==", ["get", "k"], k];
    // Dark casing under the light lines so they read on pale and dark fields alike.
    map.addLayer({ id: "night-casing", type: "line", source: "night-lines", filter: ["any", on("horizon"), on("tick")],
      layout: { ...vis, "line-cap": "round" }, paint: { "line-color": "rgba(8,12,24,0.5)", "line-width": 3.4 } }, before);
    map.addLayer({ id: "night-twilight", type: "line", source: "night-lines", filter: ["any", on("civil"), on("nautical")],
      layout: vis, paint: { "line-color": "rgba(255,255,255,0.75)", "line-width": 1, "line-dasharray": [2, 3],
        "line-opacity": ["case", on("nautical"), 0.55, 1] } }, before);
    map.addLayer({ id: "night-line", type: "line", source: "night-lines", filter: ["any", on("horizon"), on("tick")],
      layout: { ...vis, "line-cap": "round" }, paint: { "line-color": "rgba(255,255,255,0.95)", "line-width": 1.5 } }, before);
    map.addLayer({ id: "night-sun", type: "symbol", source: "night-sun",
      layout: { ...vis, "icon-image": "sun", "icon-size": 0.6, "icon-allow-overlap": true } });
    this.updateNight();
  }

  contourIntervalText() {
    const c = this.renderStack().find((i) => i.kind === "contour");
    return c ? String(this.contourInterval(c)) : "";
  }

  // A preset is offered only when the run has every layer it needs, and
  // isobars only from a 16-bit field (older runs have 8-bit pressure, which
  // draws as thick wandering bands).
  presetAvailable(id) {
    return PRESETS[id].stack.every((i) => {
      const spec = this.manifest.layers[i.kind === "particles" ? i.layer : dataOf(i)];
      return spec && (i.kind !== "contour" || spec.encoding === "scalar16");
    });
  }

  setPreset(id) {
    this.preset = id;
    if (id) this.layer = PRESETS[id].main;
    this.paintLayerButtons();
    this.writeURL(); this.paintReadoutLabel(); this.paintLegend(); this.paintBoundaryStyle();
    this.scheduleContourLabels();
    this.map && this.map.triggerRepaint();
  }

  paintLayerButtons() {
    document.querySelectorAll("#layers button[data-layer]").forEach((c) =>
      c.setAttribute("aria-pressed", String(!this.preset && c.dataset.layer === this.layer)));
    document.querySelectorAll("#layers button[data-preset]").forEach((c) =>
      c.setAttribute("aria-pressed", String(c.dataset.preset === this.preset)));
  }

  // The layer whose PNG colours the map and feeds the hover value. Wind is
  // drawn from the 16-bit speed layer when the run has one (the u/v pair is
  // only 8-bit and bands in light wind); the particles still use u/v. Runs
  // published before that layer existed fall back to u/v.
  fieldSource(name) {
    const src = FIELD_SOURCE[name];
    return src && this.manifest.layers[src] ? src : name;
  }

  // The frame to draw: two steps and how far between them we are.
  currentFrame(layerName) {
    const name = layerName || this.layer;
    const spec = this.manifest.layers[name];
    if (!spec) return null;
    const i = Math.floor(this.stepIndex);
    const now = this.textureFor(name, i);
    if (!now) return null;
    const next = this.textureFor(name, i + 1) || now;
    return { name, spec, now, next, blend: this.stepIndex - i };
  }

  buildChrome() {
    const box = document.getElementById("layers");
    const available = Object.keys(PRESETS).filter((id) => this.presetAvailable(id)).sort((a, b) => PRESETS[a].order - PRESETS[b].order);
    for (const id of available) {
      const b = document.createElement("button");
      b.className = "preset";
      b.textContent = PRESETS[id].label;
      b.title = PRESETS[id].goal;
      b.dataset.preset = id;
      b.onclick = () => this.setPreset(this.preset === id ? null : id);
      box.appendChild(b);
    }
    if (available.length) {
      const sep = document.createElement("span");
      sep.className = "sep";
      box.appendChild(sep);
    }
    for (const name of Object.keys(this.manifest.layers)) {
      if (this.manifest.layers[name].hidden) continue;   // data-only layers, e.g. windspeed
      const b = document.createElement("button");
      b.textContent = this.manifest.layers[name].label;
      b.dataset.layer = name;
      b.onclick = () => {
        this.layer = name;
        this.preset = null;
        this.paintLayerButtons();
        this.writeURL();
        this.scheduleContourLabels(); this.paintReadoutLabel(); this.paintLegend(); this.paintBoundaryStyle();
        this.map && this.map.triggerRepaint();
      };
      box.appendChild(b);
    }

    this.paintLayerButtons();
    document.getElementById("legend").addEventListener("click", (e) => {
      if (!e.target.closest(".info")) return;
      this.legendInfo = !this.legendInfo;
      try { localStorage.setItem("klimatikal.legendinfo", this.legendInfo ? "1" : "0"); } catch (err) { /* ignore */ }
      this.paintLegend();
    });

    // Hide / show the variable bar; starts expanded, remembers the last choice.
    const vars = document.getElementById("vars");

      vars.dataset.collapsed = String(!open);

    };

    try { savedOpen = localStorage.getItem("klimatikal.vars") !== "0"; } catch (e) { /* ignore */ }
    setVars(savedOpen, false);
    varsBtn.onclick = () => setVars(vars.dataset.collapsed === "true", true);
    new ResizeObserver(() =>
      document.documentElement.style.setProperty("--vars-h", `${vars.offsetHeight + 12}px`)).observe(vars);

    // The grid and label toggles are not weather layers: icon buttons, top right.
    const tools = document.getElementById("maptools");
    const grid = document.createElement("button");
    grid.className = "toggle";
    grid.title = "Coordinate grid";
    grid.setAttribute("aria-label", "Coordinate grid");
    grid.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M5.5 1.5v13M10.5 1.5v13M1.5 5.5h13M1.5 10.5h13"/></svg>';
    grid.setAttribute("aria-pressed", String(this.gridOn));
    grid.onclick = () => {
      this.gridOn = !this.gridOn;
      grid.setAttribute("aria-pressed", String(this.gridOn));
      this.drawGrid(); this.writeURL();
    };
    tools.appendChild(grid);

    const labels = document.createElement("button");
    labels.className = "toggle";
    labels.innerHTML = '<span class="aa" aria-hidden="true">Aa</span>';
    labels.setAttribute("aria-label", "Place labels");
    labels.title = "City, country, sea and lake names";
    labels.setAttribute("aria-pressed", String(this.labelsOn));
    labels.onclick = () => {
      this.labelsOn = !this.labelsOn;
      labels.setAttribute("aria-pressed", String(this.labelsOn));
      this.showLabels(this.labelsOn); this.writeURL();
    };
    tools.appendChild(labels);

    night.onclick = () => {
      this.nightOn = !this.nightOn;
      night.setAttribute("aria-pressed", String(this.nightOn));
      this.nightKey = null; this.updateNight(); this.writeURL();
    };

    const radarSep = document.createElement("span");
    radarSep.className = "sep";
    box.appendChild(radarSep);
    const radar = document.createElement("button");
    radar.className = "toggle";
    radar.innerHTML = RADAR_LABEL;
    radar.title = "Latest BMKG radar composite per station";
    radar.setAttribute("aria-pressed", String(this.radarOn));
    radar.onclick = () => this.setRadar(!this.radarOn);

    box.appendChild(satSep);
    const sat = document.createElement("button");

    satOp.type = "range"; satOp.className = "op"; satOp.min = "15"; satOp.max = "100"; satOp.value = "100";
    satOp.setAttribute("aria-label", "Satellite opacity");

        if (this.map.getLayer(id)) this.map.setPaintProperty(id, "raster-opacity", +satOp.value / 100);
