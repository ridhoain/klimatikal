    // Wind streaks on or off, for any layer or preset that has them.
    const windSep = document.createElement("span");
    windSep.className = "sep";
    box.appendChild(windSep);
    const wind = document.createElement("button");
    wind.className = "toggle";
    wind.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6h8a2.2 2.2 0 1 0-2.2-2.2"/><path d="M1.5 10h10.5a2.2 2.2 0 1 1-2.2 2.2"/><path d="M1.5 8h5"/></svg>';
    wind.setAttribute("aria-label", "Wind streaks");
    wind.title = "Show or hide the moving wind streaks";
    wind.setAttribute("aria-pressed", String(this.windOn));
    wind.onclick = () => {
      this.windOn = !this.windOn;
      wind.setAttribute("aria-pressed", String(this.windOn));
      this.writeURL();
      this.map && this.map.triggerRepaint();
    };
    box.appendChild(wind);

    // Tropical systems (JTWC invests and cyclones), icon only like the wind toggle.
    const storm = document.createElement("button");
    storm.className = "toggle";
    storm.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="1.4"/><path d="M8 6.6C8 3.8 5.6 2.4 3 3.2c2.4.2 3.4 1.6 3.2 3.2"/><path d="M9.4 8c2.8 0 4.2 2.4 3.4 5-.2-2.4-1.6-3.4-3.2-3.2"/></svg>';
    storm.setAttribute("aria-label", "Tropical systems");
    storm.title = "Tropical cyclones and disturbances (Joint Typhoon Warning Center)";
    storm.setAttribute("aria-pressed", String(this.tropicalOn));
    storm.onclick = () => this.setTropical(!this.tropicalOn);
    box.appendChild(storm);
    this.tropicalBtn = storm;

    const slider = document.getElementById("slider");
    this.axis = this.buildAxis();
    slider.max = String(this.axis.length - 1);
    slider.oninput = () => { this.setPos(+slider.value); this.onTimeChange(); };
    this.setPos(Math.round(this.stepIndex));

    this.buildTicks();
    const tzBtns = document.querySelectorAll("#tz button");
    const paintTz = () => tzBtns.forEach((b) =>
      b.setAttribute("aria-pressed", String((b.dataset.tz === "utc") === this.useUTC)));
    paintTz();
    tzBtns.forEach((b) => b.onclick = () => {
      const utc = b.dataset.tz === "utc";
      if (utc === this.useUTC) return;
      this.useUTC = utc; tzStore.set(utc ? "utc" : "local");
      paintTz(); this.buildTicks(); this.onTimeChange(); this.paintLegend();
    });
    const timeBox = document.getElementById("time");
    new ResizeObserver(() =>
      document.documentElement.style.setProperty("--time-h", `${timeBox.offsetHeight}px`)).observe(timeBox);
    // The bar's width changes with the stamp text beside it, not just the window.
    new ResizeObserver(() => this.layoutTickLabels()).observe(document.getElementById("ticks"));

    const play = document.getElementById("play");
    play.onclick = () => {
      this.playing = !this.playing;
      play.textContent = this.playing ? "❚❚" : "▶";
      if (!this.playing) delete play.dataset.wait;
      if (this.playing) this.tick();
    };

    this.paintCredit();
    this.paintReadoutLabel();
    this.paintLegend();
    this.onTimeChange();
  }

  paintCredit() {
    const sat = this.satOn && this.satManifest ? ` · ${escapeHTML(this.satManifest.attribution)}` : "";
    // Radar credit comes from the radar manifest, so it appears only while the
    // layer is on and the manifest names a source. The demo manifest has none.
    const rm = this.radarManifest;
    const radar = this.radarOn && rm && !rm.demo && rm.attribution ? ` · ${escapeHTML(rm.attribution)}` : "";
    const storms = this.tropicalOn && this.tropical && this.tropical.attribution ? ` · ${escapeHTML(this.tropical.attribution)}` : "";
    document.getElementById("credit").innerHTML =
      `© 2026 Klimatikal · ${escapeHTML(this.manifest.attribution)} · run ${escapeHTML(this.manifest.run)}${sat}${radar}${storms} · <a href="/privacy/">Privacy</a>`;
  }

  // Colour key for the active layer, built from the same RAMPS table the
  // shader's colour texture is built from.
  paintLegend() {
    const preset = this.preset && PRESETS[this.preset];
    // The key follows what is drawn: a preset whose main layer is shown as lines
    // names the ramp those lines use.
    const r = RAMPS[(preset && preset.keyRamp) || this.layer];
    const spec = this.manifest.layers[this.layer];
    if (!r) return;
    const [lo, hi] = r.display;
    const n = r.stops.length;
    const at = (i) => (r.evenLegend ? i / (n - 1) : (r.stops[i][0] - lo) / (hi - lo));
    // The key shows the minimum end as solid white, matching the map where
    // there is no precipitation (or no value).
    const gradient = r.stops.map(([, c], i) =>
      (i === 0 && r.legendMinWhite)
        ? `rgb(255,255,255) ${(at(i) * 100).toFixed(1)}%`
        : `rgba(${c[0]},${c[1]},${c[2]},${(c[3] / 255 * r.opacity).toFixed(3)}) ${(at(i) * 100).toFixed(1)}%`
    ).join(", ");
    const ticks = r.evenLegend
      ? r.stops.map(([v], i) => ({ v, p: at(i) }))
      : r.ticks.map((v) => ({ v, p: (v - lo) / (hi - lo) }));
    // A ramp with `marks` names its thresholds (heat danger levels): each gets a
    // line across the bar and its name beside it.
    const named = r.marks && r.marks.map(([v, name]) => ({ v, text: `${name} ${v}`, p: (v - lo) / (hi - lo) }));
    let html = this.legendColumn(spec ? spec.label : this.layer, r.unitLabel, gradient, named || ticks, "", !!named);
    if (this.radarOn) html += this.radarLegendHTML();
    if (this.satOn && this.satManifest) html += this.satLegendHTML();
    // "i" shows the plain-language reading of the map; hidden until asked for.
    if (preset && preset.explain) {
      html = `<button type="button" class="info" aria-pressed="${this.legendInfo}" aria-label="What does this map show?" ` +
        `title="What does this map show?">i</button>` + html;
      if (this.legendInfo) {
        html += `<div class="explain">` + preset.explain.map((n) =>
          `<p>${escapeHTML(n.replace("{interval}", this.contourIntervalText()))}</p>`).join("") + `</div>`;
      }
    }
    document.getElementById("legend").innerHTML = html;
    // Colour keys for layers that have no bar: their own box.
    const keys = document.getElementById("legend2");
    keys.hidden = !(preset && preset.keys);
    keys.innerHTML = preset && preset.keys ? preset.keys.map((k) =>
      `<div class="col"><div class="title">${escapeHTML(k.title)}</div>` +
      `<div class="rows">` + k.rows.map((r2) => `<div class="row"><i class="sw" style="background:rgb(${r2.swatch.join(",")})"></i>${escapeHTML(r2.text)}</div>`).join("") +
      `</div></div>`).join("") : "";
  }

  // One vertical key: low values at the bottom, high at the top. `ticks` are
  // {v, p} with p in 0..1 along the bar.
  legendColumn(title, unit, gradient, ticks, note = "", named = false) {
    const last = ticks.length - 1;
    return `<div class="col">` +
      `<div class="title"><span>${escapeHTML(title)}</span><span>${escapeHTML(unit)}</span></div>` +
      `<div class="body"><div class="ticks${named ? " named" : ""}">` + ticks.map((t, i) =>
        `<span class="${named ? "" : i === 0 ? "first" : i === last ? "last" : ""}" ` +
        `style="bottom:${(t.p * 100).toFixed(1)}%">${escapeHTML(String(t.text || t.v))}</span>`).join("") + `</div>` +
      `<div class="bar" style="background-image:linear-gradient(to top, ${gradient})">` +
      (named ? ticks.map((t) => `<i class="mk" style="bottom:${(t.p * 100).toFixed(1)}%"></i>`).join("") : "") + `</div></div>` +
      (note ? `<div class="note">${escapeHTML(note)}</div>` : "") + `</div>`;
  }

  // Satellite key, drawn from the colour table the pipeline coloured the image
  // with (it travels in sat/manifest.json), so key and image cannot disagree.
  satLegendHTML() {
    const m = this.satManifest;
    const lo = m.colormap[0][0], hi = m.colormap[m.colormap.length - 1][0];
    const at = (v) => (v - lo) / (hi - lo);
    const gradient = m.colormap.map(([v, c]) => `rgb(${c[0]},${c[1]},${c[2]}) ${(at(v) * 100).toFixed(1)}%`).join(", ");
    const t = this.satFrame ? new Date(this.satFrame.t) : null;
    const fmt = (u) => { const p = tzParts(t, u); return `${p.hm} ${p.label}`; };
    const note = !t ? "No satellite image for this time"
      : `Observed ${fmt(this.useUTC)} (${fmt(!this.useUTC)})`;
    return this.legendColumn(m.label, m.unit, gradient,
      m.legend_ticks.map((v) => ({ v, p: at(v) })), note);
  }

  // A second key beside the main one while the radar overlay is on. Separate
  // block, not a sixth RAMPS entry: radar is a toggle over whatever parameter
  // is selected, not one of the five fields.
  radarLegendHTML() {
    const rr = RADAR_RAMP;
    const lo = rr.ticks[0], hi = rr.ticks[rr.ticks.length - 1];
    const at = (v) => (v - lo) / (hi - lo);
    const gradient = rr.stops.map(([v, c]) =>
      `rgba(${c[0]},${c[1]},${c[2]},${(c[3] / 255).toFixed(3)}) ${(at(v) * 100).toFixed(1)}%`
    ).join(", ");
    return this.legendColumn("Radar", rr.unitLabel, gradient,
      rr.ticks.map((v) => ({ v, p: at(v) })), "Synthetic placeholder for a few cities, not from BMKG.");
  }

  // Latitude/longitude grid on a canvas laid over the map. Spacing is chosen
  // from the zoom so lines stay about 90px apart, and it is redrawn on every
  // move, so it stays "dynamic" as you pan and zoom.
  drawGrid() {
    const cv = document.getElementById("grid");
    const map = this.map;
    if (!cv || !map) return;
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    }
    const ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (!this.gridOn) return;

    const pxPerDeg = 512 * Math.pow(2, map.getZoom()) / 360;
    const STEPS = [0.1, 0.25, 0.5, 1, 2, 5, 10, 15, 30, 45, 90];
    const step = STEPS.find((s) => s * pxPerDeg >= 90) || 90;
    const num = (v) => String(+v.toFixed(2));
    const b = map.getBounds();
    const south = Math.max(-85, b.getSouth()), north = Math.min(85, b.getNorth());
    // Keep the longitude labels clear of the layer panel, which grows to two
    // rows on a narrow screen.
    const labelTop = document.getElementById("chrome").getBoundingClientRect().bottom + 10;

    // Kept quiet on purpose: the grid is a reference, and the weather and the
    // coastline are what the eye should land on.
    const lb = this.lightBase();
    const GRID_LINE = lb ? "rgba(0,0,0,0.13)" : "rgba(255,255,255,0.11)";
    ctx.lineWidth = 1;
    ctx.strokeStyle = GRID_LINE;
    ctx.font = "11px ui-sans-serif, system-ui, sans-serif";
    ctx.textBaseline = "middle";
    const halo = (text, x, y, align) => {
      ctx.textAlign = align;
      ctx.lineWidth = 3; ctx.strokeStyle = lb ? "rgba(255,255,255,0.85)" : "rgba(8,12,24,0.7)"; ctx.strokeText(text, x, y);
      ctx.fillStyle = lb ? "rgba(25,32,50,0.8)" : "rgba(225,232,248,0.72)"; ctx.fillText(text, x, y);
      ctx.lineWidth = 1; ctx.strokeStyle = GRID_LINE;
    };

    const k0 = Math.ceil(b.getWest() / step), k1 = Math.floor(b.getEast() / step);
    for (let k = k0; k <= k1 && k - k0 < 400; k++) {
      const lng = k * step;
      const x = Math.round(map.project([lng, 0]).x) + 0.5;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      const wrapped = ((((lng + 180) % 360) + 360) % 360) - 180;
      const abs = Math.abs(wrapped);
      const hemi = abs === 0 || abs === 180 ? "" : wrapped < 0 ? "W" : "E";
      if (x > 24 && x < w - 24) halo(`${num(abs)}°${hemi}`, x, labelTop, "center");
    }
    const j0 = Math.ceil(south / step), j1 = Math.floor(north / step);
    for (let j = j0; j <= j1 && j - j0 < 400; j++) {
      const lat = j * step;
      const y = Math.round(map.project([0, lat]).y) + 0.5;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      const hemi = lat === 0 ? "" : lat < 0 ? "S" : "N";
      if (y > labelTop + 20 && y < h - 70) halo(`${num(Math.abs(lat))}°${hemi}`, 8, y - 8, "left");
    }
  }

  tick() {
    if (!this.playing) return;
    let p = this.pos + 0.08;
    if (p > this.axis.length - 1) p = 0;
    // Hold the slider where it is until the next picture has arrived, then
    // carry on; a short look-ahead keeps slow connections from stalling often.
    const play = document.getElementById("play");
    if (!this.readyAt(p)) {
      play.dataset.wait = "1";
    } else {
      delete play.dataset.wait;
      for (let k = 1; k <= 3; k++) this.readyAt(Math.min(this.axis.length - 1, Math.round(p) + k));
      this.setPos(p);
      this.onTimeChange();
    }
    requestAnimationFrame(() => this.tick());
  }

  // --- the time axis ------------------------------------------------------
  // forecast-step index (fractional) for a clock time, by the manifest's steps
  siAt(date) {
    const hours = (date.getTime() - this.runStart.getTime()) / 3600e3;
    const st = this.steps, last = st.length - 1;
    if (hours <= st[0]) return 0;
    if (hours >= st[last]) return last;
    let k = 0;
    while (st[k + 1] <= hours) k++;
    return k + (hours - st[k]) / (st[k + 1] - st[k]);
  }

  // Entries {kind, t, si, frame?}. Without satellite: the forecast steps, as
  // always. With it: the satellite frames (observed, past), then only the
  // forecast steps that come after the newest frame, so the slider reads as one
  // timeline "last few hours as observed, then what is forecast". Forecast
  // hours older than the window are left out while the satellite is on.
  buildAxis() {
    const fc = this.steps.map((h, i) => ({ kind: "fc", si: i, t: this.validAt(i) }));
    if (!(this.satOn && this.satLoaded && this.satManifest)) return fc;
    const maxT = this.validAt(this.steps.length - 1).getTime();
    const sat = this.satManifest.frames
      .filter((f) => f.bounds && !this.satBad.has(f.image))
      .map((f) => { const t = new Date(f.t); return { kind: "sat", frame: f, t, si: this.siAt(t) }; })
      .filter((e) => !isNaN(e.t) && e.t.getTime() >= this.runStart.getTime() && e.t.getTime() <= maxT)
      .sort((a, b) => a.t - b.t);
    if (!sat.length) return fc;
    const after = sat[sat.length - 1].t.getTime() + 15 * 60e3;
    return sat.concat(fc.filter((e) => e.t.getTime() > after));
  }

  setPos(p) {
    const n = this.axis.length;
    p = Math.max(0, Math.min(n - 1, p));
    this.pos = p;
    const i = Math.floor(p), j = Math.min(i + 1, n - 1);
    this.stepIndex = this.axis[i].si + (this.axis[j].si - this.axis[i].si) * (p - i);
    document.getElementById("slider").value = String(Math.round(p));
  }

  // Rebuild after the satellite is switched, loaded, refreshed or loses a frame.
  // Keeps the same clock time (nearest entry) unless told to jump to the newest
  // satellite frame, which is what you want on switching it on.
  rebuildAxis({ toLatestSat = false } = {}) {
    const cur = this.axis && this.axis[Math.round(this.pos)];
    const when = cur ? cur.t.getTime() : this.validAt(Math.round(this.stepIndex)).getTime();
    this.axis = this.buildAxis();
    document.getElementById("slider").max = String(this.axis.length - 1);
    let target = 0, best = Infinity;
    this.axis.forEach((e, i) => { const d = Math.abs(e.t.getTime() - when); if (d < best) { best = d; target = i; } });
    if (toLatestSat) {
      for (let i = this.axis.length - 1; i >= 0; i--) if (this.axis[i].kind === "sat") { target = i; break; }
    }
    this.buildTicks();
    this.setPos(target);
    this.onTimeChange();
  }

  // A tick for every entry of the axis (satellite ones in blue), taller at
  // 12:00 and 00:00 UTC, and a date label at each 00:00 UTC plus the first
  // entry. Labels are dropped, not squeezed, when there is no room (see
  // layoutTickLabels); every label is also a button that jumps to that time.
  buildTicks() {
    const box = document.getElementById("ticks");
    const n = this.axis.length;
    box.textContent = "";
    this.tickLabels = [];
    const frac = (i) => (n > 1 ? i / (n - 1) : 0);
    const utc = this.useUTC;
    const two = (v) => String(v).padStart(2, "0");
    let prevDay = null;
    for (let i = 0; i < n; i++) {
      const e = this.axis[i], d = e.t, p = tzParts(d, utc), hr = p.hr;
      // A "day" tick is the first entry of each calendar day in the chosen zone.
      // In local time midnight may fall between entries (Jakarta midnight is
      // 17:00 UTC), so compare dates rather than testing for hour 0.
      const dayStart = prevDay !== null && p.dayLong !== prevDay;
      prevDay = p.dayLong;
      const t = document.createElement("i");
      if (e.kind === "sat") t.className = "sat";
      else if (dayStart) t.className = "day"; else if (hr === 12) t.className = "half";
      t.style.left = `${frac(i) * 100}%`;
      box.appendChild(t);
      if ((e.kind === "fc" && dayStart) || i === 0) {
        const b = document.createElement("button");
        b.type = "button";
        if (e.kind === "sat") {
          b.className = "sat";
          b.textContent = `Satellite ${p.hm}${utc ? "Z" : ""}`;
        } else {
          b.textContent = p.dayShort + (dayStart && hr === 0 ? "" : ` ${two(hr)}${utc ? "Z" : ":00"}`);
        }
        b.title = `${p.dayLong} ${p.hm} ${p.label}`;
        b.style.left = `${frac(i) * 100}%`;
        b.onclick = () => { this.setPos(i); this.onTimeChange(); };
        box.appendChild(b);
        this.tickLabels.push({ el: b, x: frac(i) });
      }
    }
    this.layoutTickLabels();
  }

  layoutTickLabels() {
    const box = document.getElementById("ticks");
    const w = box.clientWidth;
    if (!w || !this.tickLabels) return;
    let lastRight = -Infinity;
    for (const { el, x } of this.tickLabels) {
      el.hidden = false;
      const half = el.offsetWidth / 2;
      // Slide edge labels inwards so they stay inside the bar, and keep a label
      // only if it clears the previous one.
      const centre = Math.min(Math.max(x * w, half - 8), w + 8 - half);
      const ok = centre - half >= lastRight + 6;
      el.hidden = !ok;
      if (ok) { el.style.left = `${centre}px`; lastRight = centre + half; }
    }
  }

  onTimeChange() {
    const entry = this.axis[Math.round(this.pos)];
    const d = entry.t;
    // Main line in the chosen zone (browser-local by default); the other zone
    // sits underneath, with its date only when it differs.
    const main = tzParts(d, this.useUTC), other = tzParts(d, !this.useUTC);
    const hasSat = this.axis.some((e) => e.kind === "sat");
    const tag = hasSat
      ? `<small class="${entry.kind === "sat" ? "obs" : ""}">${entry.kind === "sat" ? "Satellite observation" : "Forecast"}</small>` : "";
    document.getElementById("stamp").innerHTML =
      `${main.day} ${main.hm} ${main.label}` +
      `<small>${other.day} ${other.hm} ${other.label}</small>${tag}`;
    this.applySatelliteTime(entry);
    this.updateNight();
    this.textureFor(this.fieldSource(this.layer), Math.floor(this.stepIndex) + 1);  // prefetch
    if (this.contourLabelItem() || this.hazardSpec()) this.scheduleContourLabels();
    this.writeURL();
    this.map && this.map.triggerRepaint();
  }

  paintReadoutLabel() {
    const spec = this.manifest.layers[this.layer];
    document.getElementById("readout-label").textContent = spec ? spec.label : "";
  }

  readURL() {
    const h = new URLSearchParams(location.hash.slice(1));
    if (h.get("layer") && this.manifest.layers[h.get("layer")] && !this.manifest.layers[h.get("layer")].hidden) this.layer = h.get("layer");
    const pid = h.get("preset");
    if (pid && PRESETS[pid] && this.presetAvailable(pid)) { this.preset = pid; this.layer = PRESETS[pid].main; }
    if (h.get("step")) {
      this.stepIndex = Math.max(0, Math.min(this.steps.length - 1, +h.get("step")));
      this.stepFromURL = true;
    }
    this.view = h.get("at") ? h.get("at").split(",").map(Number) : null;
    if (h.get("grid") !== null) this.gridOn = h.get("grid") !== "0";
    if (h.get("radar") === "1") this.radarOn = true;
    if (h.get("sat") === "1") this.satOn = true;
    if (h.get("labels") !== null) this.labelsOn = h.get("labels") !== "0";
    if (h.get("night") === "1") this.nightOn = true;
    if (h.get("wind") === "0") this.windOn = false;
    if (h.get("storms") === "0") this.tropicalOn = false;
  }

  writeURL() {
    if (!this.map) return;
    const c = this.map.getCenter();
    const at = `${c.lng.toFixed(2)},${c.lat.toFixed(2)},${this.map.getZoom().toFixed(1)}`;
    const h = new URLSearchParams({
      layer: this.layer, ...(this.preset ? { preset: this.preset } : {}), step: String(Math.round(this.stepIndex * 100) / 100), at,
      grid: this.gridOn ? "1" : "0", radar: this.radarOn ? "1" : "0",
      sat: this.satOn ? "1" : "0",
      labels: this.labelsOn ? "1" : "0",
      ...(this.nightOn ? { night: "1" } : {}),
      ...(this.windOn ? {} : { wind: "0" }),
      ...(this.tropicalOn ? {} : { storms: "0" }),
    });
    history.replaceState(null, "", `#${h}`);
  }

  startMap() {
    const [lng, lat, zoom] = this.view && this.view.length === 3 ? this.view : [118, -2, 3.2];
    // The basemap is lines only: coastlines and administrative boundaries,
    // bundled in ./geo (Natural Earth, public domain, simplified). No filled
    // polygons, no labels, no equator or tropic lines. A flat background is the
    // only thing under the weather field.
    // The boundary sources are added after the map has loaded, not in the
    // style: a map "load" waits for every source in the style, and the
    // province lines alone are 45,000 segments. The weather should not wait.
    const style = {
      version: 8,
      // Glyphs for the place and water names, self-hosted (Latin ranges only,
      // so geo/labels-*.json is built with Latin names; see pipeline/build_labels.py).
      glyphs: `${new URL("geo/fonts/", location.href).href}{fontstack}/{range}.pbf`,
      sources: {},
      layers: [{ id: "bg", type: "background", paint: { "background-color": "#0b1020" } }],
    };
    this.map = new maplibregl.Map({
      container: "map",
      style,
      center: [lng, lat], zoom, minZoom: 1, maxZoom: 9,
      attributionControl: { compact: true, customAttribution: "Boundaries: Natural Earth" },
    });
    this.map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
    // The weather layer and the grid are north-up. Rotating would skew both.
    this.map.dragRotate.disable();
    this.map.touchZoomRotate.disableRotation();
    this.map.on("load", () => {
      this.map.addLayer(new WeatherLayer(this));   // sets this.gl via onAdd
      this.paintLegend();   // first painted before the map existed, so the zoom-dependent key was wrong
      const boot = document.getElementById("boot");
      if (boot) boot.remove();
      this.drawGrid();
      // The boundaries are added once the first weather frame has drawn (see
      // WeatherLayer.render), so the forecast is never queued behind line work.
      this.boundariesPending = true;
      // Write the hash once on load. Without this a view is only shareable
      // after the user happens to pan, which is a confusing way to fail.
      this.writeURL();
    });
    this.map.on("move", () => this.drawGrid());
    this.map.on("resize", () => this.drawGrid());
    this.map.on("moveend", () => { this.writeURL(); this.scheduleContourLabels(); this.updateNight(); });
    // The isobar spacing follows zoom, and the key quotes it.
    this.map.on("zoomend", () => { if (this.preset) this.paintLegend(); });
    this.map.on("mousemove", (e) => this.probe(e.lngLat));
    this.map.on("mouseout", () => { document.getElementById("readout").hidden = true; });
  }

  // Coastline and administrative boundaries, drawn above the weather field so
  // the coast stays readable, each with a dark casing so it also reads over
  // pale cloud. Added after the weather layer, so they sit above it. Coast
  // first: it matters most, and the largest file (provinces) goes last.
  // --- tropical systems (JTWC) -------------------------------------------
  // pipeline/jtwc.py publishes tropical/tropical.json every half hour: invests
  // (hollow rings, coloured by development chance) and warned tropical cyclones
  // (filled by intensity, with past track and forecast track). Drawn above the
  // coastlines; a click opens the details.
  async loadTropical() {
    try {
      const res = await fetch(`${DATA}/tropical/tropical.json`, { cache: "no-cache" });
      this.tropical = res.ok ? await res.json() : null;
    } catch (err) {
      console.warn("tropical systems unavailable", err);
      this.tropical = null;
    }
    this.drawTropical();
    this.paintCredit();
  }

  tropicalData() {
    const pts = [], past = [], fc = [], fcPts = [];
    // Keep longitudes continuous along a track so it does not wrap the globe
    // when it crosses the date line.
    const unwrap = (lons) => lons.reduce((acc, lo, i) => {
      if (i) { while (lo - acc[i - 1] > 180) lo -= 360; while (lo - acc[i - 1] < -180) lo += 360; }
      acc.push(lo); return acc;
    }, []);
    for (const s of (this.tropical && this.tropical.systems) || []) {
      const props = { id: s.id, kind: s.kind, name: s.name, kt: s.wind_kt_max ?? s.wind_kt ?? 0, hemi: s.lat < 0 ? "s" : "n",
                      potential: s.potential || "", tcfa: !!s.tcfa,
                      label: s.kind === "tc" ? `${s.name} · ${s.wind_kt_max ?? "?"} kt` : s.id };
      const trackPts = [...(s.past || []).map((p) => [p[1], p[0]]), [s.lon, s.lat]];
      const lons = unwrap(trackPts.map((p) => p[0]));
      const track = trackPts.map((p, i) => [lons[i], p[1]]);
      const here = track[track.length - 1];
      pts.push({ type: "Feature", properties: props, geometry: { type: "Point", coordinates: here } });
      if (track.length > 1) past.push({ type: "Feature", properties: { id: s.id }, geometry: { type: "LineString", coordinates: track } });
      if (s.forecast && s.forecast.length) {
        const flons = unwrap([here[0], ...s.forecast.map((f) => f.lon)]);
        const line = [here, ...s.forecast.map((f, i) => [flons[i + 1], f.lat])];
        fc.push({ type: "Feature", properties: { id: s.id }, geometry: { type: "LineString", coordinates: line } });
        s.forecast.forEach((f, i) => fcPts.push({
          type: "Feature", properties: { id: s.id, kt: f.kt, h: `+${f.h}h`, big: f.h % 24 === 0 },
          geometry: { type: "Point", coordinates: line[i + 1] } }));
      }
    }
    const fcol = (features) => ({ type: "FeatureCollection", features });
    return { pts: fcol(pts), past: fcol(past), fc: fcol(fc), fcPts: fcol(fcPts) };
  }

  drawTropical() {
    if (!this.map || !this.map.getLayer("coast-casing")) return;   // boundaries (and so the style) not built yet
    const d = this.tropicalData();
    const map = this.map;
    const names = { "trop-pts": d.pts, "trop-past": d.past, "trop-fc": d.fc, "trop-fcpts": d.fcPts };
    if (!map.getSource("trop-pts")) {
      for (const [id, data] of Object.entries(names)) map.addSource(id, { type: "geojson", data });
      // Intensity colours for warned cyclones (one-minute wind, kt).
      const ktColor = ["step", ["get", "kt"], "#6ec6ff", 34, "#3fcf8e", 64, "#f2e23b", 83, "#f5a623", 96, "#f0533a", 113, "#d6249f"];
      const FONT = ["Open Sans Semibold"];
      const text = { "text-font": FONT, "text-size": 11, "text-anchor": "top", "text-offset": [0, 1.1],
                     "text-allow-overlap": true, "text-optional": true };
      const halo = { "text-color": "#101a33", "text-halo-color": "rgba(255,255,255,0.92)", "text-halo-width": 1.6 };
      const L = (l) => map.addLayer(l);
      L({ id: "trop-past-casing", type: "line", source: "trop-past", layout: { "line-cap": "round", "line-join": "round" },
          paint: { "line-color": "rgba(8,12,24,0.55)", "line-width": 4 } });
      L({ id: "trop-past", type: "line", source: "trop-past", layout: { "line-cap": "round", "line-join": "round" },
          paint: { "line-color": "#ffffff", "line-width": 2 } });
      L({ id: "trop-fc-casing", type: "line", source: "trop-fc", paint: { "line-color": "rgba(8,12,24,0.55)", "line-width": 4 } });
      L({ id: "trop-fc", type: "line", source: "trop-fc", paint: { "line-color": "#ffffff", "line-width": 2, "line-dasharray": [2, 2] } });
      L({ id: "trop-fcpts", type: "circle", source: "trop-fcpts",
          paint: { "circle-radius": ["case", ["get", "big"], 5, 3.5], "circle-color": ktColor,
                   "circle-stroke-color": "#fff", "circle-stroke-width": 1.2 } });
      L({ id: "trop-fclabel", type: "symbol", source: "trop-fcpts", minzoom: 3.5,
          filter: ["get", "big"], layout: { ...text, "text-field": ["get", "h"], "text-size": 10 }, paint: halo });
      // Invests: hollow ring. Warned cyclones: filled disc.
      // The cyclone symbol: a two-armed spiral round an eye. Drawn once per
      // intensity colour and hemisphere (it turns clockwise south of the
      // equator, anticlockwise north of it). Warned cyclones are a solid disc
      // with a white spiral; invests are a hollow, coloured spiral.
      const KT_COLORS = ["#6ec6ff", "#3fcf8e", "#f2e23b", "#f5a623", "#f0533a", "#d6249f"];
      const POT_COLORS = { low: "#f2d03b", med: "#f39c33", high: "#e5484d" };
      for (const hemi of ["n", "s"]) {
        KT_COLORS.forEach((c, i) => map.addImage(`tc-${i}-${hemi}`, stormIcon(c, true, hemi === "s"), { pixelRatio: 2 }));
        for (const [k, c] of Object.entries(POT_COLORS)) map.addImage(`iv-${k}-${hemi}`, stormIcon(c, false, hemi === "s"), { pixelRatio: 2 });
      }
      const iconBase = { "icon-allow-overlap": true, "icon-ignore-placement": true };
      const hemi = ["get", "hemi"];
      L({ id: "trop-invest", type: "symbol", source: "trop-pts", filter: ["==", ["get", "kind"], "invest"],
          layout: { ...iconBase, "icon-image": ["concat", "iv-", ["match", ["get", "potential"], "high", "high", "medium", "med", "low"], "-", hemi] } });
      L({ id: "trop-tc", type: "symbol", source: "trop-pts", filter: ["==", ["get", "kind"], "tc"],
          layout: { ...iconBase, "icon-image": ["concat", "tc-", ["to-string", ["step", ["get", "kt"], 0, 34, 1, 64, 2, 83, 3, 96, 4, 113, 5]], "-", hemi] } });
      L({ id: "trop-label", type: "symbol", source: "trop-pts", layout: { ...text, "text-field": ["get", "label"], "text-offset": [0, 1.7] }, paint: halo });
      this.tropicalIds = ["trop-past-casing", "trop-past", "trop-fc-casing", "trop-fc", "trop-fcpts", "trop-fclabel",
                          "trop-invest", "trop-tc", "trop-label"];
      for (const id of ["trop-invest", "trop-tc"]) {
        map.on("click", id, (e) => this.tropicalPopup(e));
        map.on("mouseenter", id, () => { map.getCanvas().style.cursor = "pointer"; });
        map.on("mouseleave", id, () => { map.getCanvas().style.cursor = ""; });
      }
    } else {
      for (const [id, data] of Object.entries(names)) map.getSource(id).setData(data);
    }
    this.showTropical(this.tropicalOn);
  }

  showTropical(on) {
    for (const id of this.tropicalIds || []) {
      if (this.map.getLayer(id)) this.map.setLayoutProperty(id, "visibility", on ? "visible" : "none");
    }
  }

  setTropical(on) {
    this.tropicalOn = on;
    if (this.tropicalBtn) this.tropicalBtn.setAttribute("aria-pressed", String(on));
    if (on && !this.tropical) this.loadTropical(); else this.showTropical(on);
    if (!on && this.tropicalPop) this.tropicalPop.remove();
    this.writeURL();
    this.paintCredit();
  }

  tropicalPopup(e) {
    const id = e.features[0].properties.id;
    const s = ((this.tropical && this.tropical.systems) || []).find((x) => x.id === id);
    if (!s) return;
    const when = (iso) => { const p = tzParts(new Date(iso), this.useUTC); return `${p.day} ${p.hm} ${p.label}`; };
    const kmh = (kt) => Math.round(kt * 1.852);
    const row = (k, v) => `<div style="display:flex;justify-content:space-between;gap:14px"><span style="color:#5b6785">${k}</span><span>${v}</span></div>`;
    const wind = s.wind_kt == null ? "—"
      : s.wind_kt === s.wind_kt_max ? `${s.wind_kt} kt (${kmh(s.wind_kt)} km/h)`
      : `${s.wind_kt}–${s.wind_kt_max} kt (${kmh(s.wind_kt)}–${kmh(s.wind_kt_max)} km/h)`;
    const rows = [row("Position", `${Math.abs(s.lat).toFixed(1)}°${s.lat < 0 ? "S" : "N"} ${Math.abs(s.lon).toFixed(1)}°${s.lon < 0 ? "W" : "E"}`),
                  row(s.kind === "tc" ? "Max wind (1 min)" : "Est. wind", wind)];
    if (s.mslp) rows.push(row("Est. pressure", `${s.mslp} hPa`));
    if (s.move) rows.push(row("Moving", `${s.move.deg}° at ${s.move.kt} kt`));
    if (s.potential) rows.push(row("Chance of becoming a cyclone (24 h)", s.potential));
    if (s.tcfa) rows.push(`<div style="color:#b3261e;margin-top:3px">Formation alert issued by JTWC</div>`);
    const fc = (s.forecast || []).map((f) => `<tr><td>+${f.h} h</td><td>${when(f.t)}</td><td style="text-align:right">${f.kt} kt</td></tr>`).join("");
    const html = `<div style="font:12px/1.35 ui-sans-serif,system-ui,sans-serif;color:#101a33;min-width:210px">` +
      `<div style="font-weight:600;font-size:13px">${escapeHTML(s.name)}</div>` +
      `<div style="color:#5b6785;margin-bottom:4px">${escapeHTML(s.class)}${s.basin ? " · " + escapeHTML(s.basin) : ""}</div>` +
      rows.join("") +
      (fc ? `<table style="width:100%;margin-top:6px;border-collapse:collapse;font-size:11px"><caption style="text-align:left;color:#5b6785">JTWC forecast</caption>${fc}</table>` : "") +
      `<div style="margin-top:5px;color:#5b6785">As of ${when(s.t)} · <a href="${s.url ? escapeHTML(s.url) : "https://www.metoc.navy.mil/jtwc/jtwc.html"}" target="_blank" rel="noopener">JTWC</a></div></div>`;
    if (this.tropicalPop) this.tropicalPop.remove();
    this.tropicalPop = new maplibregl.Popup({ maxWidth: "320px", closeButton: true })
      .setLngLat(e.features[0].geometry.coordinates).setHTML(html).addTo(this.map);
  }

  addBoundaries() {
    const geo = (name) => new URL(`geo/${name}.json`, location.href).href;
    const line = (id, source, color, width, { opacity, ...extra } = {}) => this.map.addLayer({
      id, source, type: "line",
      layout: { "line-join": "round", "line-cap": "round" },
      paint: { "line-color": color, "line-width": width,
               ...(opacity ? { "line-opacity": opacity } : {}) },
      ...extra,
    });
    const w = (a, b) => ["interpolate", ["linear"], ["zoom"], 2, a, 8, b];
    const add = (name, layers) => {
      this.map.addSource(name, { type: "geojson", data: geo(name) });
      layers();
    };
    add("coast", () => {
      line("coast-casing", "coast", "rgba(8,12,24,0.5)", w(1.6, 2.6));
      line("coast", "coast", "rgba(255,255,255,0.92)", w(0.8, 1.4));
    });
    add("admin0", () => {
      line("admin0-casing", "admin0", "rgba(8,12,24,0.45)", w(1.4, 2.4));
      line("admin0", "admin0", "rgba(255,255,255,0.7)", w(0.7, 1.3));
    });
    add("admin1", () => {
      // Province lines from zoom 2, fading in so the world view stays clean.
      const fade = ["interpolate", ["linear"], ["zoom"], 2, 0.3, 4, 1];
      line("admin1-casing", "admin1", "rgba(8,12,24,0.35)", w(0.8, 1.6), { minzoom: 2, opacity: fade });
      line("admin1", "admin1", "rgba(255,255,255,0.35)", w(0.4, 0.9), { minzoom: 2, opacity: fade });
    });
    this.paintBoundaryStyle();
    this.addLabels();
    // Storm markers go last so they sit above the coastlines and place names.
    this.loadTropical();
    if (!this.tropicalTimer) this.tropicalTimer = setInterval(() => this.tropicalOn && this.loadTropical(), 15 * 60e3);
  }

  // Coastline and border colours follow the field underneath: white lines
  // vanish on the pale fields (cloud is white, pressure is near-white around
  // 1013 hPa), so those get dark lines with a light casing instead.
  // A preset with `lightBase` draws on a white map: black coast with a soft
  // shadow, dark place names with white outlines, dark wind streaks (the
  // clouds are greys). Everything else is the dark map.
  lightBase() {
    const p = this.preset && PRESETS[this.preset];
    return !!(p && p.lightBase);
  }

  paintBoundaryStyle() {
    const m = this.map;
    if (!m) return;
    const lb = this.lightBase();
    const light = lb || LIGHT_FIELDS.has(this.layer);
    const dark = "rgba(0,0,0,", pale = "rgba(255,255,255,";
    const set = (id, color) => { if (m.getLayer(id)) m.setPaintProperty(id, "line-color", color); };
    set("coast", lb ? dark + "0.75)" : light ? dark + "0.95)" : pale + "0.92)");   // a lighter black on the white map, so the isobars lead
    set("coast-casing", lb ? dark + "0.28)" : light ? pale + "0.6)" : dark + "0.5)");
    set("admin0", light ? dark + "0.7)" : pale + "0.7)");
    set("admin0-casing", light ? pale + "0.45)" : dark + "0.45)");
    set("admin1", light ? dark + "0.5)" : pale + "0.35)");
    set("admin1-casing", light ? pale + "0.35)" : dark + "0.35)");
    // The coast's "shading": on a white map its casing becomes a wide, soft, translucent shadow.
    if (m.getLayer("coast")) {      // thinner black coast on the white map, about the weight of the isobars
      this.coastWidth = this.coastWidth || m.getPaintProperty("coast", "line-width");
      m.setPaintProperty("coast", "line-width", lb ? ["interpolate", ["linear"], ["zoom"], 2, 0.3, 8, 0.6] : this.coastWidth);
    }
    if (m.getLayer("coast-casing")) {
      this.coastCasingWidth = this.coastCasingWidth || m.getPaintProperty("coast-casing", "line-width");
      m.setPaintProperty("coast-casing", "line-width", lb ? ["interpolate", ["linear"], ["zoom"], 2, 4, 6, 7] : this.coastCasingWidth);
      m.setPaintProperty("coast-casing", "line-blur", lb ? 3 : 0);
    }
    if (m.getLayer("bg")) m.setPaintProperty("bg", "background-color", lb ? "#ffffff" : "#0b1020");
    const text = (ids, color, halo) => ids.forEach((id) => {
      if (!m.getLayer(id)) return;
      m.setPaintProperty(id, "text-color", color);
      m.setPaintProperty(id, "text-halo-color", halo);
    });
    const ids = (re) => (this.labelLayerIds || []).filter((id) => re.test(id));
    text(ids(/^label-(water|ocean)/), lb ? "rgba(35,70,125,0.95)" : "rgba(170,205,255,0.95)", lb ? "rgba(255,255,255,0.95)" : "rgba(8,14,34,0.9)");
    text(ids(/^label-city/), lb ? "#10131c" : "#fff", lb ? "rgba(255,255,255,0.95)" : "rgba(8,12,24,0.9)");
    text(ids(/^label-countries/), lb ? "rgba(40,46,62,0.9)" : "rgba(235,240,252,0.85)", lb ? "rgba(255,255,255,0.9)" : "rgba(8,12,24,0.85)");
    for (const id of ["contour-labels", "contour-extrema"])      // pressure numbers and H / L: white outline on the white map
      if (m.getLayer(id)) m.setPaintProperty(id, "text-halo-color", lb ? "rgba(255,255,255,0.95)" : id === "contour-labels" ? "rgba(8,12,24,0.9)" : "rgba(8,12,24,0.92)");
    this.drawGrid();
  }

  // Text labels: oceans/seas/lakes, countries and cities. They are symbol
  // layers on small GeoJSON point files (./geo/labels-*.json), so MapLibre
  // does the "dynamic" part itself: collision detection drops whatever does
  // not fit, and what is kept changes as you zoom and pan. Natural Earth
  // gives each feature a "show from this zoom" rank (mz, in 256px-tile zoom;
  // this map's zoom is one lower). Zoom cannot be used inside a filter, so
  // features are bucketed by whole mz into one layer each, with that layer's
  // minzoom set. Layers added later win collisions, so buckets go least
  // important first; within a bucket the biggest city wins (sort key).
  addLabels() {
    const map = this.map;
    const geo = (name) => new URL(`geo/${name}.json`, location.href).href;
    // A small dot marks the exact place; it collides together with its name.
    const c = document.createElement("canvas");
    c.width = c.height = 16;
    const g = c.getContext("2d");
    g.beginPath(); g.arc(8, 8, 4.5, 0, 7);
    g.fillStyle = "#fff"; g.fill();
    g.lineWidth = 1.8; g.strokeStyle = "rgba(8,12,24,0.85)"; g.stroke();
    map.addImage("city-dot", g.getImageData(0, 0, 16, 16), { pixelRatio: 2 });

    this.addContourLabels();
    this.addHazardLayer();
    this.addNightLayers();
    this.scheduleContourLabels();
    const vis = this.labelsOn ? "visible" : "none";
    const halo = (color) => ({ "text-halo-color": color, "text-halo-width": 1.4, "text-halo-blur": 0.4 });
    const add = (layer) => { map.addLayer({ ...layer, layout: { ...layer.layout, visibility: vis } }); this.labelLayerIds.push(layer.id); };
    const bucketZoom = (k) => Math.max(0, k - 1.5);
    const bucket = (k) => ["all", [">=", ["get", "mz"], k], ["<", ["get", "mz"], k + 1]];
    const FONT = ["Open Sans Semibold"];

    // Water first, so cities and countries sit on top of it.
    map.addSource("labels-water", { type: "geojson", data: geo("labels-water") });
    const waterSize = ["match", ["get", "k"],
      "ocean", 15, "sea", 12.5, "gulf", 11, "bay", 11, "strait", 10.5, "lake", 10.5, 10.5];
    for (let k = 9; k >= 1; k--) {
      add({
        id: `label-water-${k}`, type: "symbol", source: "labels-water",
        filter: ["all", ["!=", ["get", "k"], "ocean"], bucket(k)], minzoom: bucketZoom(k),
        layout: {
          "text-field": ["get", "n"], "text-font": FONT, "text-size": waterSize,
          "text-letter-spacing": 0.14, "text-max-width": 6, "text-padding": 4,
          "symbol-sort-key": ["get", "mz"],
        },
        paint: { "text-color": "rgba(170,205,255,0.95)", ...halo("rgba(8,14,34,0.9)") },
      });
    }
    // Oceans are huge: letter-spaced capitals that fade out once you are in close.
    add({
      id: "label-ocean", type: "symbol", source: "labels-water", filter: ["==", ["get", "k"], "ocean"],
      maxzoom: 5.5,
      layout: { "text-field": ["upcase", ["get", "n"]], "text-font": FONT, "text-size": 15,
                "text-letter-spacing": 0.3, "text-max-width": 8 },
      paint: { "text-color": "rgba(150,190,250,0.85)", ...halo("rgba(8,14,34,0.9)"),
               "text-opacity": ["interpolate", ["linear"], ["zoom"], 4.5, 1, 5.5, 0] },
    });

    map.addSource("labels-cities", { type: "geojson", data: geo("labels-cities") });
    for (let k = 8; k >= 0; k--) {
      add({
        id: `label-city-${k}`, type: "symbol", source: "labels-cities",
        filter: bucket(k), minzoom: bucketZoom(k),
        layout: {
          "icon-image": "city-dot",
          "icon-size": ["case", ["==", ["get", "cap"], 1], 1, 0.8],
          "text-field": ["get", "n"], "text-font": FONT,
          "text-size": ["case", ["==", ["get", "cap"], 1], 13, 11.5],
          "text-variable-anchor": ["right", "left", "top", "bottom"],
          "text-radial-offset": 0.6, "text-max-width": 8, "text-padding": 2,
          "symbol-sort-key": ["-", 0, ["get", "pop"]],
        },
        paint: { "text-color": "#fff", ...halo("rgba(8,12,24,0.9)") },
      });
    }
    // Countries sit above cities (added last, so they win collisions) and fade
    // out by zoom 7. Small states only appear once there is room for them.
    map.addSource("labels-countries", { type: "geojson", data: geo("labels-countries") });
    for (const [id, filter, minzoom] of [
      ["label-countries-minor", [">=", ["get", "r"], 4], 4],
      ["label-countries", ["<", ["get", "r"], 4], 2.2],
    ]) {
      add({
        id, type: "symbol", source: "labels-countries", filter, minzoom, maxzoom: 7,
        layout: {
          "text-field": ["upcase", ["get", "n"]], "text-font": FONT, "text-letter-spacing": 0.1,
          "text-size": ["interpolate", ["linear"], ["zoom"], 2, 10, 6, 14], "text-max-width": 7,
          "symbol-sort-key": ["get", "r"],
        },
        paint: { "text-color": "rgba(235,240,252,0.85)", ...halo("rgba(8,12,24,0.85)"),
                 "text-opacity": ["interpolate", ["linear"], ["zoom"], minzoom, 0, minzoom + 0.8, 1, 6, 1, 7, 0] },
      });
    }
    this.paintBoundaryStyle();               // the labels were just created: give them the current theme
  }

  showLabels(visible) {
    const v = visible ? "visible" : "none";
    for (const id of this.labelLayerIds) {
      if (this.map.getLayer(id)) this.map.setLayoutProperty(id, "visibility", v);
    }
  }

  // --- radar overlay ------------------------------------------------------
  // Toggled by the "Radar" button, or by ?radar=1 / #radar=1 in the
  // URL (handled from WeatherLayer.render, the same way boundariesPending is,
  // since sources can only be added once the map's style has loaded).
  // Everything this fetches is under ${DATA}/radar/: it never calls BMKG
  // directly. See pipeline/bmkg_radar.py.
  setRadar(on) {
    this.radarOn = on;
    if (this.radarBtn) this.radarBtn.setAttribute("aria-pressed", String(on));
    if (on) {
      if (this.radarLoaded) this.showRadar(true);
      else if (!this.radarLoading) this.loadRadarLayers();
    } else if (this.radarLoaded) {
      this.showRadar(false);
    }
    this.writeURL();
    this.paintLegend();
    this.paintCredit();
  }

  // --- satellite overlay (Himawari-9 infrared) ------------------------------
  // The image is Web Mercator, so MapLibre can place it from four lon/lat
  // corners with no distortion. It sits above the weather field, below the
  // radar demo and the coastline, so the coast stays readable on top of it.
  setSatellite(on) {
    this.satOn = on;
    if (this.satBtn) this.satBtn.setAttribute("aria-pressed", String(on));
    if (this.satOpacity) this.satOpacity.hidden = !on;
    if (on) {
      if (this.satLoaded) this.rebuildAxis({ toLatestSat: true });   // jump to "now"
      else if (!this.satLoading) this.loadSatellite({ toLatestSat: true });
    } else if (this.satLoaded) {
      this.showSatellite(false);
      this.rebuildAxis();                                          // back to the forecast axis
    }
    this.writeURL();
    this.paintLegend();
    this.paintCredit();
  }

  showSatellite(visible) {
    for (const id of this.satLayerIds || [])
      if (this.map.getLayer(id)) this.map.setLayoutProperty(id, "visibility", visible ? "visible" : "none");
  }

  satCoordinates(bounds) {
    const { west, south, east, north } = bounds;
    return [[west, north], [east, north], [east, south], [west, south]];
  }

  // Newest manifest: the global mosaic when it is published, else the
  // Himawari-only one.
  async fetchSatManifest() {
    let m;
    try { m = await this.fetchJSON(`${DATA}/sat/global.json`); }
    catch (err) { m = await this.fetchJSON(`${DATA}/sat/manifest.json`); }
    return satNormalise(m);
  }

  // Show the satellite frame that belongs to this slider entry, or hide the
  // layer when the slider is on a forecast time (there is no image for the
  // future). Frames are fetched and decoded off-screen first and the latest
  // request wins, so dragging the slider does not queue up a stack of 4 MB
  // downloads and never shows a half-loaded picture.
  // Fetch and decode every tile of a frame once; the promise is kept so the
  // slider, the play loop and the prefetch all share one download. satReady
  // holds the frames that are fully in the browser cache.
  satFetch(frame) {
    if (!this.satFetched) { this.satFetched = new Map(); this.satReady = new Set(); }
    let p = this.satFetched.get(frame.image);
    if (!p) {
      p = Promise.all(frame.tiles.map((t) => new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(`${DATA}/sat/${t.image}`);
        img.onerror = () => reject(new Error(`failed to load ${t.image}`));
        img.src = `${DATA}/sat/${t.image}`;
      })));
      p.then(() => this.satReady.add(frame.image), () => this.satFetched.delete(frame.image));
      this.satFetched.set(frame.image, p);
    }
    return p;
  }

  // Is everything needed to draw slider position p already loaded? Starts the
  // missing downloads as a side effect. Forecast fields need the step below and
  // the step above (they are blended); a satellite entry needs its whole frame.
  readyAt(p) {
    const n = this.axis.length;
    const entry = this.axis[Math.max(0, Math.min(n - 1, Math.round(p)))];
    let ok = true;
    if (entry.kind === "sat" && this.satOn && this.satLoaded) {
      this.satFetch(entry.frame).catch(() => {
        if (this.satBad.has(entry.frame.image)) return;
        this.satBad.add(entry.frame.image);
        this.rebuildAxis();
      });
      if (!this.satReady.has(entry.frame.image)) ok = false;
    }
    const i = Math.floor(p), j = Math.min(i + 1, n - 1);
    const si = this.axis[i].si + (this.axis[j].si - this.axis[i].si) * (p - i);
    const lo = Math.floor(si);
    const names = new Set();
    for (const item of this.renderStack()) {
      const n = item.kind === "particles" ? item.layer : dataOf(item);
      names.add(this.fieldSource(n)); names.add(n);
    }
    for (const name of names) {
      if (!this.manifest.layers[name]) continue;
      if (!this.textureFor(name, lo)) ok = false;
      if (!this.textureFor(name, lo + 1)) ok = false;
    }
    return ok;
  }

  applySatelliteTime(entry) {
    if (!this.satOn || !this.satLoaded || !this.map) return;
    const frame = entry && entry.kind === "sat" ? entry.frame : null;
    if (!frame) {
      this.showSatellite(false);
      if (this.satFrame) { this.satFrame = null; this.paintLegend(); }
      return;
    }
    this.showSatellite(true);
    if (this.satShown && this.satShown.image === frame.image) {
      if (this.satFrame !== frame) { this.satFrame = frame; this.paintLegend(); }
      return;
    }
    const token = ++this.satSwap;
    // Every tile of the frame is fetched first and they are swapped in together,
    // so the mosaic never shows half of one time and half of another.
    this.satFetch(frame).then((urls) => {
      if (token !== this.satSwap) return;                // a newer request superseded this one
      frame.tiles.forEach((t, i) => {
        const src = this.map.getSource(`sat-${i}`);
        if (src) src.updateImage({ url: urls[i], coordinates: this.satCoordinates(t.bounds) });
      });
      this.satShown = frame;
      this.satFrame = frame;
      this.paintLegend();
    }).catch(() => {
      if (token !== this.satSwap) return;
      console.warn("satellite frame failed to load, dropping it from the slider", frame.image);
      this.satBad.add(frame.image);
      this.rebuildAxis();
    });
  }

  async loadSatellite({ toLatestSat = false } = {}) {
    this.satLoading = true;
    try {
      const m = await this.fetchSatManifest();
      if (!m.frames || !m.frames.length) throw new Error("no satellite frames published yet");
      this.satManifest = m;
      const latest = m.frames[m.frames.length - 1];
      this.satShown = latest;
      const before = this.radarLayerIds.length && this.map.getLayer(this.radarLayerIds[0])
        ? this.radarLayerIds[0]
        : (this.map.getLayer("coast-casing") ? "coast-casing" : undefined);
      // One image source and layer per tile; a single-image manifest has one.
      const tileCount = Math.max(...m.frames.map((f) => f.tiles.length));
      this.satLayerIds = [];
      for (let i = 0; i < tileCount; i++) {
        const t = latest.tiles[Math.min(i, latest.tiles.length - 1)];
        this.map.addSource(`sat-${i}`, {
          type: "image", url: `${DATA}/sat/${t.image}`, coordinates: this.satCoordinates(t.bounds),
        });
        this.map.addLayer({
          id: `sat-${i}`, type: "raster", source: `sat-${i}`,
          paint: { "raster-opacity": this.satOpacity ? +this.satOpacity.value / 100 : 1, "raster-fade-duration": 0 },
          layout: { visibility: "none" },     // applySatelliteTime shows it on a satellite entry
        }, before);
        this.satLayerIds.push(`sat-${i}`);
      }
      this.satLoaded = true;
      // On a plain page load (no time in the URL) start at the newest image.
      this.rebuildAxis({ toLatestSat: toLatestSat || !this.stepFromURL });
      // New frame every ten minutes: look again every few.
      setInterval(() => this.refreshSatellite(), 5 * 60e3);
    } catch (err) {
      console.warn("satellite layer unavailable", err);
      this.satOn = false;
      if (this.satBtn) {
        this.satBtn.setAttribute("aria-pressed", "false");
        this.satBtn.title = "Satellite imagery is not available right now";
      }
      if (this.satOpacity) this.satOpacity.hidden = true;
      this.writeURL();
    } finally {
      this.satLoading = false;
      this.paintLegend();
      this.paintCredit();
    }
  }

  async refreshSatellite() {
    if (!this.satOn || !this.satLoaded) return;
    try {
      const m = await this.fetchSatManifest();
      const last = (x) => x.frames && x.frames[x.frames.length - 1];
      const before = last(this.satManifest), after = last(m);
      if (!after || (before && after.t === before.t)) return;
      // If the slider was sitting on the newest frame, follow it to the new one.
      const cur = this.axis[Math.round(this.pos)];
      const following = cur.kind === "sat" && before && cur.frame.t === before.t;
      this.satManifest = m;
      this.rebuildAxis({ toLatestSat: following });
    } catch (err) {
      console.warn("satellite refresh failed; keeping the current frames", err);
    }
  }

  showRadar(visible) {
    const v = visible ? "visible" : "none";
    for (const id of this.radarLayerIds) this.map.setLayoutProperty(id, "visibility", v);
  }

  // Shown on the button itself for a few seconds, then it goes back to
  // "Radar" so the user can try again.
  flashRadarUnavailable() {
    const btn = this.radarBtn;
    if (!btn) return;
    btn.innerHTML = ICON_RADAR + "Radar unavailable";
    btn.title = "Radar data could not be loaded right now. Try again later.";
    clearTimeout(this.radarMsgTimer);
    this.radarMsgTimer = setTimeout(() => {
      btn.innerHTML = RADAR_LABEL;
      btn.title = "Latest BMKG radar composite per station";
    }, 4000);
  }

  async loadRadarLayers() {
    this.radarLoading = true;
    try {
      const manifest = await this.fetchJSON(`${DATA}/radar/manifest.json`);
      if (!manifest.stations || !manifest.stations.length) throw new Error("radar manifest has no stations");
      this.radarManifest = manifest;
      // Above the colour field, below the coastline, same reasoning as the
      // boundary layers: addBoundaries() usually runs first, but if the user
      // toggles radar before it has, there is nothing to insert before yet,
      // and the layers just land on top for a moment until it catches up.
      const before = this.map.getLayer("coast-casing") ? "coast-casing" : undefined;
      for (const st of manifest.stations) {
        const { south, north, west, east } = st.bounds;
        const srcId = `radar-${st.id}`, layerId = `radar-layer-${st.id}`;
        this.map.addSource(srcId, {
          type: "image",
          url: `${DATA}/radar/${st.image}`,
          coordinates: [[west, north], [east, north], [east, south], [west, south]],
        });
        this.map.addLayer({
          id: layerId, type: "raster", source: srcId,
          paint: { "raster-opacity": 0.75, "raster-fade-duration": 0 },
          layout: { visibility: this.radarOn ? "visible" : "none" },
        }, before);
        this.radarLayerIds.push(layerId);
      }
      this.radarLoaded = true;
    } catch (err) {
      console.warn("radar layer failed to load", err);
      this.radarOn = false;
      if (this.radarBtn) this.radarBtn.setAttribute("aria-pressed", "false");
      this.flashRadarUnavailable();
    } finally {
      this.radarLoading = false;
      this.paintLegend();
      this.paintCredit();
    }
  }

  // Read the value under the cursor from the PNG itself, on a 2D canvas.
  // Same bytes the shader sees, so the number and the colour cannot disagree.
  probe(lngLat) {
    const source = this.fieldSource(this.layer);
    const spec = this.manifest.layers[source];
    const step = this.steps[Math.round(this.stepIndex)];
    const key = `${source}/${step}`;
    const img = this.probeCache && this.probeCache.key === key ? this.probeCache.img : null;
    if (!img) {
      const loading = new Image();
      loading.crossOrigin = "anonymous";
      loading.onload = () => { this.probeCache = { key, img: loading }; };
      loading.src = `${this.runPrefix}/${source}/f${String(step).padStart(3, "0")}.png`;
      return;
    }
    const g = this.manifest.grid;
    const x = Math.round(((lngLat.lng + 180) / 360) * (g.width - 1));
    const y = Math.round(((90 - lngLat.lat) / 180) * (g.height - 1));
    if (!this.probeCanvas) {
      this.probeCanvas = document.createElement("canvas");
      this.probeCanvas.width = g.width; this.probeCanvas.height = g.height;
      this.probeCtx = this.probeCanvas.getContext("2d", { willReadFrequently: true });
    }
    if (this.probeCache.drawn !== key) {
      this.probeCtx.drawImage(img, 0, 0);
      this.probeCache.drawn = key;
    }
    const px = this.probeCtx.getImageData(Math.max(0, x), Math.max(0, y), 1, 1).data;
    const value = decodeOnCPU(spec, px);
    const unit = RAMPS[this.layer].unitLabel;
    const el = document.getElementById("readout");
    el.hidden = false;
    // A ramp that names its thresholds (heat index) also names the level here.
    const marks = RAMPS[this.layer].marks;
    const level = marks ? ([...marks].reverse().find(([v]) => value >= v) || [0, RAMPS[this.layer].marksBelow])[1] : "";
    document.getElementById("readout-value").textContent =
      `${value.toFixed(value < 10 ? 1 : 0)} ${unit}` + (level ? ` · ${level}` : "");
    const dn = this.dayNightText(lngLat.lat, lngLat.lng);
    document.getElementById("readout-pos").textContent =
      `${lngLat.lat.toFixed(2)}, ${lngLat.lng.toFixed(2)}` + (dn ? ` · ${dn}` : "");
  }
}

// Contour lines of a scalar grid (marching squares), joined into polylines, for
// the labels. The colour lines themselves are drawn on the GPU; this only finds
// where to put text, so it works at the grid's own resolution. `v` is w*h values
// row by row; a line is drawn at every multiple of `step`. Returns
// Map(level -> [ [[x, y], ...], ... ]) in fractional grid coordinates.
function traceContours(v, w, h, step) {
  const perLevel = new Map();
  const get = (L) => {
    let s = perLevel.get(L);
    if (!s) { s = { pts: new Map(), list: [] }; perLevel.set(L, s); }
    return s;
  };
  for (let j = 0; j < h - 1; j++) {
    for (let i = 0; i < w - 1; i++) {
      const a = v[j * w + i], b = v[j * w + i + 1], c = v[(j + 1) * w + i + 1], d = v[(j + 1) * w + i];
      const lo = Math.min(a, b, c, d), hi = Math.max(a, b, c, d);
      if (!(hi > lo)) continue;                       // flat, or NaN
      for (let L = Math.ceil(lo / step) * step; L <= hi; L += step) {
        const mask = (a < L ? 1 : 0) | (b < L ? 2 : 0) | (c < L ? 4 : 0) | (d < L ? 8 : 0);
        if (mask === 0 || mask === 15) continue;
        const s = get(L);
        // An edge is named by its cell and direction, so the two cells that share
        // it name it the same way and their segments join up.
        const H = (x, y, v1, v2) => { const k = (y * w + x) * 2; if (!s.pts.has(k)) s.pts.set(k, [x + (L - v1) / (v2 - v1), y]); return k; };
        const V = (x, y, v1, v2) => { const k = (y * w + x) * 2 + 1; if (!s.pts.has(k)) s.pts.set(k, [x, y + (L - v1) / (v2 - v1)]); return k; };
        const T = () => H(i, j, a, b), R = () => V(i + 1, j, b, c), B = () => H(i, j + 1, d, c), Lf = () => V(i, j, a, d);
        const seg = (p, q) => s.list.push([p(), q()]);
        const centreBelow = (a + b + c + d) / 4 < L;
        switch (mask) {
          case 1: case 14: seg(Lf, T); break;
          case 2: case 13: seg(T, R); break;
          case 3: case 12: seg(Lf, R); break;
          case 4: case 11: seg(R, B); break;
          case 6: case 9:  seg(T, B); break;
          case 7: case 8:  seg(Lf, B); break;
          case 5:  if (centreBelow) { seg(T, R); seg(Lf, B); } else { seg(Lf, T); seg(R, B); } break;
          case 10: if (centreBelow) { seg(Lf, T); seg(R, B); } else { seg(T, R); seg(Lf, B); } break;
        }
      }
    }
  }
  const out = new Map();
  for (const [L, s] of perLevel) {
    const adj = new Map();
    s.list.forEach(([p, q], n) => {
      for (const k of [p, q]) { if (!adj.has(k)) adj.set(k, []); adj.get(k).push(n); }
    });
    const used = new Uint8Array(s.list.length);
    const walk = (from) => {                         // follow unused segments out of `from`
      const keys = [];
      for (let at = from; ;) {
        const n = (adj.get(at) || []).find((m) => !used[m]);
        if (n === undefined) break;
        used[n] = 1;
        at = s.list[n][0] === at ? s.list[n][1] : s.list[n][0];
        keys.push(at);
      }
      return keys;
    };
    const lines = [];
    for (let n = 0; n < s.list.length; n++) {
      if (used[n]) continue;
      used[n] = 1;
      const [p, q] = s.list[n];
      const tail = walk(q), head = walk(p);
      lines.push([...head.reverse(), p, q, ...tail].map((k) => s.pts.get(k)));
    }
    out.set(L, lines);
  }
  return out;
}

// Centres of high and low: points that are the maximum (minimum) of everything
// within `r` cells, and stand at least `depth` above (below) the mean of the ring
// at distance r, so a gentle bump on a flat field is not called a high. Cells
// within r of the edge are skipped, since what lies beyond is unknown. Returns
// [{ x, y, v, kind: "H" | "L", depth }].
function findExtrema(v, w, h, r, depth) {
  if (w < 2 * r + 1 || h < 2 * r + 1) return [];
  const rowMax = new Float32Array(w * h), rowMin = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = r; x < w - r; x++) {
    let mx = -Infinity, mn = Infinity;
    for (let k = -r; k <= r; k++) { const q = v[y * w + x + k]; if (q > mx) mx = q; if (q < mn) mn = q; }
    rowMax[y * w + x] = mx; rowMin[y * w + x] = mn;
  }
  const out = [];
  for (let y = r; y < h - r; y++) for (let x = r; x < w - r; x++) {
    const c = v[y * w + x];
    if (!(c > -Infinity)) continue;
    let hi = true, lo = true;
    for (let k = -r; k <= r && (hi || lo); k++) {
      if (rowMax[(y + k) * w + x] > c) hi = false;
      if (rowMin[(y + k) * w + x] < c) lo = false;
    }
    if (!hi && !lo) continue;
    let sum = 0, cnt = 0;
    for (let k = -r; k <= r; k += 2) {
      sum += v[(y - r) * w + x + k] + v[(y + r) * w + x + k] + v[(y + k) * w + x - r] + v[(y + k) * w + x + r];
      cnt += 4;
    }
    const d = c - sum / cnt;
    if (hi && d >= depth) out.push({ x, y, v: c, kind: "H", depth: d });
    else if (lo && -d >= depth) out.push({ x, y, v: c, kind: "L", depth: -d });
  }
  // A plateau can give several equal maxima; keep the first of any pair closer than r.
  return out.filter((e, i) => !out.slice(0, i).some((o) => o.kind === e.kind && Math.hypot(o.x - e.x, o.y - e.y) < r));
}

// A traced line steps cell by cell, so its direction jitters at the scale of a
// label and MapLibre will not bend text along it. A few passes of neighbour
// averaging (ends held fixed, closed loops wrapped) and keeping every other
// point give a line the text can follow; it moves by a fraction of a cell.
function smoothLine(pts, passes = 3) {
  const closed = pts.length > 3 && pts[0][0] === pts[pts.length - 1][0] && pts[0][1] === pts[pts.length - 1][1];
  let cur = closed ? pts.slice(0, -1) : pts.slice();
  const n = () => cur.length;
  for (let p = 0; p < passes && n() > 4; p++) {
    cur = cur.map((pt, i) => {
      if (!closed && (i < 2 || i > n() - 3)) return pt;
      let x = 0, y = 0;
      for (let k = -2; k <= 2; k++) { const q = cur[(i + k + n()) % n()]; x += q[0]; y += q[1]; }
      return [x / 5, y / 5];
    });
  }
  const kept = cur.filter((_, i) => i % 2 === 0 || i === n() - 1);
  return closed ? [...kept, kept[0]] : kept;
}

// Mirrors decodeValue() in GLSL and decode() in encoding.py.
function decodeOnCPU(spec, px) {
  const range = (unit) => Math.pow(Math.min(1, Math.max(0, unit)), spec.gamma || 1) * (spec.max - spec.min) + spec.min;
  if (spec.encoding === "scalar16") return range((px[0] * 256 + px[1]) / 65535);
  if (spec.encoding === "vector8") return Math.hypot(range(px[0] / 255), range(px[1] / 255));
  return range(px[0] / 255);
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

new App().boot().catch((err) => {
  document.getElementById("boot-msg").className = "err";
  document.getElementById("boot-msg").textContent =
    `${err.message}. Serve the pipeline's output at ${DATA}, or pass ?data=<url>.`;
  console.error(err);
});
</script>
