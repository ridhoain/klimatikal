# Newest global infrared mosaic (Himawari-9 + GOES-West + GOES-East) -> R2,
# every 10 minutes. Runs alongside satellite.yml (Himawari only), which stays
# as the site's fallback: the page reads sat/global.json first and falls back to
# sat/manifest.json. Retire satellite.yml once this one has proven itself.
#
# Timing is the same as satellite.yml: a slot is fully uploaded to the NOAA
# buckets about 14 minutes after its nominal time, the job walks back from
# "now" to the newest complete slot, and odd minutes dodge GitHub's schedule
# delays. Offset by two minutes from satellite.yml so the two do not start
# together.
name: build global satellite frame

on:
  schedule:
    - cron: "9,19,29,39,49,59 * * * *"
  push:
    branches: [main]
    paths:
      - pipeline/satglobal.py
      - pipeline/requirements-satglobal.txt
      - .github/workflows/satellite-global.yml
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the newest slot is already published"
        type: boolean
        default: false

concurrency:
  group: satellite-global
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-satglobal.txt

      - run: pip install -r pipeline/requirements-satglobal.txt

      - name: Build and publish the newest frame
        working-directory: pipeline
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        # Scheduled runs add up to 3 missing frames; a push or manual run adds
        # up to 8, and the 3-hour window fills over the next few scheduled runs
        # (a frame takes longer than a Himawari-only one, so this stays well
        # inside the job's time limit).
        run: python satglobal.py ${{ (inputs.force || github.event_name == 'push') && '--force' || '' }} --max-new ${{ github.event_name == 'schedule' && 3 || 8 }}
