# Newest BMKG radar frame per station -> R2.
#
# MANUAL ONLY, ON PURPOSE. BMKG has not confirmed in writing that third parties
# may republish this feed (see pipeline/radar_demo_gen.py, "open items"), so
# there is no schedule. Once permission is on file, enable the schedule below.
# The source returns only the newest frame per call, so history exists only
# while this runs often: 5-minute cadence would be "*/5 * * * *" but GitHub
# delays and drops scheduled runs, so expect gaps; a host with cron is steadier.
name: build radar frames

on:
  workflow_dispatch:
   schedule:
     - cron: "3,13,23,33,43,53 * * * *"

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-bmkg-radar.txt

      - run: pip install -r pipeline/requirements-bmkg-radar.txt

      - name: Fetch and publish the newest radar frames
        working-directory: pipeline
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python bmkg_radar.py
