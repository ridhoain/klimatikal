# Fallback runner, for when Oracle has no capacity or you would rather not
# own a VM. Free with standard runners on a public repository.
#
# Two traps this file works around:
#   - GitHub disables scheduled workflows after 60 days with no repository
#     activity, silently. The heartbeat job below commits a timestamp weekly.
#   - Scheduled runs are delayed under load, worst on the hour. The minutes
#     below are deliberately odd, and the job polls for the run anyway.
name: build forecast run

on:
  schedule:
    # ECMWF open data is not ready one to two hours after the nominal time; it
    # lands much later, and the lag differs by cycle. Measured from the
    # Last-Modified header on the GRIB files, 11-12 Nov 2026 (all UTC):
    #   00z -> 07:34    12z -> 19:34    (about 7h34 after the nominal time)
    #   06z -> 12:27    18z -> 00:27    (about 6h27 after the nominal time)
    # Each run is scheduled about 15-20 minutes after its files appear, with
    # odd minutes because GitHub delays scheduled runs, worst on the hour.
    # Re-measure if builds start picking up the previous cycle.
    - cron: "52 7,19 * * *"     # 00z and 12z
    - cron: "47 0,12 * * *"     # 18z and 06z
  workflow_dispatch:        # always pair this with a schedule: it is how you test
    inputs:
      force:
        description: "Rebuild even if the newest run is already published"
        type: boolean
        default: false

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Build and publish the run
        working-directory: pipeline
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        # A scheduled build that starts before ECMWF has uploaded the next cycle
        # finds the current one already published and exits in seconds. Tick
        # "force" on a manual run to rebuild anyway.
        run: python build_run.py ${{ inputs.force && '--force' || '' }}

  heartbeat:
    # Keeps the schedule alive. Without it the pipeline stops after 60 quiet
    # days and nothing tells you.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Touch a file once a week
        run: |
          if [ "$(date -u +%u)" != "1" ]; then echo "not Monday, skipping"; exit 0; fi
          date -u +"%Y-%m-%dT%H:%MZ" > .heartbeat
          git config user.name  "klimatikal-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add .heartbeat
          git diff --staged --quiet || git commit -m "chore: keep scheduled workflows enabled"
          git push
